openapi: "3.1.0"
info:
  title: "Forma Site Design — integrate"
  version: v1
  description: |-
    Forma Site Design — integrate.
    Autodesk 문서에서 자동 추출됨. 원본: https://aps.autodesk.com/en/docs/forma/v1
    공통 base 경로: /forma/integrate
    **리전 — 호출 전 반드시 확인** Forma 는 리전별로 완전히 분리된 별개 시스템입니다. 리소스 식별자(urn 등)는 리전을 넘어 유효하지 않습니다. - HTTP API: 호스트는 하나(`developer.api.autodesk.com`)이고, **`X-Ads-Region` 헤더로 리전을 지정**합니다 (`US` | `EMEA`, 미지정 시 `US`). - 웹앱/임베디드 뷰: `app.autodeskforma.com`(US) 과 `app.autodeskforma.eu`(EMEA) 로 도메인 자체가 다릅니다. - 리전이 틀리면 인증이 정상이어도 **403** 이 납니다. 문서의 403 설명이 그대로 "Are you in the right region?" 입니다.
servers:
  - url: "https://developer.api.autodesk.com"
x-forma-group: integrate
x-forma-common-base: "/forma/integrate"
paths:
  "/forma/integrate/v1alpha/elements/{elementId}":
    post:
      operationId: integrate-updateelementwithoutrevision-POST
      summary: "Creates a new element with a new revision under the specified element ID"
      description: |-
        Creates a new element with a new revision under the specified
        element ID. Useful to keep track of changes in geometry in the same
        logically evolving entity.
      deprecated: true
      parameters:
        - name: elementId
          in: path
          required: true
          schema:
            type: string
            x-forma-type: string
        - name: authcontext
          in: query
          required: true
          description: "Authcontext for the request, such as the Forma project context."
          schema:
            type: string
            x-forma-type: string
        - name: s3Id
          in: query
          description: |-
            If the payload for the request is larger than 6 MB it needs to be uploaded to S3
            instead because AWS Lambda can only receive 6 MB. To do this make a GET request
            to /upload-link?authcontext=${authcontext}. You’ll get back an ID and a URL as
            JSON. First upload your payload by making a PUT request to the URL with your
            elements as the body. Then make a POST request with no body where s3Id is
            the ID you got from the request to /upload-link.
          schema:
            type: string
            x-forma-type: string
        - name: nextRevision
          in: query
          description: "Optionally specify the element revision. Must be an epoch timestamp in ms."
          schema:
            type: string
            x-forma-type: string
        - name: X-Ads-Region
          in: header
          description: "Specifies the geographical location (region) of the service. US or EMEA. Defaults to US."
          schema:
            type: string
            x-forma-type: string
        - name: Content-Type
          in: header
          required: true
          description: "Must be application/json"
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:read"
            - "data:write"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  urn:
                    type: string
                    x-forma-type: string
                  id:
                    type: string
                    x-forma-type: string
                  revision:
                    type: string
                    x-forma-type: string
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context optional"
      x-forma-scopes:
        - "data:read"
        - "data:write"
      x-forma-doc: "https://aps.autodesk.com/en/docs/forma/v1/reference/http-reference/integrate-updateelementwithoutrevision-POST"
