                              transform:
                                type: array
                                items:
                                  type: number
                                x-forma-type: "array: number"
                                description: "A 4x4 matrix representing the transformation of the element"
                              name:
                                type: string
                                x-forma-type: string
                                description: "User defined naming of this specific reference, typically used to distinguish elements in eg. UI listings"
                          x-forma-type: "array: object"
                          description: "A collection of child elements"
                    x-forma-type: "array: object"
                    description: "List of proposal elements at the specified page."
                  pagination:
                    type: object
                    x-forma-type: object
                    description: "The information for paginating records returned by the endpoint."
                    properties:
                      limit:
                        type: number
                        x-forma-type: number
                        description: "The limit value supplied in the request or the default value."
                      nextUrl:
                        type: string
                        x-forma-type: string
                        description: "URL for retrieving the next page of items. If there are no more items, this field will not be present."
        "400":
          description: "Bad Request"
