          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "412":
          description: "Precondition failed. One or more preconditions for this endpoint was not met. See response for details."
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/forma/v1/reference/http-reference/proposal-listrevisions-GET"
