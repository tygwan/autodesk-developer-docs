openapi: "3.1.0"
info:
  title: "Forma Site Design — proposal"
  version: v1
  description: |-
    Forma Site Design — proposal.
    Autodesk 문서에서 자동 추출됨. 원본: https://aps.autodesk.com/en/docs/forma/v1
    공통 base 경로: /forma/proposal/v1alpha/proposals
    **리전 — 호출 전 반드시 확인** Forma 는 리전별로 완전히 분리된 별개 시스템입니다. 리소스 식별자(urn 등)는 리전을 넘어 유효하지 않습니다. - HTTP API: 호스트는 하나(`developer.api.autodesk.com`)이고, **`X-Ads-Region` 헤더로 리전을 지정**합니다 (`US` | `EMEA`, 미지정 시 `US`). - 웹앱/임베디드 뷰: `app.autodeskforma.com`(US) 과 `app.autodeskforma.eu`(EMEA) 로 도메인 자체가 다릅니다. - 리전이 틀리면 인증이 정상이어도 **403** 이 납니다. 문서의 403 설명이 그대로 "Are you in the right region?" 입니다.
servers:
  - url: "https://developer.api.autodesk.com"
x-forma-group: proposal
x-forma-common-base: "/forma/proposal/v1alpha/proposals"
paths:
  "/forma/proposal/v1alpha/proposals/{proposalId}/revisions/{revision}":
    put:
      operationId: proposal-putproposal-PUT
      summary: "Update a proposal"
      description: "Update a proposal"
      parameters:
        - name: proposalId
          in: path
          required: true
          schema:
            type: string
            x-forma-type: string
        - name: revision
          in: path
          required: true
          schema:
            type: string
            x-forma-type: string
        - name: authcontext
          in: query
          required: true
          description: "The authcontext of the resource you are requesting."
          schema:
            type: string
            x-forma-type: string
        - name: X-Ads-Region
          in: header
          description: "Specifies the geographical location (region) of the service. US or EMEA. Defaults to US."
          schema:
            type: string
            x-forma-type: string
        - name: Content-Type
          in: header
          required: true
          description: "Must be application/json"
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:read"
            - "data:write"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  urn:
                    type: string
                    x-forma-type: string
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "412":
          description: "Precondition failed. One or more preconditions for this endpoint was not met. See response for details."
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:read"
        - "data:write"
      x-forma-doc: "https://aps.autodesk.com/en/docs/forma/v1/reference/http-reference/proposal-putproposal-PUT"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                name:
                  type: string
                  x-forma-type: string
                  description: "A human-readable name for the proposal"
                terrain:
                  type: object
                  x-forma-type: object
                  description: "The terrain element (required). Must be an element from the “terrain” element system"
                  properties:
                    urn:
                      type: string
                      x-forma-type: string
                      description: "A Forma element URN"
                    key:
                      type: string
                      x-forma-type: string
                      description: "Unique id under parent. Used to build up paths. Prefer short values for space efficiency. Since element URNs cannot be used to identify _instances_ of elements, children have unique keys under their parent which are used to build up a path in context of the root of an element tree."
                    transform:
                      type: array
                      items:
                        type: number
                      x-forma-type: "array: number"
                      description: "A 4x4 matrix representing the transformation of the element"
                    name:
                      type: string
                      x-forma-type: string
                      description: "User defined naming of this specific reference, typically used to distinguish elements in eg. UI listings"
                  required:
                    - key
                    - urn
                base:
                  type: object
                  x-forma-type: object
                  description: "The base element. Must be an element from the “group” element system"
                  properties:
                    urn:
                      type: string
                      x-forma-type: string
                      description: "A Forma element URN"
                    key:
                      type: string
                      x-forma-type: string
                      description: "Unique id under parent. Used to build up paths. Prefer short values for space efficiency. Since element URNs cannot be used to identify _instances_ of elements, children have unique keys under their parent which are used to build up a path in context of the root of an element tree."
                    transform:
                      type: array
                      items:
                        type: number
                      x-forma-type: "array: number"
                      description: "A 4x4 matrix representing the transformation of the element"
                    name:
                      type: string
                      x-forma-type: string
                      description: "User defined naming of this specific reference, typically used to distinguish elements in eg. UI listings"
                  required:
                    - key
                    - urn
                children:
                  type: array
                  items:
                    type: object
                    properties:
                      urn:
                        type: string
                        x-forma-type: string
                        description: "A Forma element URN"
                      key:
                        type: string
                        x-forma-type: string
                        description: "Unique id under parent. Used to build up paths. Prefer short values for space efficiency. Since element URNs cannot be used to identify _instances_ of elements, children have unique keys under their parent which are used to build up a path in context of the root of an element tree."
                      transform:
                        type: array
                        items:
                          type: number
                        x-forma-type: "array: number"
                        description: "A 4x4 matrix representing the transformation of the element"
                      name:
                        type: string
                        x-forma-type: string
                        description: "User defined naming of this specific reference, typically used to distinguish elements in eg. UI listings"
                    required:
                      - key
                      - urn
                  x-forma-type: "array: object"
                  description: "A collection of child elements"
              required:
                - base
                - children
                - terrain
