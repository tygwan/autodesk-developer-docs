                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        urn:
                          type: string
                          x-forma-type: string
                          description: "A Forma element URN"
                        metadata:
                          type: object
                          x-forma-type: object
                          description: "Metadata about an element. Does not describe the element itself, but rather the context in which it has been created/updated"
                          properties:
                            predecessor:
                              type: string
                              x-forma-type: string
                              description: "Urn pointer to the previous revision of this element."
                            createdAt:
                              type: string
                              x-forma-type: string
                              description: "ISO8601 timestamp of when the element was created"
                            createdBy:
                              type: string
                              x-forma-type: string
                        properties:
                          type: object
                          x-forma-type: object
                          properties:
                            category:
                              type: string
                              x-forma-type: "enum:string"
                              description: "Will always be: proposal"
                            name:
                              type: string
                              x-forma-type: string
                              description: "Name of proposal"
                        children:
                          type: array
                          items:
                            type: object
                            properties:
                              urn:
