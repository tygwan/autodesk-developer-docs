openapi: "3.1.0"
info:
  title: "Forma APIs — Forms"
  version: v1
  description: |-
    Forma APIs — Forms.
    Autodesk 문서에서 자동 추출됨. 원본: https://aps.autodesk.com/en/docs/acc/v1
    공통 base 경로: /construction/forms
    **리전 — 호출 전 반드시 확인** 리전은 완전히 분리되어 있고 리소스 식별자가 호환되지 않습니다. ⚠️ **헤더 이름이 그룹마다 다릅니다.** Hub Admin 은 `Region`, Issues 는 `x-ads-region` 입니다. 이 문서의 "헤더" 표에 적힌 이름을 그대로 쓰세요. 통일해서 보내면 안 됩니다. 미지정 시 자동 라우팅되며 지연이 늘 수 있습니다. 자세한 판정은 `_errata` E-003 참고.
servers:
  - url: "https://developer.api.autodesk.com"
x-forma-group: Forms
x-forma-common-base: "/construction/forms"
paths:
  "/construction/forms/v1/projects/{projectId}/form-templates/{templateId}/forms/{formId}":
    patch:
      operationId: forms-forms-formId-PATCH
      summary: "Updates a form’s form details"
      description: "Updates a form’s form details. Note that we do not currently support updating PDF forms."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You need to convert the project ID into a project ID for the Forma API by removing the “b." prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7.
          schema:
            type: string
            x-forma-type: string
        - name: templateId
          in: path
          required: true
          description: |-
            The unique identifier of the form template.
            Use GET forms to retrieve a form’s template ID.
          schema:
            type: string
            x-forma-type: string
        - name: formId
          in: path
          required: true
          description: |-
            The unique identifier of the form.
            Use GET forms to retrieve the form ID.
          schema:
            type: string
            x-forma-type: string
        - name: Content-Type
          in: header
          required: true
          description: "Must be application/json"
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:write"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  status:
                    type: string
                    x-forma-type: "enum:string"
                    description: |-
                      The current status of the form. Note that forms are created in draft status. Possible values:
                      draft: you can edit forms.

                      inReview: you cannot edit forms, however, they can be approved by form reviewers.

                      submitted: forms are closed and no longer editable.

                      archived forms are not edtiable and hidden in the UI.
                  id:
                    type: string
                    x-forma-type: string
                    description: "The unique identifier of the form."
                  projectId:
                    type: string
                    x-forma-type: string
                    description: "The unique identifier of the project the form belongs to."
                  formNum:
                    type: integer
                    x-forma-type: int
                    description: "A chronological user-fiendly identifier of the form within the project e.g. form #5."
                  formDate:
                    type: string
                    x-forma-type: string
                    description: "Date the form pertains to."
                  assigneeId:
                    type: string
                    x-forma-type: string
                    description: "The unique identifier of the user, role, or company the form is assigned to."
                  assigneeType:
                    type: string
                    x-forma-type: "enum:string"
                    description: |-
                      Type of entity the form is assigned to.
                      Possible values: company, role, user
                  locationId:
                    type: string
                    x-forma-type: string
                    description: "Location identifier associated with the form. For more information about the location, see GET nodes."
                  updatedAt:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "The date when the form was last updated, UTC date and time in ISO-8601 format."
                  createdBy:
                    type: string
                    x-forma-type: string
                    description: "The unique identifier of the user who created the form."
                  notes:
                    type: string
                    x-forma-type: string
                    description: "Text for the form’s notes section."
                  description:
                    type: string
                    x-forma-type: string
                    description: "Text for the form’s description section."
                  name:
                    type: string
                    x-forma-type: string
                    description: |-
                      The name of the form instance.
                      Max length: 100
                  formTemplate:
                    type: object
                    x-forma-type: object
                    description: "Information about the form’s template."
                    properties:
                      status:
                        type: string
                        x-forma-type: "enum:string"
                        description: "Possible values: active, inactive, deleted"
                      id:
                        type: string
                        x-forma-type: string
                        description: "The unique identifier of the template."
                      projectId:
                        type: string
                        x-forma-type: string
                        description: "Unique indentifier of the project the template belongs to."
                      name:
                        type: string
                        x-forma-type: string
                        description: "Name of the form template."
                      templateType:
                        type: string
                        x-forma-type: string
                        description: "User defined type of the form template."
                  pdfValues:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          x-forma-type: string
                          description: "The name of the PDF field."
                        value:
                          type: string
                          x-forma-type: string
                          description: "The value of the PDF field."
                    x-forma-type: "array: object"
                    description: "For PDF forms, values extracted from fields in the PDF."
                  pdfUrl:
                    type: string
                    x-forma-type: string
                    description: "For PDF forms, the URL to download the form’s PDF."
                  weather:
                    type: object
                    x-forma-type: object
                    description: "Weather forecast captured on the form."
                    properties:
                      summaryKey:
                        type: string
                        x-forma-type: string
                        description: "A code describing the weather conditions. For weather data from DarkSky (legacy), possible values are: clear, rain, snow, sleet, wind, fog, cloudy, partlyCloudy. For weather data from WeatherKit, values come from Apple’s WeatherCondition codes and include: Clear, MostlyClear, PartlyCloudy, MostlyCloudy, Cloudy, Rain, HeavyRain, Drizzle, Snow, HeavySnow, Flurries, Sleet, FreezingRain, FreezingDrizzle, Hail, Thunderstorms, IsolatedThunderstorms, ScatteredThunderstorms, StrongStorms, Windy, Breezy, Foggy, Haze, Smoky, Blizzard, BlowingDust, BlowingSnow, TropicalStorm, Hurricane, SunShowers, Hot, Frigid, WintryMix. Check the provider field to determine which value set to expect. Additional values may appear as Apple’s WeatherKit condition codes evolve."
                      precipitationAccumulation:
                        type: number
                        x-forma-type: number
                        description: "Amount of precipitation accumulated throughout the day."
                      precipitationAccumulationUnit:
                        type: string
                        x-forma-type: string
                        description: "Indicates the measurement unit of the precipitationAccumulation."
                      temperatureMin:
                        type: number
                        x-forma-type: number
                        description: "Minimum temperature during the day."
                      temperatureMax:
                        type: number
                        x-forma-type: number
                        description: "Maximum temperature during the day."
                      temperatureUnit:
                        type: string
                        x-forma-type: string
                        description: "Indicates the measurement unit of the temperature values e.g. temperatureMin, temperatureMax, temp."
                      humidity:
                        type: number
                        x-forma-type: number
                        description: "A percentage value indicating the humidity over the course of the day."
                      windSpeed:
                        type: number
                        x-forma-type: number
                        description: "Average wind speed observed throughout the day."
                      windGust:
                        type: number
                        x-forma-type: number
                        description: "Maximum wind speed observed throughout the day."
                      speedUnit:
                        type: string
                        x-forma-type: string
                        description: "Indicates the measurement unit of the windSpeed and windGust."
                      windBearing:
                        type: number
                        x-forma-type: number
                        description: "Direction of the wind, in degrees."
                      hourlyWeather:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              x-forma-type: int
                              description: "Unique identifier."
                            hour:
                              type: string
                              x-forma-type: string
                              description: "Hour of the day for this forecast."
                            temp:
                              type: number
                              x-forma-type: number
                              description: "Temperature during specified hour."
                            windSpeed:
                              type: number
                              x-forma-type: number
                              description: "Average wind speed."
                            windBearing:
                              type: integer
                              x-forma-type: int
                              description: "Direction of the wind, in degrees."
                            humidity:
                              type: number
                              x-forma-type: number
                              description: "A percentage value indicating the humidity."
                            fetchedAt:
                              type: string
                              format: date-time
                              x-forma-type: "datetime: ISO 8601"
                              description: "The date when weather was fetched from weather API."
                            createdAt:
                              type: string
                              format: date-time
                              x-forma-type: "datetime: ISO 8601"
                              description: "The date when weather was first fetched."
                            updatedAt:
                              type: string
                              format: date-time
                              x-forma-type: "datetime: ISO 8601"
                              description: "The date when the weather was last updated."
                        x-forma-type: "array: object"
                        description: "Weather information for specific hours (07:00:00, 12:00:00, 16:00:00)."
                      provider:
                        type: string
                        x-forma-type: "enum:string"
                        description: |-
                          Indicates the source of the weather data.
                          Possible values: darksky, weatherkit
                  customValues:
                    type: array
                    items:
                      type: object
                      properties:
                        fieldId:
                          type: string
                          x-forma-type: string
                          description: "The unique identifier of the field."
                        sectionLabel:
                          type: string
                          x-forma-type: string
                          description: "Name of the section containing this field."
                        itemLabel:
                          type: string
                          x-forma-type: string
                          description: "The field’s label or question text."
                        valueName:
                          type: string
                          x-forma-type: "enum:string"
                          description: |-
                            Indicates the type of value used for this item.
                            Possible values: textVal, toggleVal, arrayVal, numberVal, choiceVal, dateVal, svgVal
                        toggleVal:
                          type: string
                          x-forma-type: "enum:string"
                          description: |-
                            A boolean like enum value.
                            Possible values: Yes, No, False, True, Minus, Plus, Fail, Pass, NA
                        textVal:
                          type: string
                          x-forma-type: string
                          description: "A text value."
                        arrayVal:
                          type: string
                          x-forma-type: string
                          description: "Multi select values."
                        numberVal:
                          type: number
                          x-forma-type: number
                          description: "A numeric value."
                        choiceVal:
                          type: string
                          x-forma-type: string
                          description: "A single select value."
                        dateVal:
                          type: string
                          x-forma-type: string
                          description: "A date value."
                        svgVal:
                          type: string
                          x-forma-type: string
                          description: "A signature value (base64 encoded SVG)."
                        notes:
                          type: string
                          x-forma-type: string
                          description: |-
                            Text for the field’s notes section.
                            Max length: 8000
                    x-forma-type: "array: object"
                    description: "For non-PDF forms, data stored in the form fields."
                  lastReopenedBy:
                    type: string
                    x-forma-type: string
                    description: "Unique identifier for the user that last re-opened the Form (if applicable)."
                  lastSubmitterSignature:
                    type: string
                    x-forma-type: string
                    description: "Signature of the reviewer who last submitted the Form (if applicable). Signature value (base64 encoded SVG)."
                  userCreatedAt:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "Timestamp when the form was created on the client device or external system. This may differ from createdAt if the form was created offline and synced later. UTC date and time in ISO-8601 format."
                  createdAt:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "Timestamp when the form was received and stored on the server. UTC date and time in ISO-8601 format."
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "409":
          description: Conflict
        "429":
          description: "Too Many Requests"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:write"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/forms-forms-formId-PATCH"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                assigneeId:
                  type: string
                  x-forma-type: string
                  description: "The unique identifier of the company, role, or user the form is assigned to. Note that the assignee must be a contributor of the template."
                assigneeType:
                  type: string
                  x-forma-type: "enum:string"
                  description: |-
                    Type of entity the form is assigned to.
                    Possible values: company, role, user
                description:
                  type: string
                  x-forma-type: string
                  description: |-
                    Text for the form’s description field.
                    Max length: 8000
                name:
                  type: string
                  x-forma-type: string
                  description: |-
                    The name of the form instance. If the specified value is null or empty, it defaults to the form’s template name.
                    Max length: 100
                formDate:
                  type: string
                  x-forma-type: string
                  description: "Date the form pertains to, must be after 1950-01-01."
                locationId:
                  type: string
                  format: uuid
                  x-forma-type: "string: UUID"
                  description: "Location identifier associated with the form. For more information about the location, see GET nodes."
                notes:
                  type: string
                  x-forma-type: string
                  description: |-
                    Text for the form’s notes section.
                    Max length: 8000
                status:
                  type: string
                  x-forma-type: "enum:string"
                  description: |-
                    New status for the form.
                    "draft" (in progress) forms may be edited.

                    "inReview" forms may not be edited but may be approved by the form reviewers.

                    "submitted" forms are closed and no longer editable.

                    "archived" forms are not editable and hidden in the ui

                    Possible values: draft, discarded, submitted, archived, in_review
                submitterSignature:
                  type: string
                  x-forma-type: string
                  description: |-
                    Signature of the reviewer who is submitting the form (should be included when submitting an inReview form) as a base64 encoded SVG.
                    Note: the SVG will be sanitized: tags and attributes are limited to the basics (<path>, <g>, <polyline>, etc) needed to represent a signature.
