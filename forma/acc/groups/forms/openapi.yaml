                  description: "The list of tabular fields. Maximum 10 items per request."
  "/construction/forms/v2/projects/{projectId}/forms/{formId}/values":
    get:
      operationId: "forms-custom-values-(Beta)-GET"
      summary: "Returns all form field values (custom values / question values) on the form"
      description: "Returns all form field values (custom values / question values) on the form."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You need to convert the project ID into a project ID for the Forma API by removing the “b." prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7.
          schema:
            type: string
            x-forma-type: string
        - name: formId
          in: path
          required: true
          description: |-
            The unique identifier of the form.
            Use GET forms to retrieve the form ID.
          schema:
            type: string
            x-forma-type: string
        - name: offset
          in: query
          description: "The number of records to skip before returning the result records. Defaults to 0. Increase this value in subsequent requests to continue getting results when the number of records exceeds the requested limit."
          schema:
            type: integer
            x-forma-type: int
        - name: limit
          in: query
          description: "The number of records to return in a single request. Can be a number between 1 and 50. Defaults to 50."
          schema:
            type: integer
            x-forma-type: int
        - name: sectionUid
          in: query
          description: |-
            Filter by section UID to retrieve values for a specific section only.
            Use GET layout to retrieve section UIDs from the form’s layout.
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "Unique identifier for the form value."
                        fieldId:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "Unique identifier for the field (schema_uid). Use this to correlate the value with its field definition in the form layout."
                        deleted:
                          type: boolean
                          x-forma-type: boolean
                          description: "Indicates whether this value has been deleted. If true, the value was removed from the form."
                        toggleVal:
                          type: string
                          x-forma-type: "enum:string"
                          description: |-
                            Value for toggle/checkbox fields. This endpoint always returns normalized values: True (affirmative), False (negative), or NA (not applicable), regardless of the question’s modifier type (yes/no, pass/fail, plus/minus). To determine the original display format (e.g., Yes/No vs Pass/Fail), check the question’s modifier from the GET section endpoint.
                            Possible values: Yes, No, False, True, Minus, Plus, Fail, Pass, NA
                        textVal:
                          type: string
                          x-forma-type: string
                          description: "Value for text input fields."
                        numberVal:
                          type: number
                          x-forma-type: number
                          description: "Value for number input fields."
                        choiceVal:
                          type: string
                          x-forma-type: string
                          description: "Value for single-select dropdown or radio button fields. Contains the selected option value."
                        arrayVal:
                          type: array
                          items:
                            type: string
                          x-forma-type: "array: string"
                          description: "Value for multi-select fields. Contains an array of selected option values."
                        dateVal:
                          type: string
                          x-forma-type: string
                          description: "Value for date fields. Date in ISO-8601 format (YYYY-MM-DD)."
                        svgVal:
                          type: string
                          x-forma-type: string
                          description: "Value for signature fields. Contains the signature as a base64-encoded SVG string."
                        name:
                          type: string
                          x-forma-type: string
                          description: "Name of the person who provided the signature. Only populated for signature fields."
                        notes:
                          type: string
                          x-forma-type: string
                          description: "Additional notes or comments associated with the field value."
                        updatedAt:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: "The date and time when the value was last updated, in UTC ISO-8601 format."
                        updatedBy:
                          type: string
                          x-forma-type: string
                          description: "The user ID (Oxygen ID) of the user who last updated this value."
                    x-forma-type: "array: object"
                    description: "List of form field values (custom values / question values)."
