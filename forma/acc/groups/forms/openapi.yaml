                            type: object
                            properties:
                              formValueId:
                                type: string
                                format: uuid
                                x-forma-type: "string: UUID"
                                description: "The row identifier (matches the parent TabularValueRow.id). This is repeated in each cell to enable independent cell storage and sparse table support. Think of it as the ‘rowId’ portion of a cell’s coordinate."
                              columnId:
                                type: string
                                format: uuid
                                x-forma-type: "string: UUID"
                                description: |-
                                  The column identifier from the form’s layout. Think of it as the ‘columnId’ portion of a cell’s coordinate. This corresponds to the uid of a column in the table’s columns array in the section detail.
                                  Use GET section to retrieve the section and find column definitions with their uid, columnKey, label, and columnType.
                              columnName:
                                type: string
                                x-forma-type: string
                                description: "The name (columnKey) of the column. For built-in tables, this is one of the predefined column keys (e.g., trade, headcount, description). For custom tables, this is the user-defined column key."
                              textVal:
