        - name: formId
          in: path
          required: true
          description: |-
            The unique identifier of the form.
            Use GET forms to retrieve the form ID.
          schema:
            type: string
            x-forma-type: string
        - name: fieldId
          in: path
          required: true
          description: |-
            The table’s schema identifier (UUID). This corresponds to the schema and fieldId fields returned in each row of the response.
            For built-in tables, use the following UUIDs:
            - Work Log: 6c8055d5-1301-46f6-9d18-8a2a208a277e
            - Materials: 2adf5ad9-d9d3-ee42-6fd8-015c34ce474d
            - Equipment: 8af6c450-dd2a-32ae-0090-5493a9cc884e

            For custom tables, the schema identifier can be found in the section detail. Use GET section to retrieve the section, then look for schema fields on table section items.
          schema:
            type: string
            x-forma-type: string
        - name: offset
          in: query
          description: "The number of records to skip before returning the result records. Defaults to 0. Increase this value in subsequent requests to continue getting results when the number of records exceeds the requested limit."
          schema:
            type: integer
            x-forma-type: int
        - name: limit
          in: query
          description: "The number of records to return in a single request. Can be a number between 1 and 50. Defaults to 50."
          schema:
            type: integer
            x-forma-type: int
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "Unique identifier for this table row. Each column value in the columns array references this ID via its formValueId field."
                        table:
                          type: string
                          x-forma-type: "enum:string"
                          description: |-
                            Built-in table identifier. If it is not provided, the table will be a custom table identified by the schema field.
                            Possible values: worklogEntries, materialsEntries, equipmentEntries
                        schema:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: |-
                            The table’s schema identifier (UUID). This is the legacy field name, retained for backwards compatibility. Use fieldId for new integrations.
                            This value corresponds to the fieldId path parameter used to query this table.
                        fieldId:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: |-
                            The table’s schema identifier (UUID). This is the preferred field name that matches the fieldId path parameter.
                            Historically, tables were identified by a field called schema, which caused confusion with database schema concepts. The fieldId field provides a clearer name while schema is retained for backwards compatibility. Both fields contain the same UUID value.
                        rank:
                          type: integer
                          x-forma-type: int
                          description: "The sort order in the table."
                        deleted:
                          type: boolean
                          x-forma-type: boolean
                          description: "Whether the table row has been deleted or not."
                        columns:
