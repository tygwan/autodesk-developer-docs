    get:
      operationId: forms-get-table-values-GET
      summary: "Returns all row values from a specific table in a form"
      description: "Returns all row values from a specific table in a form."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
