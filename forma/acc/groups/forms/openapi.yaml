  "/construction/forms/v3/projects/{projectId}/weather/{weatherId}":
    get:
      operationId: forms-get-weather-data-for-a-project-GET
      summary: "Returns weather data for a specific weather record associated with a project"
      description: "Returns weather data for a specific weather record associated with a project."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You need to convert the project ID into a project ID for the Forma API by removing the “b." prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7.
          schema:
            type: string
            x-forma-type: string
        - name: weatherId
          in: path
          required: true
          description: |-
            The unique identifier of the weather record.
            Use GET forms to retrieve the weather ID from a form’s weatherId field.
          schema:
            type: integer
            x-forma-type: int
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    x-forma-type: int
                    description: "Unique identifier for the weather record."
                  summaryKey:
                    type: string
                    x-forma-type: string
                    description: "A code describing the weather conditions in SCREAMING_SNAKE_CASE. Common values include: CLEAR, RAIN, SNOW, SLEET, WIND, FOG, CLOUDY, PARTLY_CLOUDY, MOSTLY_CLEAR, MOSTLY_CLOUDY, HEAVY_RAIN, DRIZZLE, HEAVY_SNOW, FLURRIES, FREEZING_RAIN, THUNDERSTORMS, WINDY, BREEZY, FOGGY, HAZE, BLIZZARD, HOT, FRIGID, WINTRY_MIX. Additional values may appear as weather condition codes evolve."
                  precipitationType:
                    type: string
                    x-forma-type: string
                    description: "Type of precipitation. Possible values: RAIN, SNOW, SLEET, or null if no precipitation."
                  precipitationAccumulation:
                    type: number
                    x-forma-type: number
                    description: "Amount of precipitation accumulated throughout the day, in millimeters (mm)."
                  hourlyWeather:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          x-forma-type: int
                          description: "Unique identifier for the hourly weather record."
                        summaryKey:
                          type: string
                          x-forma-type: string
                          description: "A code describing the weather conditions for this hour in SCREAMING_SNAKE_CASE. Common values include: CLEAR, RAIN, SNOW, SLEET, WIND, FOG, CLOUDY, PARTLY_CLOUDY, MOSTLY_CLEAR, MOSTLY_CLOUDY, HEAVY_RAIN, DRIZZLE, HEAVY_SNOW, FLURRIES, FREEZING_RAIN, THUNDERSTORMS, WINDY, BREEZY, FOGGY, HAZE, BLIZZARD, HOT, FRIGID, WINTRY_MIX. Additional values may appear as weather condition codes evolve."
                        hour:
                          type: string
                          x-forma-type: string
                          description: "The hour of day for this observation, in HH:MM:SS format (24-hour clock)."
                        temp:
                          type: number
                          x-forma-type: number
                          description: "Temperature during the specified hour, in degrees Celsius (°C)."
                        windSpeed:
                          type: number
                          x-forma-type: number
                          description: "Average wind speed during the specified hour, in kilometers per hour (km/h)."
                        windBearing:
                          type: integer
                          x-forma-type: int
                          description: "Direction the wind is coming from, in degrees (0-360). North is 0°, East is 90°, South is 180°, West is 270°."
                        windBearingKey:
                          type: string
                          x-forma-type: string
                          description: "Cardinal direction the wind is coming from. Possible values: N, NE, E, SE, S, SW, W, NW."
                        humidity:
                          type: number
                          x-forma-type: number
                          description: "Relative humidity as a decimal value between 0 and 1 (e.g., 0.65 represents 65% humidity)."
                    x-forma-type: "array: object"
                    description: "Weather observations for specific hours of the day (typically 07:00, 12:00, and 16:00 local time)."
                  provider:
                    type: string
                    x-forma-type: "enum:string"
                    description: |-
                      Indicates the source of the weather data.
                      Possible values: DARK_SKY, WEATHER_KIT
                  fetchedAt:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "The date and time when the weather data was fetched from the weather API."
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "429":
          description: "Too Many Requests"
        "500":
          description: "Internal Server Error"
