                                x-forma-type: int
                                description: "Integer value."
                              arrayVal:
                                type: array
                                items:
                                  type: string
                                x-forma-type: "array: string"
                                description: "Array value."
                              timespanVal:
                                type: integer
                                x-forma-type: int
                                description: "Amount of time in milliseconds."
                              svgVal:
                                type: string
                                x-forma-type: string
                                description: "SVG value."
                              uidVal:
                                type: string
                                x-forma-type: string
                                description: "UUID value."
                              datetimeLocalVal:
                                type: string
                                x-forma-type: string
                                description: "Datetime value in local time."
                              datetimeUtcVal:
                                type: string
