openapi: "3.1.0"
info:
  title: "Forma APIs — Data Connector"
  version: v1
  description: |-
    Forma APIs — Data Connector.
    Autodesk 문서에서 자동 추출됨. 원본: https://aps.autodesk.com/en/docs/acc/v1
    공통 base 경로: /data-connector/v1/accounts
    **리전 — 호출 전 반드시 확인** 리전은 완전히 분리되어 있고 리소스 식별자가 호환되지 않습니다. ⚠️ **헤더 이름이 그룹마다 다릅니다.** Hub Admin 은 `Region`, Issues 는 `x-ads-region` 입니다. 이 문서의 "헤더" 표에 적힌 이름을 그대로 쓰세요. 통일해서 보내면 안 됩니다. 미지정 시 자동 라우팅되며 지연이 늘 수 있습니다. 자세한 판정은 `_errata` E-003 참고.
servers:
  - url: "https://developer.api.autodesk.com"
x-forma-group: "Data Connector"
x-forma-common-base: "/data-connector/v1/accounts"
paths:
  "/data-connector/v1/accounts/{accountId}/jobs/{jobId}/data-listing":
    get:
      operationId: data-connector-jobs-jobId-data-listing-GET
      summary: "Returns an array of information about the files contained within the data extract created by a specified job"
      description: "Returns an array of information about the files contained within the data extract created by a specified job. The job must be spawned by a data request that was created by the authenticated user. The user must have executive overview or project administrator permissions."
      parameters:
        - name: accountId
          in: path
          required: true
          description: "The ID of the hub. To obtain the hub ID, call GET hubs in the Data Management API and remove the “b.” prefix."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: jobId
          in: path
          required: true
          description: "The job ID"
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  name:
                    type: string
                    x-forma-type: string
                    description: "The name of the file."
                  createdAt:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "The date and time the file was created, presented in ISO 8601 format."
                  size:
                    type: integer
                    x-forma-type: int
                    description: "The size of the file in bytes."
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "429":
          description: "Too Many Requests"
        "500":
          description: "Internal Server Error"
        "503":
          description: "Service Unavailable"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/data-connector-jobs-jobId-data-listing-GET"
  "/data-connector/v1/accounts/{accountId}/jobs/{jobId}/data/{name}":
    get:
      operationId: data-connector-jobs-jobId-data-name-GET
      summary: "Returns a signed URL that you can contact to retrieve a single specified file from a specified job’s data extract"
      description: "Returns a signed URL that you can contact to retrieve a single specified file from a specified job’s data extract. You can examine a data extract’s available files, their names, and their sizes using GET jobs/:jobId/data-listing. The information it returns can help you plan what you would like to retrieve using this endpoint, useful if you want to retrieve only part of a data extract to avoid downloading large but unnecessary files. The user must have executive overview or project administrator permissions."
      parameters:
        - name: accountId
          in: path
          required: true
          description: "The ID of the hub. To obtain the hub ID, call GET hubs in the Data Management API and remove the “b.” prefix."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: jobId
          in: path
          required: true
          description: "The job ID"
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: name
          in: path
          required: true
          description: "Name of the file to retrieve"
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  size:
                    type: integer
                    x-forma-type: int
                    description: "The size of the file in bytes."
                  name:
                    type: string
                    x-forma-type: string
                    description: "The name of the file."
                  signedUrl:
                    type: string
                    x-forma-type: string
                    description: "The signed URL to contact to download the specified file. Note that this URL will be valid for 60 seconds from the time of this response."
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "429":
          description: "Too Many Requests"
        "500":
          description: "Internal Server Error"
        "503":
          description: "Service Unavailable"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/data-connector-jobs-jobId-data-name-GET"
  "/data-connector/v1/accounts/{accountId}/jobs/{jobId}":
    delete:
      operationId: data-connector-jobs-jobId-DELETE
      summary: "Cancels the specified running job spawned by a data request created by the authenticated user"
      description: "Cancels the specified running job spawned by a data request created by the authenticated user. The user must have project administrator or executive overview permissions."
      parameters:
        - name: accountId
          in: path
          required: true
          description: "The ID of the hub. To obtain the hub ID, call GET hubs in the Data Management API and remove the “b.” prefix."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: jobId
          in: path
          required: true
          description: "The job ID"
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
      security:
        - oauth2:
            - "data:write"
      responses:
        "204":
          description: "No Content"
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "429":
          description: "Too Many Requests"
        "500":
          description: "Internal Server Error"
        "503":
          description: "Service Unavailable"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:write"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/data-connector-jobs-jobId-DELETE"
    get:
      operationId: data-connector-jobs-jobId-GET
      summary: "Returns information about a specified job that was spawned by a data request created by the authenticated user"
      description: "Returns information about a specified job that was spawned by a data request created by the authenticated user. The user must have project administrator or executive overview permissions."
      parameters:
        - name: accountId
          in: path
          required: true
          description: "The ID of the hub. To obtain the hub ID, call GET hubs in the Data Management API and remove the “b.” prefix."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: jobId
          in: path
          required: true
          description: "The job ID"
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
      security:
        - oauth2:
            - "data:write"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The job ID."
                  requestId:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The ID of the data request that spawned the job."
                  accountId:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The hub ID."
                  projectId:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The project ID."
                  projectIdList:
                    type: array
                    items:
                      type: string
                    x-forma-type: "array: string"
                    description: "The list of project IDs"
                  createdBy:
                    type: string
                    x-forma-type: string
                    description: "The BIM 360 / Forma user ID of the user who created the data request that spawned this job."
                  createdByEmail:
                    type: string
                    x-forma-type: string
                    description: "The email address of the user who created the data request that spawned this job."
                  createdAt:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "The date and time the job was created, presented in ISO 8601 format."
                  status:
                    type: string
                    x-forma-type: string
                    description: "The current status of the job. Possible values: queued, running, complete."
                  completionStatus:
                    type: string
                    x-forma-type: string
                    description: "The completion status for completed jobs. Possible values: success, failed, cancelled."
                  startedAt:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "The date and time the job was started, presented in ISO 8601 format. If the job has not yet started, the value is null."
                  completedAt:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "The date and time the job was completed, presented in ISO 8601 format. If the job has not yet completed, the value is null."
                  sendEmail:
                    type: boolean
                    x-forma-type: boolean
                    description: "Send a notification email when the job completes."
                  progress:
                    type: integer
                    x-forma-type: int
                    description: "Job progress indicator (0 to 100 percent)"
                  lastDownloadedBy:
                    type: string
                    x-forma-type: string
                    description: "The ID of the user who last downloaded this job data."
                  lastDownloadedAt:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "The last date and time that a user downloaded this job data, in ISO 8601 format."
                  startDate:
                    type: string
                    x-forma-type: string
                    description: |-
                      The start date and time for the data extraction, in ISO 8601 format.
                      This field applies only to schemas that support date range extraction. The detailed schema documentation delivered with each data extract identifies the schemas and tables that support date range extraction.
                  endDate:
                    type: string
                    x-forma-type: string
                    description: |-
                      The end date and time for the data extraction, in ISO 8601 format.
                      This field applies only to schemas that support date range extraction. The detailed schema documentation delivered with each data extract identifies the schemas and tables that support date range extraction.
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "429":
          description: "Too Many Requests"
        "500":
          description: "Internal Server Error"
        "503":
          description: "Service Unavailable"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:write"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/data-connector-jobs-jobId-GET"
  "/data-connector/v1/accounts/{accountId}/jobs":
    get:
      operationId: data-connector-jobs-GET
      summary: "Returns an array of Data Connector jobs spawned by requests from the authenticated user"
      description: "Returns an array of Data Connector jobs spawned by requests from the authenticated user. The array can contain all jobs associated with a specified project, or all jobs associated with all projects in the user’s hub. The user must have project administrator or executive overview permissions:"
      parameters:
        - name: accountId
          in: path
          required: true
          description: "The ID of the hub. To obtain the hub ID, call GET hubs in the Data Management API and remove the “b.” prefix."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: sort
          in: query
          description: "The sort order of returned data connector objects. Possible values: asc ascending by date (earliest to latest date), desc descending by date (latest to earliest date)."
          schema:
            type: string
            x-forma-type: string
        - name: limit
          in: query
          description: "The number of data connector objects to return. Default value: 20"
          schema:
            type: integer
            x-forma-type: int
        - name: offset
          in: query
          description: "The number of data objects to skip before starting to starting to collect the result set. Default value: 0"
          schema:
            type: integer
            x-forma-type: int
        - name: projectId
          in: query
          description: "Project ID of the returned Data Connector objects."
          schema:
            type: string
            x-forma-type: string
        - name: sortFields
          in: query
          description: |-
            A string of comma-separated names of the fields by which to sort the returned jobs. The results are sorted by the first field, then by the second field, and so on. Jobs are sorted by each field in ascending order by default; you can prepend any field name with a hyphen ( - ) to sort in descending order. Invalid fields and whitespaces are ignored.
            Possible values: projectId, createdBy, createdByEmail, createdAt, status, completionStatus, startedAt, completedAt, startDate, endDate.
          schema:
            type: string
            x-forma-type: string
        - name: "filter[field_to_filter]"
          in: query
          description: |-
            Return only the Data Connector jobs in which the specified field has the specified value. Use the following format in the endpoint URL: filter[field_to_filter]=_filter_value_.
            Note that you can provide multiple job filters in the URL, but you may not filter on multiple values of the same field.

            Possible field_to_filter values: projectId, createdAt, status, completionStatus, startedAt, completedAt, startDate, endDate. You can also retrieve all Data Connector jobs in the current hub by specifying filter[projectId]=null.

            For the createdAt, startedAt, and completedAt fields (which accept a date range), specify the range in the form firstdate..lastdate, in ISO 8601 format with the time required. You can alternatively omit the first date (for example, to get everything on or before June 1, 2019 the range would be ..2019-06-01T23:59:59.999Z). You can also omit the last date (for example, to get everything after June 1, 2019 the range would be 2019-06-01T00:00:00.000Z..)

            Additional notes on using startDate and endDate:

            - If you provide only startDate or endDate (but not both), Data Connector uses that single date for both startDate and endDate.

            - If you request more than the Maximum Date Range Allowed for an extraction, the default date range as documented in the schema documentation is returned.

            - For the activities service group, data replication can be delayed up to 20 minutes, so your requests should account for that delay.
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  pagination:
                    type: object
                    x-forma-type: object
                    description: "Information about the pagination used to return the results array."
                    properties:
                      limit:
                        type: integer
                        x-forma-type: int
                        description: "The specified upper limit of results to return."
                      offset:
                        type: integer
                        x-forma-type: int
                        description: "The specified number of results skipped before the results in this array were collected."
                      totalResults:
                        type: integer
                        x-forma-type: int
                        description: "The total number of results returned here."
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "The job ID."
                        requestId:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "The ID of the data request that spawned the job."
                        accountId:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "The hub ID."
                        projectId:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "The project ID."
                        projectIdList:
                          type: array
                          items:
                            type: string
                          x-forma-type: "array: string"
                          description: "The list of project IDs"
                        createdBy:
                          type: string
                          x-forma-type: string
                          description: "The BIM 360 / Forma user ID of the user who created the data request that spawned this job."
                        createdByEmail:
                          type: string
                          x-forma-type: string
                          description: "The email address of the user who created the data request that spawned this job."
                        createdAt:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: "The date and time the job was created, presented in ISO 8601 format."
                        status:
                          type: string
                          x-forma-type: string
                          description: "The current status of the job. Possible values: queued, running, complete."
                        completionStatus:
                          type: string
                          x-forma-type: string
                          description: "The completion status for completed jobs. Possible values: success, failed, cancelled."
                        startedAt:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: "The date and time the job was started, presented in ISO 8601 format. If the job has not yet started, the value is null."
                        completedAt:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: "The date and time the job was completed, presented in ISO 8601 format. If the job has not yet completed, the value is null."
                        sendEmail:
                          type: boolean
                          x-forma-type: boolean
                          description: "Send a notification email when the job completes."
                        progress:
                          type: integer
                          x-forma-type: int
                          description: "Job progress indicator (0 to 100 percent)"
                        lastDownloadedBy:
                          type: string
                          x-forma-type: string
                          description: "The ID of the user who last downloaded this job data."
                        lastDownloadedAt:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: "The last date and time that a user downloaded this job data, in ISO 8601 format."
                        startDate:
                          type: string
                          x-forma-type: string
                          description: |-
                            The start date and time for the data extraction, in ISO 8601 format.
                            This field applies only to schemas that support date range extraction. The detailed schema documentation delivered with each data extract identifies the schemas and tables that support date range extraction.
                        endDate:
                          type: string
                          x-forma-type: string
                          description: |-
                            The end date and time for the data extraction, in ISO 8601 format.
                            This field applies only to schemas that support date range extraction. The detailed schema documentation delivered with each data extract identifies the schemas and tables that support date range extraction.
                    x-forma-type: "array: object"
                    description: "An array of job records."
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "429":
          description: "Too Many Requests"
        "500":
          description: "Internal Server Error"
        "503":
          description: "Service Unavailable"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/data-connector-jobs-GET"
