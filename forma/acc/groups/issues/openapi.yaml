  "/construction/issues/v1/projects/{projectId}/users/me":
    get:
      operationId: issues-users-me-GET
      summary: "Returns the current user permissions"
      description: "Returns the current user permissions."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You need to convert the project ID into a project ID for the Forma API by removing the “b." prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7.
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: x-ads-region
          in: header
          description: |-
            The region to which your request should be routed. If not set, the request is routed automatically but may incur a small latency increase.
            Possible values: US, EMEA.

            For the full list of supported regions, see the Regions page.
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  id:
                    type: string
                    x-forma-type: string
                    description: "The user’s Autodesk ID."
                  isProjectAdmin:
                    type: boolean
                    x-forma-type: boolean
                    description: "States whether the current logged in user is a system admin."
                  canManageTemplates:
                    type: boolean
                    x-forma-type: boolean
                    description: "Not relevant"
                  issues:
                    type: object
                    x-forma-type: object
                    properties:
                      new:
                        type: object
                        x-forma-type: object
                        description: "If this object appears in the response, it indicates that the user can create and modify issues."
                        properties:
                          permittedActions:
                            type: array
                            items:
                              type: string
                            x-forma-type: "array: string"
                            description: |-
                              The list of actions permitted for the user for this issue in its current state.
                              Possible Values: assign_all (can assign another user from another company to the issue), assign_same_company (can only assign another user from the same company to the issue), clear_assignee, copy (can copy the issue), delete, add_comment, add_attachment, remove_attachment.

                              The following values are not relevant: add_attachment, remove_attachment.
                          permittedAttributes:
                            type: array
                            items:
                              type: string
                            x-forma-type: "array: string"
                            description: |-
                              A list of attributes you are allowed to open a new issue. issueTypeId, linkedDocument, links, ownerId, officialResponse, rootCauseId, snapshotUrn are not applicable.
                              Possible Values: title, description, issueTypeId, issueSubtypeId, status, assignedTo, assignedToType, dueDate, locationId, locationDetails, linkedDocuments, links, ownerId, rootCauseId, officialResponse, customAttributes, snapshotUrn, startDate, published, deleted, watchers.
                          permittedStatuses:
                            type: array
                            items:
                              type: string
                            x-forma-type: "array: string"
                            description: |-
                              A list of available statuses for the project.
                              Possible values: draft, open, pending, in_progress, completed, in_review, not_approved, in_dispute, closed.

                              For more information about statuses, see the Help documentation.
                          permitted_actions:
                            type: array
                            items:
                              type: string
                            x-forma-type: "array: string"
                            description: "Not relevant"
                          permitted_attributes:
                            type: array
                            items:
                              type: string
                            x-forma-type: "array: string"
                            description: "Not relevant"
                          permitted_statuses:
                            type: array
                            items:
                              type: string
                            x-forma-type: "array: string"
                            description: "Not relevant"
                      filter:
                        type: object
                        x-forma-type: object
                        description: "Not relevant"
                        properties:
                          permittedStatuses:
                            type: array
                            items:
                              type: string
                            x-forma-type: "array: string"
                            description: "Not relevant"
                  permissionLevels:
                    type: array
                    items:
                      type: string
                    x-forma-type: "array: string"
                    description: |-
                      The permission level of the user. Each permission level corresponds to a combination of values in the response. For example, a combination of read and create in the response, corresponds to a Full visibility permission level.
                      Note that if a user with View and assign issues for their company permissions attempts to assign a user from a another company to the issue, it will return an error. In addition, the user can both create and view issues for their own company. You can also verify a user’s assignment permissions by checking the permittedActions or permissionLevels attributes.

                      - Edit, view, and assign This permission level is split into two sub-levels:

                      - View and assign to their company (previously known as Create for my company) : create and the permittedActions array must include assign-same-company

                      - View issues for their company. Assign issues to anyone. : create and the permittedActions array must include assign-all

                      - Full visibility (previously known as Create for other companies): create, read

                      - Manage issues: create, read, write

                      Possible values: create, read, write.

                      For more details about the permission levels, see Issues Permissions.
