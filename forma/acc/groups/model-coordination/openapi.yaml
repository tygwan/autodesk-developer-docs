openapi: "3.1.0"
info:
  title: "Forma APIs — Model Coordination"
  version: v1
  description: |-
    Forma APIs — Model Coordination.
    Autodesk 문서에서 자동 추출됨. 원본: https://aps.autodesk.com/en/docs/acc/v1
    공통 base 경로: /bim360
    **리전 — 호출 전 반드시 확인** 리전은 완전히 분리되어 있고 리소스 식별자가 호환되지 않습니다. ⚠️ **헤더 이름이 그룹마다 다릅니다.** Hub Admin 은 `Region`, Issues 는 `x-ads-region` 입니다. 이 문서의 "헤더" 표에 적힌 이름을 그대로 쓰세요. 통일해서 보내면 안 됩니다. 미지정 시 자동 라우팅되며 지연이 늘 수 있습니다. 자세한 판정은 `_errata` E-003 참고.
servers:
  - url: "https://developer.api.autodesk.com"
x-forma-group: "Model Coordination"
x-forma-common-base: "/bim360"
paths:
  "/bim360/clash/v3/containers/{containerId}/clashes/assigned/viewcontext":
    post:
      operationId: mc-clash-service-v3-get-assigned-clash-group-view-context-POST
      summary: "GET clashes/assigned/viewcontext"
      description: "Retrieves the view context around a set of assigned clash groups, such as the model set, and documents with which they are associated."
      parameters:
        - name: containerId
          in: path
          required: true
          description: "The GUID that uniquely identifies the container."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: Content-Type
          in: header
          required: true
          description: "Must be application/json"
          schema:
            type: string
            x-forma-type: string
        - name: x-ads-region
          in: header
          description: |-
            The region to which your request should be routed. If not set, the request is routed automatically but may incur a small latency increase.
            Possible values: US, EMEA. For the full list of supported regions, see the Regions page.
          schema:
            x-forma-type: "enum: string"
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  issueId:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The ID of the assigned clash group issue for retrieving the issue."
                  modelSetId:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The ID of the model set this assigned clash group issue is associated with."
                  clashGroup:
                    type: object
                    x-forma-type: object
                    description: "A Clash Group."
                    properties:
                      id:
                        type: string
                        format: uuid
                        x-forma-type: "string: UUID"
                        description: "The unique identifier of the assigned clash group."
                      clashTestId:
                        type: string
                        format: uuid
                        x-forma-type: "string: UUID"
                        description: "The unique identifier of the clash test associated with the assigned clash group."
                      issueId:
                        type: string
                        x-forma-type: string
                        description: "The unique identifier of the issue associated with the assigned clash group."
                      createdBy:
                        type: string
                        x-forma-type: string
                        description: "The unique identifier of the user who created the assigned clash group."
                      createdOn:
                        type: string
                        format: date-time
                        x-forma-type: "datetime: ISO 8601"
                        description: "The date and time that the assigned clash group was created."
                      clashes:
                        x-forma-type: "array: int"
                        description: "The clashes included in the assigned clash group. Min items: 1 Max items: 1000."
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        lineageUrn:
                          type: string
                          x-forma-type: string
                          description: "The lineage URN of the seed file or document lineage to track with this view. Min length: 1 Max length: 80."
                        viewableName:
                          type: string
                          x-forma-type: string
                          description: "The name of the viewable in the Model Derivative manifest to track along the seed file lineage. This value is ignored if lineageUrn is the URN of a BIM360 Docs Plans folder document. Min length: 1 Max length: 430."
                    x-forma-type: "array: object"
                    description: "The list of documents visible when the issue was created."
        "400":
          description: "Bad Request"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  type:
                    type: string
                    x-forma-type: string
                    description: "The error code."
                  title:
                    type: string
                    x-forma-type: string
                    description: "A short title for the error."
                  detail:
                    type: string
                    x-forma-type: string
                    description: "A more detailed, human readable description of the error, assuming that this message is not localized and is therefore EN-US. UI consumers can use the error.type value to provide a localized version of this error for presentation."
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          x-forma-type: string
                          description: "The field which failed validation."
                        title:
                          type: string
                          x-forma-type: string
                          description: "A short title for the error."
                        detail:
                          type: string
                          x-forma-type: string
                          description: "A more detailed, human readable description of the error, assuming that this message is not localized and is therefore EN-US. UI consumers can use the error.type value to provide a localized version of this error for presentation."
                        type:
                          type: string
                          x-forma-type: string
                          description: "The error code."
                    x-forma-type: "array: object"
                    description: "A set of specific validation errors that need to be fixed."
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "415":
          description: "Unsupported Media Type"
        "429":
          description: "Too Many Requests"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/mc-clash-service-v3-get-assigned-clash-group-view-context-POST"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                "array: string: UUID":
                  x-forma-type: "array: string: UUID"
                  description: "A set of issue IDs. Min items: 1 Max items: 5."
              required:
                - "array: string: UUID"
