                  format: date-time
                  x-forma-type: "datetime: ISO 8601"
                  description: "The start date of the issue."
                documentVersionUrn:
                  type: string
                  x-forma-type: string
                  description: |-
                    A document or seed file version URN with which to associate the issue.
                    Min length: 1. Max length: 256.
                viewableName:
                  type: string
                  x-forma-type: string
                  description: |-
