                    required:
                      - urn
                  x-forma-type: "array: object"
                  description: |-
                    Provides context for when this issue is viewed.
                    Max items: 1000.
              required:
                - documentVersionUrn
                - issueSubTypeId
                - issueTypeId
                - pushpin
                - title
                - viewContext
