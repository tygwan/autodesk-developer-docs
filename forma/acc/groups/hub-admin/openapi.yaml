openapi: "3.1.0"
info:
  title: "Forma APIs — Hub Admin"
  version: v1
  description: |-
    Forma APIs — Hub Admin.
    Autodesk 문서에서 자동 추출됨. 원본: https://aps.autodesk.com/en/docs/acc/v1
    **리전 — 호출 전 반드시 확인** 리전은 완전히 분리되어 있고 리소스 식별자가 호환되지 않습니다. ⚠️ **헤더 이름이 그룹마다 다릅니다.** Hub Admin 은 `Region`, Issues 는 `x-ads-region` 입니다. 이 문서의 "헤더" 표에 적힌 이름을 그대로 쓰세요. 통일해서 보내면 안 됩니다. 미지정 시 자동 라우팅되며 지연이 늘 수 있습니다. 자세한 판정은 `_errata` E-003 참고.
servers:
  - url: "https://developer.api.autodesk.com"
x-forma-group: "Hub Admin"
paths:
  "/construction/admin/v1/accounts/{accountId}/companies":
    get:
      operationId: companies-GET
      summary: "Returns a list of companies in a hub"
      description: "Returns a list of companies in a hub."
      parameters:
        - name: accountId
          in: path
          required: true
          description: "The ID of the hub that contains the projects. This corresponds to the hub ID used in the Data Management API, with the “b.\" prefix removed. For example, b.c8b0c73d-3ae9 becomes c8b0c73d-3ae9."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: "filter[name]"
          in: query
          description: |-
            Filter companies by name. Can be a partial match based on the value of filterTextMatch provided.
            Max length: 255
          schema:
            type: string
            x-forma-type: string
        - name: "filter[trade]"
          in: query
          description: |-
            Filter companies by trade. Can be a partial match based on the value of filterTextMatch provided.
            Max length: 255
          schema:
            type: string
            x-forma-type: string
        - name: "filter[erpId]"
          in: query
          description: |-
            Filter companies by ERP Id. Can be a partial match based on the value of filterTextMatch provided.
            Max length: 255
          schema:
            type: string
            x-forma-type: string
        - name: "filter[taxId]"
          in: query
          description: |-
            Filter companies by tax Id. Can be a partial match based on the value of filterTextMatch provided.
            Max length: 255
          schema:
            type: string
            x-forma-type: string
        - name: "filter[updatedAt]"
          in: query
          description: |-
            Filter companies by updated at date range. The range must be specified with dates in an ISO-8601 format with time required. The start and end dates of the range should be separated by .. One of the dates in the range may be omitted. For example, to get everything on or before June 1, 2019 the range would be ..2019-06-01T23:59:59.999Z. To get everything after June 1, 2019 the range would be 2019-06-01T00:00:00.000Z...
            Max length: 100
          schema:
            type: string
            x-forma-type: string
        - name: "filter[status]"
          in: query
          description: "Filters companies by status. Possible values: active, inactive, all. Defaults to active."
          schema:
            type: string
            x-forma-type: "enum:string"
        - name: orFilters
          in: query
          description: "List of filtered fields to apply an “or” operator. Valid list of fields are erpId, name, taxId, trade, updatedAt."
          schema:
            type: array
            items:
              type: string
            x-forma-type: "array: string"
        - name: filterTextMatch
          in: query
          description: |-
            Specifies how text-based filters should match values in supported fields.
            This parameter can be used in any endpoint that supports text-based filtering (e.g., filter[name], filter[jobNumber], filter[companyName], etc.).

            Possible values:

            contains (default) – Matches if the field contains the specified text anywhere

            startsWith – Matches if the field starts with the specified text

            endsWith – Matches if the field ends with the specified text

            equals – Matches only if the field exactly matches the specified text

            Matching is case-insensitive.

            Wildcards and regular expressions are not supported.
          schema:
            type: string
            x-forma-type: "enum:string"
        - name: sort
          in: query
          description: "The list of fields to sort by. When multiple fields are listed the later property is used to sort the resources where the previous fields have the same value. Each property can be followed by a direction modifier of either asc (ascending) or desc (descending). If no direction is specified then asc is assumed. Valid fields for sorting are name, trade, erpId, taxId, status, createdAt, updatedAt, projectSize and userSize. Default sort is name."
          schema:
            type: array
            items:
              type: string
            x-forma-type: "array: string"
        - name: fields
          in: query
          description: "List of fields to return in the response. Defaults to all fields. Valid list of fields are accountId, name, trade, addresses, websiteUrl, description, erpId, taxId, imageUrl, status, createdAt, updatedAt, projectSize, userSize and originalName."
          schema:
            type: array
            items:
              type: string
            x-forma-type: "array: string"
        - name: limit
          in: query
          description: |-
            The maximum number of records to return in the response.
            Default: 20

            Minimum: 1

            Maximum: 200 (If a larger value is provided, only 200 records are returned)
          schema:
            type: integer
            x-forma-type: int
        - name: offset
          in: query
          description: |-
            The index of the first record to return.
            Used for pagination in combination with the limit parameter.

            Example: limit=20 and offset=40 returns records 41–60.
          schema:
            type: integer
            x-forma-type: int
        - name: Region
          in: header
          description: |-
            Specifies the region where your request should be routed. If not set, the request is routed automatically, which may result in a slight increase in latency.
            Possible values: US, EMEA. For a complete list of supported regions, see the Regions page.
          schema:
            type: string
            x-forma-type: string
        - name: User-Id
          in: header
          description: |-
            The ID of a user on whose behalf your request is acting.
            Your app has access to all users specified by the administrator in the SaaS integrations UI. Provide this header value to identify the user to be affected by the request.

            You can use either the user’s Forma ID (id), or their Autodesk ID (autodeskId).

            Note that this header is required for hub Admin POST, PATCH, and DELETE endpoints if you want to use a 2-legged authentication context. This header is optional for hub Admin GET endpoints.
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "account:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  pagination:
                    type: object
                    x-forma-type: object
                    description: "Contains pagination details for the records returned by the endpoint."
                    properties:
                      limit:
                        type: integer
                        x-forma-type: int
                        description: "The maximum number of records returned per page. The last page may contain fewer records than the specified limit."
                      offset:
                        type: integer
                        x-forma-type: int
                        description: "The index of the first record in the returned page. Used for pagination."
                      totalResults:
                        type: integer
                        x-forma-type: int
                        description: "The total number of records matching the request."
                      nextUrl:
                        type: string
                        x-forma-type: string
                        description: |-
                          The URL for the next page of records, if more results are available. Max length: 2000 characters.
                          Max length: 2000
                      previousUrl:
                        type: string
                        x-forma-type: string
                        description: |-
                          The URL for the previous page of records, if applicable. Max length: 2000 characters.
                          Max length: 2000
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "Id of the company."
                        accountId:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "The identifier of the hub this company is associated with."
                        name:
                          type: string
                          x-forma-type: string
                          description: |-
                            The name of the company. The company name should be unique under a hub.
                            Max length: 255
                        trade:
                          type: string
                          x-forma-type: string
                          description: |-
                            Trade or company type based on specialization.
                            Max length: 255
                        addresses:
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                x-forma-type: "enum:string"
                                description: "The address type. Will always be: Main"
                              addressLine1:
                                type: string
                                x-forma-type: string
                                description: |-
                                  The street address line 1.
                                  Max length: 255
                              addressLine2:
                                type: string
                                x-forma-type: string
                                description: |-
                                  The street address line 2.
                                  Max length: 255
                              city:
                                type: string
                                x-forma-type: string
                                description: |-
                                  City.
                                  Max length: 255
                              stateOrProvince:
                                x-forma-type: "null,string"
                                description: |-
                                  The state or province location. Only valid state/province names and ISO 3166-2 alpha-2 codes will be accepted. The provided state or province must exist in the provided country.
                                  Max length: 255
                              postalCode:
                                type: string
                                x-forma-type: string
                                description: |-
                                  The zip or postal code in which this address is located.
                                  Max length: 255
                              country:
                                x-forma-type: "null,string"
                                description: |-
                                  Only valid country names and ISO 3166-1 alpha-2 codes will be accepted.
                                  Max length: 255
                              phone:
                                type: string
                                x-forma-type: string
                                description: |-
                                  Phone Number.
                                  Max length: 255
                          x-forma-type: "array: object"
                          description: "The company addresses."
                        websiteUrl:
                          type: string
                          x-forma-type: string
                          description: |-
                            The URL of the company website.
                            Max length: 255
                        description:
                          type: string
                          x-forma-type: string
                          description: |-
                            The description of the company.
                            Max length: 255
                        erpId:
                          type: string
                          x-forma-type: string
                          description: |-
                            The ERP Partner Company ID.
                            Max length: 255
                        taxId:
                          type: string
                          x-forma-type: string
                          description: |-
                            The Tax ID.
                            Max length: 255
                        imageUrl:
                          type: string
                          x-forma-type: string
                          description: |-
                            The URL of the image associated to the company.
                            Max length: 255
                        status:
                          type: string
                          x-forma-type: "enum:string"
                          description: |-
                            The status of the company.
                            Possible values: deleted, active
                        createdAt:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: "The timestamp when this company was created."
                        updatedAt:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: "The timestamp when this company was last updated. This will only reflect changes to the company fields and not changes to any resources in the company."
                        originalName:
                          x-forma-type: "null,string"
                          description: "Original name of the company. Only returned when a company is deleted, since, in this case, the company “name” will be updated to “removed at MMDDYYYY”."
                        projectSize:
                          type: integer
                          x-forma-type: int
                          description: "The number of projects associated with the company."
                        userSize:
                          type: integer
                          x-forma-type: int
                          description: "The number of users that are associated with the company."
                    x-forma-type: "array: object"
                    description: "The requested page of companies."
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "406":
          description: "Not Acceptable"
        "410":
          description: "Access to the target resource is no longer available."
        "429":
          description: "Too Many Requests"
        "500":
          description: "Internal Server Error"
        "503":
          description: "Service Unavailable"
      x-forma-auth-context: "user context optional"
      x-forma-scopes:
        - "account:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/companies-GET"
  "/construction/admin/v1/accounts/{accountId}/projects":
    get:
      operationId: admin-accounts-accountidprojects-GET
      summary: "Retrieves a list of the projects in the specified hub"
      description: "Retrieves a list of the projects in the specified hub. If the user is a hub admin or executive then all projects are returned; otherwise only projects that the user is assigned to are returned."
      parameters:
        - name: accountId
          in: path
          required: true
          description: "The ID of the hub that contains the projects. This corresponds to the hub ID used in the Data Management API, with the “b.\" prefix removed. For example, b.c8b0c73d-3ae9 becomes c8b0c73d-3ae9."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: fields
          in: query
          description: |-
            A comma-separated list of the project fields to include in the response. Default value: all fields.
            Possible values: accountId, addressLine1, addressLine2, businessUnitId, city, companyCount, constructionType, country, createdAt, deliveryMethod, endDate, imageUrl, jobNumber, lastSignIn, latitude, longitude, memberCount, name, platform, postalCode, products, projectValue, sheetCount, startDate, stateOrProvince, status, thumbnailImageUrl, timezone, type and updatedAt.
          schema:
            type: array
            items:
              type: string
            x-forma-type: "array: string"
        - name: "filter[classification]"
          in: query
          description: |-
            Filters projects by classification. Possible values:
            production – Standard production projects.
            template – Project templates that can be cloned to create production projects.
            component – Placeholder projects that contain standardized components (e.g., forms) for use across projects. Only one component project is permitted per hub. Known as a library in the Forma unified products UI.
            sample – The single sample project automatically created upon Forma trial setup. Only one sample project is permitted per hub.

            Max length: 255
          schema:
            type: array
            items:
              type: string
            x-forma-type: "array: string"
        - name: "filter[platform]"
          in: query
          description: |-
            Filters by platform. Possible values: acc (Forma) and bim360 (BIM 360).
            Max length: 255
          schema:
            type: array
            items:
              type: string
            x-forma-type: "array: string"
        - name: "filter[products]"
          in: query
          description: |-
            A comma-separated list of the products that the returned projects must use. Only projects that use one or more of the listed products are returned.
            Note that every product that can be used in a project on the same platform (Forma or BIM 360) is activated for the project. All products associated with the project are returned in the response.

            Some products are exclusive to Forma or to BIM 360, others are available on both platforms. Specify only the products on the appropriate platform for the projects you want to retrieve.

            Possible Forma values: accountAdministration, autoSpecs, build, buildingConnected, capitalPlanning, cloudWorksharing, cost, designCollaboration, docs, financials, insight, modelCoordination, projectAdministration, takeoff, and workshopxr.

            Possible BIM 360 values: accountAdministration, assets, cloudWorksharing, costManagement, designCollaboration, documentManagement, field, fieldManagement, glue, insight, modelCoordination, plan, projectAdministration, projectHome, projectManagement, and quantification.
          schema:
            type: array
            items:
              type: string
            x-forma-type: "array: string"
        - name: "filter[name]"
          in: query
          description: |-
            Filters projects by name. Supports partial matches when used with filterTextMatch. For example filter[name]=ABCco&filterTextMatch=startsWith returns projects whose names start with “ABCco”.
            Max length: 255
          schema:
            type: string
            x-forma-type: string
        - name: "filter[type]"
          in: query
          description: |-
            Filters by project type. To exclude a type, prefix it with - (e.g., -Bridge excludes bridge projects).
            Possible values: Airport, Assisted Living / Nursing Home, Bridge, Canal / Waterway, Convention Center, Court House, Data Center, Dams / Flood Control / Reservoirs, Demonstration Project, Dormitory, Education Facility, Government Building, Harbor / River Development, Hospital, Hotel / Motel, Library, Manufacturing / Factory, Medical Laboratory, Medical Office, Military Facility, Mining Facility, Multi-Family Housing, Museum, Oil & Gas,``Plant``, Office, OutPatient Surgery Center, Parking Structure / Garage, Performing Arts, Power Plant, Prison / Correctional Facility, Rail, Recreation Building, Religious Building, Research Facility / Laboratory, Restaurant, Retail, Seaport, Single-Family Housing, Solar Farm, Stadium/Arena, Streets / Roads / Highways, Template Project, Theme Park, Training Project, Transportation Building, Tunnel, Utilities, Warehouse (non-manufacturing), Waste Water / Sewers, Water Supply, Wind Farm.
          schema:
            type: array
            items:
              type: string
            x-forma-type: "array: string"
        - name: "filter[status]"
          in: query
          description: "Filters projects by status. Possible values: active, pending, archived, suspended."
          schema:
            type: array
            items:
              type: string
            x-forma-type: "array: string"
        - name: "filter[businessUnitId]"
          in: query
          description: |-
            The ID of the business unit that returned projects must be associated with.
            Note that you can obtain this ID value by calling the GET business_units_structure endpoint to retrieve a list of business units. Use the id field of the returned business unit that you want to filter by.

            Max length: 255
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: "filter[jobNumber]"
          in: query
          description: |-
            Filters by a user-defined project identifier. Supports partial matches when used with filterTextMatch. For example, filter[jobNumber]=HP-0002&filterTextMatch=equals returns projects where the job number is exactly “HP-0002”.
            Max length: 255
          schema:
            type: string
            x-forma-type: string
        - name: "filter[updatedAt]"
          in: query
          description: |-
            Filters projects updated within a specific date range in ISO 8601 format. For example:
            Date range: 2023-03-02T00:00:00.000Z..2023-03-03T23:59:59 .999Z
            Specific start date: 2023-03-02T00:00:00.000Z..
            Specific end date: ..2023-03-02T23:59:59.999Z

            For more details, see JSON API Filtering.

            Max length: 100
          schema:
            type: string
            x-forma-type: string
        - name: filterTextMatch
          in: query
          description: |-
            Specifies how text-based filters should match values in supported fields.
            This parameter can be used in any endpoint that supports text-based filtering (e.g., filter[name], filter[jobNumber], filter[companyName], etc.).

            Possible values:

            contains (default) – Matches if the field contains the specified text anywhere

            startsWith – Matches if the field starts with the specified text

            endsWith – Matches if the field ends with the specified text

            equals – Matches only if the field exactly matches the specified text

            Matching is case-insensitive.

            Wildcards and regular expressions are not supported.
          schema:
            type: string
            x-forma-type: "enum:string"
        - name: sort
          in: query
          description: |-
            Sorts results by specified fields. Multiple fields can be used in order of priority. Each field can be followed by asc (ascending) or desc (descending). Default: asc.
            For example, sort=name,createdAt desc sorts projects by name, then by creation date (newest first).

            Possible values: name (the default), startDate, endDate, type, status, jobNumber, constructionType, deliveryMethod, contractType, currentPhase, companyCount, memberCount, createdAt and updatedAt.
          schema:
            type: array
            items:
              type: string
            x-forma-type: "array: string"
        - name: limit
          in: query
          description: |-
            The maximum number of records to return in the response.
            Default: 20

            Minimum: 1

            Maximum: 200 (If a larger value is provided, only 200 records are returned)
          schema:
            type: integer
            x-forma-type: int
        - name: offset
          in: query
          description: |-
            The index of the first record to return.
            Used for pagination in combination with the limit parameter.

            Example: limit=20 and offset=40 returns records 41–60.
          schema:
            type: integer
            x-forma-type: int
        - name: Region
          in: header
          description: |-
            Specifies the region where your request should be routed. If not set, the request is routed automatically, which may result in a slight increase in latency.
            Possible values: US, EMEA. For a complete list of supported regions, see the Regions page.
          schema:
            type: string
            x-forma-type: string
        - name: User-Id
          in: header
          description: |-
            The ID of a user on whose behalf your request is acting.
            Your app has access to all users specified by the administrator in the SaaS integrations UI. Provide this header value to identify the user to be affected by the request.

            You can use either the user’s Forma ID (id), or their Autodesk ID (autodeskId).

            Note that this header is required for hub Admin POST, PATCH, and DELETE endpoints if you want to use a 2-legged authentication context. This header is optional for hub Admin GET endpoints.
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "account:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  pagination:
                    type: object
                    x-forma-type: object
                    description: "Contains pagination details for the records returned by the endpoint."
                    properties:
                      limit:
                        type: integer
                        x-forma-type: int
                        description: "The maximum number of records returned per page. The last page may contain fewer records than the specified limit."
                      offset:
                        type: integer
                        x-forma-type: int
                        description: "The index of the first record in the returned page. Used for pagination."
                      totalResults:
                        type: integer
                        x-forma-type: int
                        description: "The total number of records matching the request."
                      nextUrl:
                        type: string
                        x-forma-type: string
                        description: |-
                          The URL for the next page of records, if more results are available. Max length: 2000 characters.
                          Max length: 2000
                      previousUrl:
                        type: string
                        x-forma-type: string
                        description: |-
                          The URL for the previous page of records, if applicable. Max length: 2000 characters.
                          Max length: 2000
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "The internally generated ID for the project."
                        name:
                          type: string
                          x-forma-type: string
                          description: |-
                            The name of the project.
                            Max length: 255
                        startDate:
                          x-forma-type: "null,string"
                          description: "The estimated start date for the project, in ISO 8601 format."
                        endDate:
                          x-forma-type: "null,string"
                          description: "The estimated end date for the project, in ISO 8601 format."
                        type:
                          type: string
                          x-forma-type: string
                          description: |-
                            The type of the project. Any value is accepted, but the following are recommended:
                            Possible values: Convention Center, Data Center, Hotel / Motel, Office, Parking Structure / Garage, Performing Arts, Restaurant, Retail, Stadium / Arena, Theme Park, Warehouse (non-manufacturing), Assisted Living / Nursing Home, Hospital, Medical Laboratory, Medical Office, OutPatient Surgery Center, Court House, Dormitory, Education Facility, Government Building, Library, Military Facility, Museum, Prison / Correctional Facility, Recreation Building, Religious Building, Research Facility / Laboratory, Multi-Family Housing, Single-Family Housing, Airport, Bridge, Canal / Waterway, Dams / Flood Control / Reservoirs, Harbor / River Development, Rail, Seaport, Streets / Roads / Highways, Transportation Building, Tunnel, Waste Water / Sewers, Water Supply, Manufacturing / Factory, Mining Facility, Oil & Gas, Plant, Power Plant, Solar Farm, Utilities, Wind Farm, Demonstration Project, Template Project and Training Project.

                            Max length: 255
                        classification:
                          type: string
                          x-forma-type: "enum:string"
                          description: |-
                            The classification of the project. Possible values:

                            - production – Standard project.

                            - template – A project that serves as a template for creating new projects.

                            - component – A placeholder project containing reusable components (e.g., forms). Only one component project is allowed per hub. Known as a library in the Forma UI.

                            - sample – A single sample project automatically created for Forma trials (limited to one per hub).
                        projectValue:
                          type: object
                          x-forma-type: object
                          description: "Contains details about the estimated cost of the project, including the amount (value) and the currency (currency)."
                          properties:
                            value:
                              type: number
                              x-forma-type: number
                              description: "The estimated cost of the project, based on the currency specified in the currency field. Default: 0."
                            currency:
                              type: string
                              x-forma-type: "enum:string"
