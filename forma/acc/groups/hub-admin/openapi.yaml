    get:
      operationId: admin-projectsprojectId-GET
      summary: "Retrieves a project specified by project ID"
      description: "Retrieves a project specified by project ID. You can find the project ID by calling GET /accounts/{accountId}/projects and examining results.id in the response."
      parameters:
        - name: projectId
          in: path
          required: true
          description: "The ID of the project. This corresponds to project ID in the Data Management API. To convert a project ID in the Data Management API into a project ID in the Forma API you need to remove the “b.\" prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: fields
          in: query
          description: |-
            A comma-separated list of the project fields to include in the response. Default value: all fields.
