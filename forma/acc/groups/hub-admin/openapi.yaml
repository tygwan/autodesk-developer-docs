      summary: "Retrieves information about a filtered subset of users in the specified project"
      description: "Retrieves information about a filtered subset of users in the specified project."
      parameters:
        - name: projectId
          in: path
          required: true
          description: "The ID of the project. This corresponds to project ID in the Data Management API. To convert a project ID in the Data Management API into a project ID in the Forma API you need to remove the “b.\" prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: "filter[products]"
          in: query
          description: |-
            A comma-separated list of the products that the returned users must have access to in the specified project. Only users that have access to one or more of the specified products are returned.
            Note that every product in the same hub as the project is activated for the project, and a separate subset of these products is active for each user. This endpoint can retrieve users from Forma or BIM 360 projects.

            Some products are exclusive to Forma or to BIM 360, others are available on both platforms. Specify only the products on the appropriate platform for the users you want to retrieve.

            Possible Forma values: accountAdministration, autoSpecs, build, buildingConnected, capitalPlanning, cloudWorksharing, cost, designCollaboration, docs, financials, insight, modelCoordination, projectAdministration, takeoff, and workshopxr.

            Possible BIM 360 values: accountAdministration, assets, cloudWorksharing, costManagement, designCollaboration, documentManagement, field, fieldManagement, glue, insight, modelCoordination, plan, projectAdministration, projectHome, projectManagement, and quantification.
          schema:
            type: array
            items:
              type: string
            x-forma-type: "array: string"
        - name: "filter[name]"
          in: query
          description: |-
            A user name or name pattern that the returned users must have. Can be a partial match based on the value of filterTextMatch that you provide.
            For example:

            filter[name]=Sample filterTextMatch=startsWith

            Max length: 255
          schema:
            type: string
            x-forma-type: string
        - name: "filter[email]"
