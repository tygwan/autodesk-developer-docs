    post:
      operationId: admin-accounts-accountidprojects-POST
      summary: "Creates a new project in the specified hub"
      description: "Creates a new project in the specified hub. You can create the project directly, or clone it from a project template."
      parameters:
        - name: accountId
          in: path
          required: true
          description: "The ID of the hub that contains the projects. This corresponds to the hub ID used in the Data Management API, with the “b.\" prefix removed. For example, b.c8b0c73d-3ae9 becomes c8b0c73d-3ae9."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: Content-Type
          in: header
          required: true
          description: "Must be application/json"
          schema:
            type: string
            x-forma-type: string
        - name: Region
          in: header
          description: |-
            Specifies the region where your request should be routed. If not set, the request is routed automatically, which may result in a slight increase in latency.
            Possible values: US, EMEA. For a complete list of supported regions, see the Regions page.
          schema:
            type: string
            x-forma-type: string
        - name: User-Id
          in: header
          description: |-
            The ID of a user on whose behalf your request is acting.
            Your app has access to all users specified by the administrator in the SaaS integrations UI. Provide this header value to identify the user to be affected by the request.

            You can use either the user’s Forma ID (id), or their Autodesk ID (autodeskId).

            Note that this header is required for hub Admin POST, PATCH, and DELETE endpoints if you want to use a 2-legged authentication context. This header is optional for hub Admin GET endpoints.
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "account:write"
