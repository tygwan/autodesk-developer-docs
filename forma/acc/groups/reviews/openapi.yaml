                        (Allow approvers to choose if the attributes of rejected files are updated for the source folder in the UI)
                        Determines whether approvers can choose to update attributes for rejected files in the source folder when submitting a review.
                        Only applicable when enableAttachedAttributes and updateSourceAndCopiedFiles are true.

                        true: approvers can choose to update attributes for both approved and rejected files in the source folder.

                        false: (default) attributes are only updated for approved files.
              required:
                - copyFilesOptions
                - name
                - steps
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: "APS OAuth2. 엔드포인트마다 x-forma-auth-context 를 확인하세요. \"user context required\" 는 3-legged 토큰이 필요하고, \"user context optional\" 은 2-legged(client_credentials)로도 호출할 수 있습니다."
      flows:
        clientCredentials:
          tokenUrl: "https://developer.api.autodesk.com/authentication/v2/token"
          scopes:
            "data:read": "data:read"
            "data:write": "data:write"
