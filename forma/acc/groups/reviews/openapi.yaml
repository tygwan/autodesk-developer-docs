openapi: "3.1.0"
info:
  title: "Forma APIs — Reviews"
  version: v1
  description: |-
    Forma APIs — Reviews.
    Autodesk 문서에서 자동 추출됨. 원본: https://aps.autodesk.com/en/docs/acc/v1
    공통 base 경로: /construction/reviews/v1/projects
    **리전 — 호출 전 반드시 확인** 리전은 완전히 분리되어 있고 리소스 식별자가 호환되지 않습니다. ⚠️ **헤더 이름이 그룹마다 다릅니다.** Hub Admin 은 `Region`, Issues 는 `x-ads-region` 입니다. 이 문서의 "헤더" 표에 적힌 이름을 그대로 쓰세요. 통일해서 보내면 안 됩니다. 미지정 시 자동 라우팅되며 지연이 늘 수 있습니다. 자세한 판정은 `_errata` E-003 참고.
servers:
  - url: "https://developer.api.autodesk.com"
x-forma-group: Reviews
x-forma-common-base: "/construction/reviews/v1/projects"
paths:
  "/construction/reviews/v1/projects/{projectId}/reviews/{reviewId}/progress":
    get:
      operationId: reviews-getreviewprogress-GET
      summary: "Retrieves the progress of a specific review in the specified project"
      description: "Retrieves the progress of a specific review in the specified project."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You can provide the project ID with or without the “b." prefix.

            - Example with prefix: b.563a4c30-e30d-4869-ac02-2a18b6447abe

            - Example without prefix: 563a4c30-e30d-4869-ac02-2a18b6447abe
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: reviewId
          in: path
          required: true
          description: |-
            The unique ID of the review.
            This must be the UUID, not the numeric sequence ID shown in the Reviews UI.

            To find the review ID, call GET reviews.
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: limit
          in: query
          description: "The maximum number of review-progress records to return. Valid range: 1–50. Default: 50. For example: limit=2."
          schema:
            type: integer
            x-forma-type: int
        - name: offset
          in: query
          description: "The zero-based index of the first record to return. Use with limit for pagination. Default: 0. For example: offset=10."
          schema:
            type: integer
            x-forma-type: int
        - name: x-user-id
          in: header
          description: |-
            The Autodesk ID of the user on whose behalf the request is made. Use this header to specify which user should be affected by the request. Your application must be configured to act on behalf of that user.
            This header is only required when using two-legged authentication. It is not needed for three-legged authentication.

            Only the user’s Autodesk ID (autodeskId) can be accepted.
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        stepId:
                          type: string
                          x-forma-type: string
                          description: "The ID of the review step this progress record relates to."
                        stepName:
                          type: string
                          x-forma-type: string
                          description: "The name of the review step this progress record relates to."
                        claimedBy:
                          type: object
                          x-forma-type: object
                          description: "Information about the user who claimed the step."
                          properties:
                            autodeskId:
                              type: string
                              x-forma-type: string
                              description: "The Autodesk ID of the user. To find details about the user, call GET users/:Id."
                            name:
                              type: string
                              x-forma-type: string
                              description: "The name of the user."
                        actionBy:
                          type: object
                          x-forma-type: object
                          description: "Information about the user recorded when the step status is SUBMITTED or VOID. In the Reviews UI, these statuses occur when a participant submits their decision or when a step is voided."
                          properties:
                            autodeskId:
                              type: string
                              x-forma-type: string
                              description: "The Autodesk ID of the user. To find details about the user, call GET users/:Id."
                            name:
                              type: string
                              x-forma-type: string
                              description: "The name of a user."
                        candidates:
                          type: object
                          x-forma-type: object
                          description: "Information about the users, roles, and companies who are eligible to take the next action in this step."
                          properties:
                            roles:
                              type: array
                              items:
                                type: object
                                properties:
                                  autodeskId:
                                    type: string
                                    x-forma-type: string
                                    description: "The Autodesk ID of the role."
                                  name:
                                    type: string
                                    x-forma-type: string
                                    description: "The name of the role."
                              x-forma-type: "array: object"
                              description: "Project roles that can act in this step."
                            users:
                              type: array
                              items:
                                type: object
                                properties:
                                  autodeskId:
                                    type: string
                                    x-forma-type: string
                                    description: "The Autodesk ID of the user."
                                  name:
                                    type: string
                                    x-forma-type: string
                                    description: "The name of the user."
                              x-forma-type: "array: object"
                              description: "Individual users who can act in this step."
                            companies:
                              type: array
                              items:
                                type: object
                                properties:
                                  autodeskId:
                                    type: string
                                    x-forma-type: string
                                    description: "The Autodesk ID of the company."
                                  name:
                                    type: string
                                    x-forma-type: string
                                    description: "The name of the company."
                              x-forma-type: "array: object"
                              description: "Companies that can act in this step."
                        endTime:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: "The date and time when the step ended. This value is set when the step is completed, either by being submitted or voided."
                        notes:
                          type: string
                          x-forma-type: string
                          description: "Additional information recorded for this step in the review’s progress."
                        status:
                          type: string
                          x-forma-type: "enum:string"
                          description: |-
                            The current status of the step. Possible values:

                            - CLAIMED: A user has claimed the step.

                            - UNCLAIMED: No user has claimed the step.

                            - SUBMITTED: A user submitted the step (e.g., approved/rejected/custom).

                            - VOID: The step was voided.
                    x-forma-type: "array: object"
                    description: "The list of review-progress records, returned in reverse chronological order."
                  pagination:
                    type: object
                    x-forma-type: object
                    description: "Metadata about the paginated results."
                    properties:
                      limit:
                        type: integer
                        x-forma-type: int
                        description: "The maximum number of results returned per page."
                      offset:
                        type: integer
                        x-forma-type: int
                        description: "The number of results skipped before the current page. Zero-based index."
                      totalResults:
                        type: integer
                        x-forma-type: int
                        description: "The total number of results that match the query, regardless of pagination."
                      nextUrl:
                        type: string
                        x-forma-type: string
                        description: "The URL for the next page of results. If omitted, there are no more pages."
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context optional"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/reviews-getreviewprogress-GET"
  "/construction/reviews/v1/projects/{projectId}/reviews/{reviewId}/versions":
    get:
      operationId: reviews-getreviewversions-GET
      summary: "Retrieves the file versions included in the latest round of the specified review"
      description: "Retrieves the file versions included in the latest round of the specified review."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You can provide the project ID with or without the “b." prefix.

            - Example with prefix: b.563a4c30-e30d-4869-ac02-2a18b6447abe

            - Example without prefix: 563a4c30-e30d-4869-ac02-2a18b6447abe
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: reviewId
          in: path
          required: true
          description: |-
            The unique ID of the review.
            It must be in UUID format — not the numeric sequence ID shown in the Reviews UI. To find the review ID, call GET reviews.
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: limit
          in: query
          description: "The number of file versions to return in the response. Possible values: 1-50. Maximum: 50. Default: 50. For example: limit=2."
          schema:
            type: integer
            x-forma-type: int
        - name: offset
          in: query
          description: "The index of the first result to return (zero-based). Default: 0. For example: offset=10."
          schema:
            type: integer
            x-forma-type: int
        - name: "filter[approveStatus]"
          in: query
          description: |-
            Filters the results based on the approval status assigned to each file during the review. It should be URL-encoded.
            The filter applies to the label of the approval status, as defined in the workflow — not the internal value.

            For example, if your workflow includes a status labeled Approved with comments, you would filter using that label:

            filter[approveStatus]=Approved with comments.

            This is especially useful when a workflow includes multiple approval options with customized labels.

            Note: It supports multiple values.

            For example, if you want to filter with 2 labels: both Approved and Rejected, you could filter with the query string:

            filter[approveStatus]=Approved&filter[approveStatus]=Rejected
          schema:
            type: array
            x-forma-type: array
        - name: x-user-id
          in: header
          description: |-
            The Autodesk ID of the user on whose behalf the request is made. Use this header to specify which user should be affected by the request. Your application must be configured to act on behalf of that user.
            This header is only required when using two-legged authentication. It is not needed for three-legged authentication.

            Only the user’s Autodesk ID (autodeskId) can be accepted.
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        urn:
                          type: string
                          x-forma-type: string
                          description: |-
                            The URN of the file version currently under review.
                            This value is used when retrieving the full approval and review history of a specific version.
                            See GET approval-statuses for more details.
                        itemUrn:
                          type: string
                          x-forma-type: string
                          description: "The URN of the file item this version belongs to."
                        approveStatus:
                          type: object
                          x-forma-type: object
                          description: "The approval status assigned to the file during the review."
                          properties:
                            id:
                              type: string
                              x-forma-type: string
                              description: "The ID of the approval status."
                            label:
                              type: string
                              x-forma-type: string
                              description: |-
                                The custom label assigned to the approval status.
                                Max length: 255
                            value:
                              type: string
                              x-forma-type: "enum:string"
                              description: "The internal value representing the approval status outcome. Possible values: APPROVED, REJECTED."
                        reviewContent:
                          type: object
                          x-forma-type: object
                          description: "Review-specific metadata related to the file version."
                          properties:
                            name:
                              type: string
                              x-forma-type: string
                              description: |-
                                The pending file name assigned during the review.
                                If the review is approved, this becomes the official version name.
                                In most cases, this value is automatically generated according to the naming standard configured on the folder.
                            customAttributes:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    x-forma-type: int
                                    description: "The ID of the attribute."
                                  type:
                                    type: string
                                    x-forma-type: "enum:string"
                                    description: "The data type of the attribute. Possible values: string (text field), date, array (drop-down list), largeList (large drop-down list)."
                                  name:
                                    type: string
                                    x-forma-type: string
                                    description: "The name of the attribute."
                                  value:
                                    type: string
                                    x-forma-type: string
                                    description: "The value of the attribute."
                              x-forma-type: "array: object"
                              description: "A list of custom attributes applied to the file during the review."
                        copiedFileVersionUrn:
                          type: string
                          x-forma-type: string
                          description: |-
                            The URN of the version copied to the target folder after the file was approved.
                            This field is only present if the workflow includes a copy action and the file was approved.
                        name:
                          type: string
                          x-forma-type: string
                          description: "The name of the resulting file version."
                    x-forma-type: "array: object"
                    description: "A list of file versions included in the latest round of the review."
                  pagination:
                    type: object
                    x-forma-type: object
                    description: "Metadata about the paginated results."
                    properties:
                      limit:
                        type: integer
                        x-forma-type: int
                        description: "The maximum number of results returned per page."
                      offset:
                        type: integer
                        x-forma-type: int
                        description: "The number of results skipped before the current page. Zero-based index."
                      totalResults:
                        type: integer
                        x-forma-type: int
                        description: "The total number of results that match the query, regardless of pagination."
                      nextUrl:
                        type: string
                        x-forma-type: string
                        description: |-
                          The URL to retrieve the next page of file versions results, if any.
                          If not included, this is the last page.
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context optional"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/reviews-getreviewversions-GET"
  "/construction/reviews/v1/projects/{projectId}/reviews/{reviewId}/workflow":
    get:
      operationId: reviews-getreviewworkflow-GET
      summary: "Retrieves the approval workflow associated with a specific review"
      description: "Retrieves the approval workflow associated with a specific review."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You can provide the project ID with or without the “b." prefix.

            - Example with prefix: b.563a4c30-e30d-4869-ac02-2a18b6447abe

            - Example without prefix: 563a4c30-e30d-4869-ac02-2a18b6447abe
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: reviewId
          in: path
          required: true
          description: |-
            The unique ID of the review.
            It must be in UUID format — not the numeric sequence ID shown in the Reviews UI. To find the review ID, call GET reviews.
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  name:
                    type: string
                    x-forma-type: string
                    description: |-
                      The name of the workflow. It must be unique within the project.
                      Max length: 255
                  description:
                    type: string
                    x-forma-type: string
                    description: |-
                      A description of the workflow.
                      Max length: 4096
                  notes:
                    type: string
                    x-forma-type: string
                    description: |-
                      A custom note associated with the workflow. Visible to all reviewers during the review process.
                      Max length: 4096
                  additionalOptions:
                    type: object
                    x-forma-type: object
                    description: "Workflow-level settings that control additional edit permissions for initiators and approvers."
                    properties:
                      allowInitiatorToEdit:
                        type: boolean
                        x-forma-type: boolean
                        description: |-
                          Deprecated Supported for backward compatibility. Use initiatorEditPermissions with value REVIEWER_ASSIGNMENTS_AND_DURATION instead, which provides the same behavior.
                          true: the initiator can change reviewer assignments and durations.

                          false: (default) reviewers and durations are fixed.
                      initiatorEditPermissions:
                        type: array
                        items:
                          type: string
                        x-forma-type: "array: string"
                        description: |-
                          An optional array of values that grant the initiator additional edit permissions. Replaces the deprecated allowInitiatorToEdit field. If omitted or empty, the initiator has no additional edit permissions. Default: [].
                          Possible values:

                          - REVIEWER_ASSIGNMENTS_AND_DURATION - Allows the initiator to edit reviewer assignments and step durations. Equivalent to setting allowInitiatorToEdit to true.

                          - APPROVERS - Allows the initiator to modify the approver candidate list.

                          - CLOSED_REVIEW_TITLE - Allows the initiator to rename closed reviews.

                          - START_OWN_REVIEW - Allows the initiator to start their own reviews.
                      approverEditPermissions:
                        type: array
                        items:
                          type: string
                        x-forma-type: "array: string"
                        description: |-
                          An optional array of values that grant approvers additional edit permissions in the UI. If omitted or empty, approvers have no additional edit permissions. Default: [] (empty array).
                          Possible values:

                          - APPROVERS - Allow approvers to adjust the approvers in approver steps.
                  id:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The ID of the workflow."
                  approvalStatusOptions:
                    type: array
                    items:
                      type: object
                      properties:
                        label:
                          type: string
                          x-forma-type: string
                          description: |-
                            The display name shown in the UI. It must be unique across all status options (built-in and custom).
                            Maximum length: 255 characters.

                            Max length: 255
                        value:
                          type: string
                          x-forma-type: "enum:string"
                          description: "The value representing the approval outcome. Possible values: APPROVED, REJECTED."
                        id:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "The unique identifier of this approval status entry in the workflow."
                        builtIn:
                          type: boolean
                          x-forma-type: boolean
                          description: |-
                            Indicates whether the approval status is a built-in option.
                            true: the status is built in (e.g., APPROVED, REJECTED).

                            false: the status is a custom option created by a user.
                    x-forma-type: "array: object"
                    description: "A list of file review status options to the workflow, which contains two built in options returned by the system."
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          x-forma-type: string
                          description: |-
                            The name of the step, as defined in the workflow. It appears in the UI and is used in workflow configuration. Maximum length: 255 characters.
                            Max length: 255
                        type:
                          type: string
                          x-forma-type: "enum:string"
                          description: |-
                            Indicates the step type in the workflow. Possible values:

                            - INITIATOR: the first step. It typically represents the person who launches the review.

                            - REVIEWER: an intermediate step. It allows one or more reviewers to evaluate the files.

                            - APPROVER: the final step. It represents the decision maker who approves or rejects the files.
                        duration:
                          type: integer
                          x-forma-type: int
                          description: |-
                            (Time allowed in the UI) The number of days allocated to complete this step.
                            This field applies only to REVIEWER and APPROVER steps. It is used to calculate the due date based on the selected dueDateType.

                            Valid range: 1–99.
                        dueDateType:
                          type: string
                          x-forma-type: "enum:string"
                          description: |-
                            Specifies how the due date is calculated for this step. It works together with duration.
                            This field applies only to REVIEWER and APPROVER steps.

                            Possible values:

                            - CALENDAR_DAY (default): the due date includes all calendar days, including weekends and holidays.

                            - WORKDAY: the due date excludes weekends and project holidays.
                        groupReview:
                          type: object
                          x-forma-type: object
                          description: "(Reviewer Type in the UI) Defines whether multiple reviewers can participate in this step and how their responses are handled. It applies only to REVIEWER steps."
                          properties:
                            enabled:
                              type: boolean
                              x-forma-type: boolean
                              description: |-
                                Indicates whether group review is enabled for this step.
                                true: multiple reviewers can participate in the step.

                                false: (default) only a single reviewer is allowed.
                            type:
                              type: string
                              x-forma-type: "enum:string"
                              description: |-
                                (Displayed under More options in the UI) Specifies the group review rule for this step.
                                Possible values:

                                - ALL: every reviewer assigned to the step must submit a response (up to 30).

                                - MINIMUM: only a specified number of reviewers must respond, as defined in min.
                            min:
                              type: integer
                              x-forma-type: int
                              description: "The minimum number of reviewers required for this step. This field is set automatically when the group review type is set to MINIMUM. It is not independently configurable. Valid range: 1–30."
                        id:
                          type: string
                          x-forma-type: string
                          description: "The ID of the step."
                        candidates:
                          type: object
                          x-forma-type: object
                          description: |-
                            (Displayed in the UI when selecting reviewers for a step)
                            Lists the users, roles, or companies that were configured as reviewers for this step.
                            These candidates are defined during workflow setup and determine who will be invited to participate in the step during a review.
                          properties:
                            roles:
                              type: array
                              items:
                                type: object
                                properties:
                                  autodeskId:
                                    type: string
                                    x-forma-type: string
                                    description: "The Autodesk ID of the role."
                                  name:
                                    type: string
                                    x-forma-type: string
                                    description: "The name of the role."
                              x-forma-type: "array: object"
                              description: "A list of project roles assigned as candidates for this step."
                            users:
                              type: array
                              items:
                                type: object
                                properties:
                                  autodeskId:
                                    type: string
                                    x-forma-type: string
                                    description: "The Autodesk ID of the user."
                                  name:
                                    type: string
                                    x-forma-type: string
                                    description: "The name of the user."
                              x-forma-type: "array: object"
                              description: "A list of individual users assigned as candidates for this step."
                            companies:
                              type: array
                              items:
                                type: object
                                properties:
                                  autodeskId:
                                    type: string
                                    x-forma-type: string
                                    description: "The Autodesk ID of the company."
                                  name:
                                    type: string
                                    x-forma-type: string
                                    description: "The name of the company."
                              x-forma-type: "array: object"
                              description: "A list of companies assigned as candidates for this step."
                    x-forma-type: "array: object"
                    description: "A list of steps specify the details for each step in the workflow."
                  copyFilesOptions:
                    type: object
                    x-forma-type: object
                    description: "(Copy approved files in the UI) The configuration for copying approved files to a target folder when the review is complete."
                    properties:
                      enabled:
                        type: boolean
                        x-forma-type: boolean
                        description: |-
                          Indicates whether approved files should be copied to a target folder after the review is complete.
                          true: copy approved files to the target folder.

                          false: do not copy approved files.
                      allowOverride:
                        type: boolean
                        x-forma-type: boolean
                        description: |-
                          (Allow the initiator to change the target folder in the UI) Allows the initiator to change the target folder when creating a review.
                          true: the initiator can choose a different target folder.

                          false: the folder defined in the workflow is used.
                      condition:
                        type: string
                        x-forma-type: string
                        description: |-
                          (All/Any files in the review have been approved in the UI)
                          Specifies the condition under which approved files will be copied.
                          Possible values:

                          ANY: copy files if at least one file in the review is approved.

                          ALL: copy files only if all files in the review are approved.
