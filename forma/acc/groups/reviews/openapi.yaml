      operationId: reviews-workflows-GET
      summary: "Retrieves all approval workflows used for file reviews in a given project"
      description: "Retrieves all approval workflows used for file reviews in a given project."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You can provide the project ID with or without the “b." prefix.

            - Example with prefix: b.563a4c30-e30d-4869-ac02-2a18b6447abe

            - Example without prefix: 563a4c30-e30d-4869-ac02-2a18b6447abe
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: limit
          in: query
          description: "The maximum number of approval workflows to return in a single request. Possible values: 1-50. Maximum: 50. Default: 50. For example: limit=2."
          schema:
            type: integer
            x-forma-type: int
        - name: offset
          in: query
          description: "The index at which the endpoint starts returning results. Used for pagination. Default: 0. For example: offset=10."
          schema:
            type: integer
            x-forma-type: int
        - name: sort
          in: query
          description: |-
            Specifies a single field to sort the results by. The default order is ascending (asc); to sort in descending order, add desc.
            Possible sorting fields: name, status, updatedAt.
            For example: sort=name desc.
          schema:
            type: string
            x-forma-type: string
        - name: "filter[initiator]"
          in: query
          description: |-
            Filters the results based on who initiated the workflow. For example: filter[initiator]=true.
            true: return only workflows initiated by the current user.
            This filter is ignored if the user is a project admin.

            false: (default) return workflows regardless of who initiated them.

            Note that this filter cannot be used together with filter[status].
          schema:
            type: boolean
            x-forma-type: boolean
        - name: "filter[status]"
          in: query
          description: |-
            Filters the results by workflow status. For example: filter[status]=INACTIVE. Possible values:
            ACTIVE: return only active workflows.

            INACTIVE: return only inactive (disabled) workflows.

            Default: ACTIVE.

            Note that this filter cannot be used together with filter[initiator].
          schema:
            type: string
            x-forma-type: "enum:string"
        - name: x-user-id
          in: header
          description: |-
            The Autodesk ID of the user on whose behalf the request is made. Use this header to specify which user should be affected by the request. Your application must be configured to act on behalf of that user.
            This header is only required when using two-legged authentication. It is not needed for three-legged authentication.

            Only the user’s Autodesk ID (autodeskId) can be accepted.
          schema:
            type: string
            x-forma-type: string
