openapi: "3.1.0"
info:
  title: "Forma APIs — Classifications (beta)"
  version: v1
  description: |-
    Forma APIs — Classifications (beta).
    Autodesk 문서에서 자동 추출됨. 원본: https://aps.autodesk.com/en/docs/acc/v1
    공통 base 경로: /construction/classifications/v1/projects
    **리전 — 호출 전 반드시 확인** 리전은 완전히 분리되어 있고 리소스 식별자가 호환되지 않습니다. ⚠️ **헤더 이름이 그룹마다 다릅니다.** Hub Admin 은 `Region`, Issues 는 `x-ads-region` 입니다. 이 문서의 "헤더" 표에 적힌 이름을 그대로 쓰세요. 통일해서 보내면 안 됩니다. 미지정 시 자동 라우팅되며 지연이 늘 수 있습니다. 자세한 판정은 `_errata` E-003 참고.
servers:
  - url: "https://developer.api.autodesk.com"
x-forma-group: "Classifications (beta)"
x-forma-common-base: "/construction/classifications/v1/projects"
paths:
  "/construction/classifications/v1/projects/{projectId}/trees:import":
    post:
      operationId: classifications-treesimport-POST
      summary: Trees
      description: "Creates a new classification tree by importing a structured hierarchy of nodes, and publishes it as the latest version (tip version)."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial.

            You need to convert the project ID into a project ID for the Forma API by removing the b. prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7.
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: Region
          in: header
          description: |-
            The region to which your request should be routed. If not set, the request is routed automatically but may incur a small latency increase.

            Examples include: US, EMEA.

            For the full list of supported regions, see the Regions page.
          schema:
            type: string
            x-forma-type: string
        - name: Content-Type
          in: header
          required: true
          description: "Must be application/json"
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:write"
      responses:
        "201":
          description: Created
          content:
            "application/json":
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The unique identifier of the classification tree."
                  name:
                    type: string
                    x-forma-type: string
                    description: "The name of the tree."
                  description:
                    type: string
                    x-forma-type: string
                    description: "The description of the tree."
                  isBasedOnAccountTree:
                    type: boolean
                    x-forma-type: boolean
                    description: |-
                      true : the tree is linked to an account-level source tree and changes to the source may propagate to this tree.

                      false : the tree is either standalone or was originally based on an account tree but has since been disconnected.
                  treeConnectionType:
                    description: "The connection state of the tree. standalone: not derived from another tree. connected: derived from another tree and linked to it. disconnected: derived from another tree but disconnected from it."
                    type: object
                    properties:
                      anyOf:
                        description: "The connection state of the tree. standalone: not derived from another tree. connected: derived from another tree and linked to it. disconnected: derived from another tree but disconnected from it."
                        type: object
                        properties:
                          "0":
                            type: string
                            x-forma-type: "enum:string"
                            description: "Will always be: standalone"
                          "1":
                            type: string
                            x-forma-type: "enum:string"
                            description: "Will always be: connected"
                          "2":
                            type: string
                            x-forma-type: "enum:string"
                            description: "Will always be: disconnected"
                  originalTreeId:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The ID of the source tree this tree was based on. This can be a tree from the same project or from an account-level library. Returns null if the tree was not derived from another tree."
                  createdAt:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "The date and time when the tree was created, in the following format YYYY-MM-DDTHH:mm:ss.SSSZ (ISO 8601) in UTC. For example 2018-07-22T15:05:58.033Z."
                  updatedAt:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "The date and time when the tree was last updated, in the following format: YYYY-MM-DDTHH:mm:ss.SSSZ (ISO 8601) in UTC. For example, 2018-07-22T15:05:58.033Z. Note that this value is also updated when a new version is published."
                  createdBy:
                    type: string
                    x-forma-type: string
                    description: "The Autodesk ID of the user who created the tree. To find the name of user, call GET users."
                  updatedBy:
                    type: string
                    x-forma-type: string
                    description: "The Autodesk ID of the user who last updated the tree. To find the name of user, call GET users."
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "409":
          description: Conflict
        "422":
          description: "Unprocessable Entity"
        "429":
          description: "Too Many Requests"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:write"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/classifications-treesimport-POST"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                name:
                  type: string
                  x-forma-type: string
                  description: |-
                    The name of the tree.
                    Max length: 256
                description:
                  type: string
                  x-forma-type: string
                  description: |-
                    The description of the tree.
                    Max length: 256
                importData:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        x-forma-type: "string: UUID"
                        description: "The UUID identifier of the node. Optional for import and reimport. During reimport, if provided, the system uses this value to match and update an existing node. If no matching node is found or the field is omitted, a new node is created at the same position in the hierarchy."
                      name:
                        type: string
                        x-forma-type: string
                        description: |-
                          The display name of the node.
                          Max length: 2048
                      nodeCode:
                        type: string
                        x-forma-type: string
                        description: |-
                          A code that uniquely identifies the node within the tree.
                          Max length: 256
                      children:
                        type: array
                        x-forma-type: array
                        description: "The child nodes nested under this node. Each child follows the same structure and can include further nested children. Up to 50000 items are accepted in this array."
                    required:
                      - name
                  x-forma-type: "array: object"
                  description: "A list of root nodes for the tree. Each node can include nested children to represent the hierarchy. The full payload supports up to 50000 total nodes across all levels, with a maximum nesting depth of 10."
              required:
                - importData
                - name
  "/construction/classifications/v1/projects/{projectId}/trees/{treeId}:reimport":
