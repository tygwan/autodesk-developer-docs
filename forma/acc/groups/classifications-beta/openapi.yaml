    patch:
      operationId: classifications-trees-treeId-PATCH
      summary: "Updates a tree’s name or description"
      description: "Updates a tree’s name or description. Trees that are derived from and connected to an account-level source tree cannot be updated using this endpoint. If the tree is a source tree that is not derived from an account tree, the same update is propagated to its derived trees."
      parameters:
