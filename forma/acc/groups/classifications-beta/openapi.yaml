  "/construction/classifications/v1/projects/{projectId}/trees/{treeId}/versions/tip/nodes":
    get:
      operationId: classifications-trees-treeId-versions-tip-nodes-GET
      summary: "Retrieves the nodes from the latest version (tip version) of a classification tree"
      description: "Retrieves the nodes from the latest version (tip version) of a classification tree."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial.

            You need to convert the project ID into a project ID for the Forma API by removing the b. prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7.
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: treeId
          in: path
          required: true
          description: "The unique identifier of the classification tree. To find the ID, call GET trees."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: limit
          in: query
          description: "The maximum number of results to return per page. Acceptable values are 1-10000. Default value: 100."
          schema:
            type: integer
            x-forma-type: int
        - name: offset
          in: query
          description: "The number of results to skip before returning results. Use this together with limit to paginate through results. Default value: 0."
          schema:
            type: integer
            x-forma-type: int
        - name: includeDeleted
          in: query
          description: |-
            true: includes deleted nodes in the response.

            false: excludes deleted nodes from the response.
          schema:
            type: boolean
            x-forma-type: boolean
        - name: Region
          in: header
          description: |-
            The region to which your request should be routed. If not set, the request is routed automatically but may incur a small latency increase.

            Examples include: US, EMEA.

            For the full list of supported regions, see the Regions page.
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  pagination:
                    type: object
                    x-forma-type: object
                    description: "Pagination details for the result set."
                    properties:
                      limit:
                        type: integer
                        x-forma-type: int
                        description: "The maximum number of results to return per page."
                      offset:
                        type: integer
                        x-forma-type: int
                        description: "The number of results to skip before returning results."
                      totalResults:
                        type: integer
                        x-forma-type: int
                        description: "The total number of results available in the collection."
                      nextUrl:
                        type: string
                        x-forma-type: string
                        description: "The absolute URL of the next page of results, or null if there are no additional results."
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "The identifier of the node within the returned tree version."
                        externalId:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "Not relevant. Do not use or rely on this field. It will be removed in a future release."
                        name:
                          type: string
                          x-forma-type: string
                          description: "The display name of the node."
                        nodeCode:
                          type: string
                          x-forma-type: string
                          description: "A code that uniquely identifies the node within the tree."
                        parentNodeId:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "The identifier of the node’s immediate parent within the returned tree version. null for root-level nodes."
                        parentNodeExternalId:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "Not relevant. Do not use or rely on this field. It will be removed in a future release."
                        order:
                          type: integer
                          x-forma-type: int
                          description: "The position of the node among its sibling nodes under the same parent."
                        isDeleted:
                          type: boolean
                          x-forma-type: boolean
                          description: |-
                            true: the node has been deleted in the returned tree version.

                            false: the node is active in the returned tree version.
                    x-forma-type: "array: object"
                    description: "A list of nodes from the latest version (tip version) of the classification tree."
        "304":
          description: "Not Modified"
        "401":
