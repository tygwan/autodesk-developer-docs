  "/construction/sheets/v1/projects/{projectId}/sheets:batch-restore":
    post:
      operationId: sheets-sheetsbatch-restore-POST
      summary: "Restores deleted sheets"
      description: "Restores deleted sheets. The sheet is restored to the version set it was associated with when it was deleted."
      parameters:
        - name: projectId
          in: path
          required: true
          description: "The ID of the project. Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You can use a project ID either with a “b.” prefix or without a “b.” prefix. For instance, a project ID of “b.a4be0c34a-4ab7” can also be referred to as “a4be0c34a-4ab7”."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: x-user-id
          in: header
          description: |-
            The ID of the user on whose behalf the API request is made. This header is optional when using a 2-legged OAuth2, but required if using 2-legged OAuth2 with user impersonation.
            When using 2-legged OAuth2 without user impersonation, your app has access to all users defined by the administrator in the SaaS integrations UI. However, when user impersonation is enabled, the API call is restricted to act only on behalf of the specified user. This header is not relevant for 3-legged OAuth2.

            You can use either the user’s Forma ID (id), or their Autodesk ID (autodeskId).
          schema:
            type: string
            x-forma-type: string
        - name: Content-Type
          in: header
          required: true
          description: "Must be application/json"
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:write"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "The ID of the sheet."
                    x-forma-type: "array: object"
                    description: "The list of sheets that were successfully restored."
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        sheetId:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "The ID of the sheet that was not restored."
                        code:
                          type: string
                          x-forma-type: string
                          description: "The code of the error."
                        title:
                          type: string
                          x-forma-type: string
                          description: "The title of the error."
                        detail:
                          type: string
                          x-forma-type: string
                          description: "Details about the error."
                    x-forma-type: "array: object"
                    description: |-
                      The list of sheets that were not restored.
                      Sheets are usually not restored because a sheet with the same number exists in the version set.
        "400":
          description: "Bad Request"
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "409":
          description: Conflict
        "429":
          description: "Too Many Requests"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context optional"
      x-forma-scopes:
        - "data:write"
