openapi: "3.1.0"
info:
  title: "Forma APIs — Sheets"
  version: v1
  description: |-
    Forma APIs — Sheets.
    Autodesk 문서에서 자동 추출됨. 원본: https://aps.autodesk.com/en/docs/acc/v1
    공통 base 경로: /construction/sheets/v1/projects
    **리전 — 호출 전 반드시 확인** 리전은 완전히 분리되어 있고 리소스 식별자가 호환되지 않습니다. ⚠️ **헤더 이름이 그룹마다 다릅니다.** Hub Admin 은 `Region`, Issues 는 `x-ads-region` 입니다. 이 문서의 "헤더" 표에 적힌 이름을 그대로 쓰세요. 통일해서 보내면 안 됩니다. 미지정 시 자동 라우팅되며 지연이 늘 수 있습니다. 자세한 판정은 `_errata` E-003 참고.
servers:
  - url: "https://developer.api.autodesk.com"
x-forma-group: Sheets
x-forma-common-base: "/construction/sheets/v1/projects"
paths:
  "/construction/sheets/v1/projects/{projectId}/collections/{collectionId}":
    get:
      operationId: sheets-collections-collectionId-GET
      summary: "Retrieves a specific collection by its unique ID"
      description: "Retrieves a specific collection by its unique ID."
      parameters:
        - name: projectId
          in: path
          required: true
          description: "The ID of the project. Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You can use a project ID either with a “b.” prefix or without a “b.” prefix. For instance, a project ID of “b.a4be0c34a-4ab7” can also be referred to as “a4be0c34a-4ab7”."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: collectionId
          in: path
          required: true
          description: "The ID of the collection, To find the collection ID, call GET collections."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: x-user-id
          in: header
          description: |-
            The ID of the user on whose behalf the API request is made. This header is optional when using a 2-legged OAuth2, but required if using 2-legged OAuth2 with user impersonation.
            When using 2-legged OAuth2 without user impersonation, your app has access to all users defined by the administrator in the SaaS integrations UI. However, when user impersonation is enabled, the API call is restricted to act only on behalf of the specified user. This header is not relevant for 3-legged OAuth2.

            You can use either the user’s Forma ID (id), or their Autodesk ID (autodeskId).
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The unique identifier of the collection."
                  name:
                    type: string
                    x-forma-type: string
                    description: "The name of the collection. This corresponds to the Name column in the Forma Sheets Collections Settings UI."
                  createdAt:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "The date and time the collection was created."
                  createdBy:
                    type: string
                    x-forma-type: string
                    description: "The Autodesk ID of the user who created the collection."
                  createdByName:
                    type: string
                    x-forma-type: string
                    description: "The name of the user who created the collection."
                  updatedAt:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "The date and time the collection was last updated."
                  updatedBy:
                    type: string
                    x-forma-type: string
                    description: "The Autodesk ID of the user who last updated the collection."
                  updatedByName:
                    type: string
                    x-forma-type: string
                    description: "The name of the user who last updated the collection."
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context optional"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/sheets-collections-collectionId-GET"
  "/construction/sheets/v1/projects/{projectId}/collections":
    get:
      operationId: sheets-collections-GET
      summary: "Retrieves information about all the collections in a project"
      description: "Retrieves information about all the collections in a project. You can use GET sheets to return all the sheets associated with a specific collection."
      parameters:
        - name: projectId
          in: path
          required: true
          description: "The ID of the project. Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You can use a project ID either with a “b.” prefix or without a “b.” prefix. For instance, a project ID of “b.a4be0c34a-4ab7” can also be referred to as “a4be0c34a-4ab7”."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: offset
          in: query
          description: "The starting point for the results, specified by item number. The default value is 0. For example, use offset=3 to start the results from the third item."
          schema:
            type: integer
            x-forma-type: int
        - name: limit
          in: query
          description: "The number of results to return in the response."
          schema:
            type: integer
            x-forma-type: int
        - name: x-user-id
          in: header
          description: |-
            The ID of the user on whose behalf the API request is made. This header is optional when using a 2-legged OAuth2, but required if using 2-legged OAuth2 with user impersonation.
            When using 2-legged OAuth2 without user impersonation, your app has access to all users defined by the administrator in the SaaS integrations UI. However, when user impersonation is enabled, the API call is restricted to act only on behalf of the specified user. This header is not relevant for 3-legged OAuth2.

            You can use either the user’s Forma ID (id), or their Autodesk ID (autodeskId).
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "The unique identifier of the collection."
                        name:
                          type: string
                          x-forma-type: string
                          description: "The name of the collection. This corresponds to the Name column in the Forma Sheets Collections Settings UI."
                        createdAt:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: "The date and time the collection was created."
                        createdBy:
                          type: string
                          x-forma-type: string
                          description: "The Autodesk ID of the user who created the collection."
                        createdByName:
                          type: string
                          x-forma-type: string
                          description: "The name of the user who created the collection."
                        updatedAt:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: "The date and time the collection was last updated."
                        updatedBy:
                          type: string
                          x-forma-type: string
                          description: "The Autodesk ID of the user who last updated the collection."
                        updatedByName:
                          type: string
                          x-forma-type: string
                          description: "The name of the user who last updated the collection."
                    x-forma-type: "array: object"
                    description: "The list of collections."
                  pagination:
                    type: object
                    x-forma-type: object
                    description: "Pagination information for paged data."
                    properties:
                      limit:
                        type: integer
                        x-forma-type: int
                        description: "The number of results to return in the response."
                      offset:
                        type: integer
                        x-forma-type: int
                        description: "The item number from which the results begin."
                      previousUrl:
                        type: string
                        x-forma-type: string
                        description: "The URL for the previous page of results."
                      nextUrl:
                        type: string
                        x-forma-type: string
                        description: "The URL for the next page of results."
                      totalResults:
                        type: integer
                        x-forma-type: int
                        description: "The total number of results available."
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context optional"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/sheets-collections-GET"
  "/construction/sheets/v1/projects/{projectId}/exports/{exportId}":
    get:
      operationId: sheets-exports-exportId-GET
      summary: Exports
      description: "Retrieves the status of a PDF sheet export job, as well as the signed URL required to download the exported file once the export process is complete."
      parameters:
        - name: projectId
          in: path
          required: true
          description: "The ID of the project. Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You can use a project ID either with a “b.” prefix or without a “b.” prefix. For instance, a project ID of “b.a4be0c34a-4ab7” can also be referred to as “a4be0c34a-4ab7”."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: exportId
          in: path
          required: true
          description: "The ID of the export job. The export ID is generated when you initialize an export job using POST exports."
          schema:
            type: string
            x-forma-type: string
        - name: x-user-id
          in: header
          description: |-
            The ID of a user on whose behalf your API request is acting. Required for 2-legged OAuth2 with user impersonation.
            The app has access to all users specified by the administrator in the SaaS integrations UI. When you provide this header, the API call is limited to acting on behalf of the specified user.

            You can use either the user’s Forma ID (id) or their Autodesk ID (autodeskId).
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The ID of the sheets export job."
                  status:
                    type: string
                    x-forma-type: "enum:string"
                    description: |-
                      The status of the sheets export job.
                      Possible values: successful, processing, failed
                  result:
                    type: object
                    x-forma-type: object
                    description: |-
                      The result of a completed export job.

                      - If the status is successful, a downloadable signed URL will be included in the result.output object.

                      - If the status value is failed (e.g., because some files were deleted), the result.error object will include details of the error.
                    properties:
                      output:
                        type: object
                        x-forma-type: object
                        description: "Details about the downloadable signed URL."
                        properties:
                          signedUrl:
                            type: string
                            x-forma-type: string
                            description: "The signed URL that you can use to download the PDF file. Note that it expires in one hour."
                      error:
                        type: object
                        x-forma-type: object
                        description: "Information about the error."
                        properties:
                          code:
                            type: string
                            x-forma-type: string
                            description: "The code of the error."
                          title:
                            type: string
                            x-forma-type: string
                            description: "The title of the error."
                          detail:
                            type: string
                            x-forma-type: string
                            description: "The details of the error."
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context optional"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/sheets-exports-exportId-GET"
  "/construction/sheets/v1/projects/{projectId}/exports":
    post:
      operationId: sheets-exports-POST
      summary: "Exports up to 1000 sheets from the from the Sheets tool in Forma Build into a new downloadble PDF file"
      description: "Exports up to 1000 sheets from the from the Sheets tool in Forma Build into a new downloadble PDF file."
      parameters:
        - name: projectId
          in: path
          required: true
          description: "The ID of the project. Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You can use a project ID either with a “b.” prefix or without a “b.” prefix. For instance, a project ID of “b.a4be0c34a-4ab7” can also be referred to as “a4be0c34a-4ab7”."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: x-user-id
          in: header
          description: |-
            The ID of a user on whose behalf your API request is acting. Required for 2-legged OAuth2 with user impersonation.
            The app has access to all users specified by the administrator in the SaaS integrations UI. When you provide this header, the API call is limited to acting on behalf of the specified user.

            You can use either the user’s Forma ID (id) or their Autodesk ID (autodeskId).
          schema:
            type: string
            x-forma-type: string
        - name: Content-Type
          in: header
          required: true
          description: "Must be application/json"
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:write"
      responses:
        "202":
          description: Accepted
          content:
            "application/json":
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The ID of the export job. Use the ID to poll GET exports/:exportId to check the job’s status. When the job is complete, you can retrieve the data you need to download the exported sheets."
                  status:
                    type: string
                    x-forma-type: "enum:string"
                    description: "The status of the export job; will always be: processing"
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context optional"
      x-forma-scopes:
        - "data:write"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/sheets-exports-POST"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                options:
                  type: object
                  x-forma-type: object
                  description: |-
                    The criteria for the markups and links that should be included with the exported sheets.
                    Note that unpublished markups are only visible to their creator.
                  properties:
                    outputFileName:
                      type: string
                      x-forma-type: string
                      description: "The name of the file that will be generated by the export process. Note that this name should not include the file extension. The maximum character limit for this field is 255 characters."
                    standardMarkups:
                      type: object
                      x-forma-type: object
                      description: |-
                        The list of types of standard markups and their associated links that you want to include in the export.
                        By default markups will be exported and hyperlinks will not be exported.
                      properties:
                        includePublishedMarkups:
                          type: boolean
                          x-forma-type: boolean
                          description: |-
                            true: (default) include all published standard markups in the exported sheets. Note that published markups are visible to all project members.
                            false: export sheets without including published standard markups.
                        includeUnpublishedMarkups:
                          type: boolean
                          x-forma-type: boolean
                          description: |-
                            true: (default) standard markups that are visible only to their creators will be included in the exported sheets.
                            false: exported sheets will exclude unpublished markups.
                        includeMarkupLinks:
                          type: boolean
                          x-forma-type: boolean
                          description: |-
                            true: include links in the markups. Supported links are links to Sheets, Files, RFIs, Forms, Submittals, and Assets.
                            false: (default) do not include links in markups.

                            Note that if both includePublishedMarkups and includeUnpublishedMarkups are set to false, this parameter will be treated as false.
                    issueMarkups:
                      type: object
                      x-forma-type: object
                      description: "The list of types of issue markups to export."
                      properties:
                        includePublishedMarkups:
                          type: boolean
                          x-forma-type: boolean
                          description: |-
                            true: published issue markups will be included in the exported sheets.
                            false: (default) published issue markups will not be included in the exported sheets.
                        includeUnpublishedMarkups:
                          type: boolean
                          x-forma-type: boolean
                          description: |-
                            true: include issue markups in the exported sheets that are visible only to their creators or assignees.
                            false: (default) export sheets without including unpublished issue markups.
                    photoMarkups:
                      type: object
                      x-forma-type: object
                      description: "The list of types of photo markups to export."
                      properties:
                        includePublishedMarkups:
                          type: boolean
                          x-forma-type: boolean
                          description: |-
                            true: published photo markups will be included in the exported sheets.
                            false: (default) published photo markups will not be included in the exported sheets.
                        includeUnpublishedMarkups:
                          type: boolean
                          x-forma-type: boolean
                          description: |-
                            true: include photo markups in the exported sheets that are visible only to their creators or assignees.
                            false: (default) export sheets without including unpublished photo markups.
                    assetMarkups:
                      type: object
                      x-forma-type: object
                      description: "The options for Assets markups to export."
                      properties:
                        includeMarkups:
                          type: boolean
                          x-forma-type: boolean
                          description: |-
                            true: include all Assets markups in the exported sheets.
                            false: (Default) export sheets without including any Assets markups.
                sheets:
                  type: array
                  items:
                    type: string
                  x-forma-type: "array: string"
                  description: "The list of sheet UUIDs that you want to include in the export. A maximum of 1000 sheets can be included."
  "/construction/sheets/v1/projects/{projectId}/sheets:batch-delete":
    post:
      operationId: sheets-sheetsbatch-delete-POST
      summary: "Deletes a list of sheets"
      description: "Deletes a list of sheets."
      parameters:
        - name: projectId
          in: path
          required: true
          description: "The ID of the project. Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You can use a project ID either with a “b.” prefix or without a “b.” prefix. For instance, a project ID of “b.a4be0c34a-4ab7” can also be referred to as “a4be0c34a-4ab7”."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: x-user-id
          in: header
          description: |-
            The ID of the user on whose behalf the API request is made. This header is optional when using a 2-legged OAuth2, but required if using 2-legged OAuth2 with user impersonation.
            When using 2-legged OAuth2 without user impersonation, your app has access to all users defined by the administrator in the SaaS integrations UI. However, when user impersonation is enabled, the API call is restricted to act only on behalf of the specified user. This header is not relevant for 3-legged OAuth2.

            You can use either the user’s Forma ID (id), or their Autodesk ID (autodeskId).
          schema:
            type: string
            x-forma-type: string
        - name: Content-Type
          in: header
          required: true
          description: "Must be application/json"
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:write"
      responses:
        "204":
          description: "No Content"
        "400":
          description: "Bad Request"
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "429":
          description: "Too Many Requests"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context optional"
      x-forma-scopes:
        - "data:write"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/sheets-sheetsbatch-delete-POST"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  x-forma-type: "array: string"
                  description: |-
                    The IDs of the sheets to delete. To find the sheet IDs, call GET sheets.

                    - The max number of items is 200.
              required:
                - ids
  "/construction/sheets/v1/projects/{projectId}/sheets:batch-get":
    post:
      operationId: sheets-sheetsbatch-get-POST
      summary: "Retrieves a list of sheets by IDs"
      description: "Retrieves a list of sheets by IDs."
      parameters:
        - name: projectId
          in: path
          required: true
          description: "The ID of the project. Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You can use a project ID either with a “b.” prefix or without a “b.” prefix. For instance, a project ID of “b.a4be0c34a-4ab7” can also be referred to as “a4be0c34a-4ab7”."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: x-user-id
          in: header
          description: |-
            The ID of the user on whose behalf the API request is made. This header is optional when using a 2-legged OAuth2, but required if using 2-legged OAuth2 with user impersonation.
            When using 2-legged OAuth2 without user impersonation, your app has access to all users defined by the administrator in the SaaS integrations UI. However, when user impersonation is enabled, the API call is restricted to act only on behalf of the specified user. This header is not relevant for 3-legged OAuth2.

            You can use either the user’s Forma ID (id), or their Autodesk ID (autodeskId).
          schema:
            type: string
            x-forma-type: string
        - name: Content-Type
          in: header
          required: true
          description: "Must be application/json"
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "The ID of the sheet."
                        number:
                          type: string
                          x-forma-type: string
                          description: "The number of the sheet."
                        versionSet:
                          type: object
                          x-forma-type: object
                          description: "Basic version set data. For a complete collection of version set data, call GET version-sets."
                          properties:
                            id:
                              type: string
                              format: uuid
                              x-forma-type: "string: UUID"
                              description: "The ID of the version set."
                            name:
                              type: string
                              x-forma-type: string
                              description: |-
                                The name of the version set.
                                Max length: 255
                            issuanceDate:
                              type: string
                              format: date-time
                              x-forma-type: "datetime: ISO 8601"
                              description: "The issuance date of the version set in ISO-8601 format (YYYY-MM-DD)."
                            deleted:
                              type: boolean
                              x-forma-type: boolean
                              description: |-
                                - true if the version set has been deleted.

                                - false if the version set has not been deleted.
                        createdAt:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: "The time when the sheet was created, in ISO-8601 format (YYYY-MM-DDTHH:mm:ss.SSSZ)."
                        createdBy:
                          type: string
                          x-forma-type: string
                          description: "The ID of the user who created the sheet."
                        createdByName:
                          type: string
                          x-forma-type: string
                          description: "The name of the user who created the sheet."
                        updatedAt:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: "The time when the sheet was last updated, in ISO-8601 format (YYYY-MM-DDTHH:mm:ss.SSSZ)."
                        updatedBy:
                          type: string
                          x-forma-type: string
                          description: "The ID of the user who last updated the sheet."
                        updatedByName:
                          type: string
                          x-forma-type: string
