                      description: |-
                        The tags to be attached to the sheets.

                        - The max length is 100.

                        - The tags should not be space only.

                        - After applying addTags and removeTags, the number of remain tags of the sheets should not exceed 100.

                        The API will format the tags in the following ways before applying them to the sheets:

                        - Remove spaces at the end and beginning of the tags.

                        - Reduce multiple continuous spaces to a single space.

                        - The tags are case insensitive. Upper case letters will be transformed to lower case.
                    removeTags:
                      type: array
                      items:
