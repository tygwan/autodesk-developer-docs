openapi: "3.1.0"
info:
  title: "Forma APIs — Files"
  version: v1
  description: |-
    Forma APIs — Files.
    Autodesk 문서에서 자동 추출됨. 원본: https://aps.autodesk.com/en/docs/acc/v1
    **리전 — 호출 전 반드시 확인** 리전은 완전히 분리되어 있고 리소스 식별자가 호환되지 않습니다. ⚠️ **헤더 이름이 그룹마다 다릅니다.** Hub Admin 은 `Region`, Issues 는 `x-ads-region` 입니다. 이 문서의 "헤더" 표에 적힌 이름을 그대로 쓰세요. 통일해서 보내면 안 됩니다. 미지정 시 자동 라우팅되며 지연이 늘 수 있습니다. 자세한 판정은 `_errata` E-003 참고.
servers:
  - url: "https://developer.api.autodesk.com"
x-forma-group: Files
paths:
  "/bim360/docs/v1/projects/{project_id}/folders/{folder_id}/custom-attribute-definitions":
    get:
      operationId: document-management-custom-attribute-definitions-GET
      summary: "Custom Attributes (beta)"
      description: "Retrieves a complete list of custom attribute definitions for all the documents in a specific folder, including custom attributes that have not been assigned a value, as well as the potential drop-down (array) values."
      parameters:
        - name: project_id
          in: path
          required: true
          description: "The ID of the project. This corresponds to the project ID in the Data Management API. To convert a project ID in the Data Management API to a project ID in the BIM 360 API you need to remove the “b.\" prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: folder_id
          in: path
          required: true
          description: |-
            The URL-encoded ID (URN) of the folder.
            For details about how to find the URN, follow the initial steps (1-3) of the Download Files tutorial.
          schema:
            type: string
            x-forma-type: string
        - name: limit
          in: query
          description: "The number of results to return in the response. Acceptable values: 1-200. Default value: 10. For example, to limit the response to two custom attributes per page, use limit=2."
          schema:
            type: integer
            x-forma-type: int
        - name: offset
          in: query
          description: "The item number that you want to begin results from. Default value: 0. For example, to begin the results from item three, use offset=3."
          schema:
            type: integer
            x-forma-type: int
        - name: x-user-id
          in: header
          description: "In a two-legged authentication context, the app has access to all users specified by the administrator in the SaaS integrations UI. By providing this header, the API call will be limited to act on behalf of only the user specified."
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          x-forma-type: int
                          description: "The ID of the attribute."
                        name:
                          type: string
                          x-forma-type: string
                          description: "The name of the attribute."
                        type:
                          type: string
                          x-forma-type: "enum:string"
                          description: "The type of attribute. Possible values: string (text field), date, array (drop-list)."
                        arrayValues:
                          type: array
                          items:
                            type: string
                          x-forma-type: "array: string"
                          description: "A list of possible values for the attribute. Only relevant for drop-list attributes."
                    x-forma-type: "array: object"
                    description: "The list of results."
                  pagination:
                    type: object
                    x-forma-type: object
                    description: "Pagination information when data must be returned page by page."
                    properties:
                      limit:
                        type: integer
                        x-forma-type: int
                        description: "The number of results to return in the response."
                      offset:
                        type: integer
                        x-forma-type: int
                        description: "The item number that the results begin from."
                      totalResults:
                        type: integer
                        x-forma-type: int
                        description: "Total number of results."
                      previousUrl:
                        type: string
                        x-forma-type: string
                        description: "The URL for the previous page of results."
                      nextUrl:
                        type: string
                        x-forma-type: string
                        description: "The URL for the next page of results."
        "400":
          description: "Bad Request"
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context optional"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/document-management-custom-attribute-definitions-GET"
    post:
      operationId: document-management-custom-attribute-definitions-POST
      summary: "Adds a custom attribute to a folder"
      description: "Adds a custom attribute to a folder."
      parameters:
        - name: project_id
          in: path
          required: true
          description: "The ID of the project. This corresponds to the project ID in the Data Management API. To convert a project ID in the Data Management API to a project ID in the BIM 360 API you need to remove the “b.\" prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: folder_id
          in: path
          required: true
          description: |-
            The URL-encoded ID (URN) of the folder.
            For details about how to find the URN, follow the initial steps (1-3) of the Download Files tutorial.
          schema:
            type: string
            x-forma-type: string
        - name: Content-Type
          in: header
          required: true
          description: "Must be application/json"
          schema:
            type: string
            x-forma-type: string
        - name: x-user-id
          in: header
          description: "In a two-legged authentication context, the app has access to all users specified by the administrator in the SaaS integrations UI. By providing this header, the API call will be limited to act on behalf of only the user specified."
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:write"
      responses:
        "201":
          description: Created
          content:
            "application/json":
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    x-forma-type: int
                    description: "The ID of the attribute."
                  name:
                    type: string
                    x-forma-type: string
                    description: "The name of the attribute."
                  type:
                    type: string
                    x-forma-type: "enum:string"
                    description: "The type of attribute. Possible values: string (text field), date, array (drop-list)."
                  arrayValues:
                    type: array
                    items:
                      type: string
                    x-forma-type: "array: string"
                    description: "A list of possible values for the attribute. Only relevant for drop-list attributes."
        "400":
          description: "Bad Request"
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context optional"
      x-forma-scopes:
        - "data:write"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/document-management-custom-attribute-definitions-POST"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                name:
                  type: string
                  x-forma-type: string
                  description: "The name of the attribute. It needs to be unique within the folder."
                type:
                  type: string
                  x-forma-type: "enum:string"
                  description: "The type of attribute. Possible values: string (text field), date, array (drop-list)."
                arrayValues:
                  type: array
                  items:
                    type: string
                  x-forma-type: "array: string"
                  description: "A list of possible values for the attribute. Only relevant for drop-list attributes."
              required:
                - name
                - type
  "/bim360/docs/v1/projects/{project_id}/folders/{folder_id}/permissions:batch-create":
    post:
      operationId: document-management-projects-project_id-folders-folder_id-permissionsbatch-create-POST
      summary: "Assign permissions to multiple users, roles, and companies for a BIM 360 Document Management folder"
      description: "Assign permissions to multiple users, roles, and companies for a BIM 360 Document Management folder."
      parameters:
        - name: project_id
          in: path
          required: true
          description: "The ID of the project. This corresponds to project ID in the Data Management API. To convert a project ID in the Data Management API into a project ID in the BIM 360 API you need to remove the “b.\" prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: folder_id
          in: path
          required: true
          description: |-
            The ID (URN) of the folder.
            For details about how to find the URN, follow the initial steps (1-3) in the Download Files tutorial.
          schema:
            type: string
            x-forma-type: string
        - name: Content-Type
          in: header
          required: true
          description: "Must be application/json"
          schema:
            type: string
            x-forma-type: string
        - name: x-user-id
          in: header
          description: "In a two-legged authentication context, the app has access to all users specified by the administrator in the SaaS integrations UI. By providing this header, the API call will be limited to act on behalf of only the user specified."
