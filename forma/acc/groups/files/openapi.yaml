      operationId: document-management-projects-project_id-folders-folder_id-permissions-GET
      summary: Permissions
      description: "Retrieves information about the permissions assigned to users, roles and companies for a BIM 360 Document Management folder, including details about the name and the status."
      parameters:
        - name: project_id
