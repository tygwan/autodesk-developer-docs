  "/construction/packages/v1/projects/{projectId}/packages":
    get:
      operationId: packages-list-packages-GET
      summary: "Retrieves a list of all packages within a specified Forma project"
      description: "Retrieves a list of all packages within a specified Forma project."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            You can retrieve the project ID using the Data Management API. For more details, see the Retrieve a Project ID tutorial.

            You may provide the project ID with or without the b. prefix:

            - With prefix: b.657a5565-09b7-48e0-bd03-acacfe42efaf

            - Without prefix: 657a5565-09b7-48e0-bd03-acacfe42efaf
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: limit
          in: query
          description: |-
            The number of packages to return in the response payload.
            Possible values: 1-200. Default: 200. For example: limit=2.
          schema:
            type: integer
            x-forma-type: int
        - name: offset
          in: query
          description: |-
            The number of packages that you want to begin retrieving results from.
            Default: 0. For example: offset=10
          schema:
            type: integer
            x-forma-type: int
        - name: "filter[createdBy]"
          in: query
          description: |-
            Filters results by the Autodesk ID of the users who created the packages.
            You can provide a single Autodesk ID or a comma-separated list of IDs.
          schema:
            type: string
            x-forma-type: string
        - name: "filter[updatedBy]"
          in: query
          description: |-
            Filters results by the Autodesk ID of the users who last updated the packages.
            You can provide a single Autodesk ID or a comma-separated list of IDs.

            To find the IDs call GET users
          schema:
            type: string
            x-forma-type: string
        - name: "filter[createdAt]"
          in: query
          description: |-
            Filter packages by their creation time. Use an ISO 8601 date-time range in the format startDate..endDate.
            Either date may be omitted to specify an open-ended range.

            Examples:

            - After a specific time: 2025-03-26T16:00:00.000Z..

            - Before a specific time: ..2025-03-28T15:59:59.999Z

            - Between two times: 2025-03-26T16:00:00.000Z..2025-03-28T15:59:59.999Z
          schema:
            type: string
            x-forma-type: string
        - name: "filter[updatedAt]"
          in: query
          description: |-
            Filter packages by their last update time. Use an ISO 8601 date-time range in the format startDate..endDate.
            Either date may be omitted to specify an open-ended range.

            Examples:

            - After a specific time: 2025-03-26T16:00:00.000Z..

            - Before a specific time: ..2025-03-28T15:59:59.999Z

            - Between two times: 2025-03-26T16:00:00.000Z..2025-03-28T15:59:59.999Z
          schema:
            type: string
            x-forma-type: string
        - name: sort
          in: query
          description: |-
            Sorts the results by a supported field.
            By default, results are sorted in ascending (asc) order. To sort in descending order, add desc after the field name.

            Format: sort=fieldName [desc]

            Possible values: name, createdAt, updatedAt, displayId,

            Examples:

            - Sort by name (ascending): sort=name

            - Sort by creation time (descending): sort=createdAt desc
          schema:
            type: string
            x-forma-type: "enum:string"
        - name: "filter[versionType]"
          in: query
          description: |-
            Filters results by the version type of the packages.
            Possible values:

            - FIXED – Files in the package remain fixed at selected versions.

            - CURRENT – Files in the package automatically update to the latest current versions.

            For more details, see the Flexible Package Types documentation.
          schema:
            type: string
            x-forma-type: "enum:string"
        - name: x-user-id
          in: header
          description: |-
            The Autodesk ID of the user on whose behalf the request is made.
            This header is required only when using two-legged authentication. It is not needed for three-legged authentication.

            Your application can access only those users who are assigned to it in the SaaS Integrations UI.

            Only user Autodesk IDs (autodeskId) are supported.
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "The unique identifier (UUID) of the package."
                        displayId:
                          type: integer
                          x-forma-type: int
                          description: "The display ID of the package."
                        name:
                          type: string
                          x-forma-type: string
                          description: |-
                            The name of the package.
                            Max length: 255
                        description:
                          type: string
                          x-forma-type: string
                          description: |-
                            The description of the package.
                            Max length: 2048
                        createdAt:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: "The time the package was created."
                        createdBy:
                          type: string
                          x-forma-type: string
                          description: "The Autodesk ID of the user who created the package. For details about the user, call GET users."
                        updatedAt:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: "The time the package was last updated."
                        updatedBy:
                          type: string
                          x-forma-type: string
                          description: "The Autodesk ID of the user who last updated the package. For details about the user, call GET users."
                        locked:
                          type: boolean
                          x-forma-type: boolean
                          description: |-
                            true: The package is locked. Its contents cannot be modified until it is unlocked.
                            false: The package is not locked. Files and resources can still be added, removed, or updated.
                        lockedBy:
                          type: string
                          x-forma-type: string
                          description: "The Autodesk ID of the user who locked the package. For details about the user, call GET users."
                        lockedAt:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: "The time the package was locked."
                        resourceCount:
                          type: integer
                          x-forma-type: int
                          description: "The number of resources in the package."
                        versionType:
                          type: object
                          x-forma-type: object
                          description: |-
                            The version type of the package.
                            Possible values:

                            - FIXED – The files in the package remain fixed at the selected versions.

                            - CURRENT – The files in the package automatically update to the latest current versions.

                            - CHANGING – The package is temporarily changing from one version type to another. This state usually lasts only a few seconds and cannot be used as a filter.

                            For more details, see the Change Package Version Type documentation.
                    x-forma-type: "array: object"
                    description: "The list of results."
                  pagination:
                    type: object
                    x-forma-type: object
                    description: "The pagination information for the response. This object is included when results are returned in multiple pages."
                    properties:
                      limit:
                        type: integer
                        x-forma-type: int
                        description: "The maximum number of objects that may be returned in the page."
                      offset:
                        type: integer
                        x-forma-type: int
                        description: "The offset from the start of the collection to the first entry in the page. It is zero-based."
                      nextUrl:
                        type: string
                        x-forma-type: string
                        description: "The URL to retrieve the next page of results. If not included, this is the last page of results."
                      totalResults:
                        type: integer
                        x-forma-type: int
                        description: "The total number of results that match the query, regardless of the limit value."
        "400":
          description: "Bad Request"
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context optional"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/packages-list-packages-GET"
  "/construction/rcm/v1/projects/{projectId}/published-versions/{versionId}/linked-files":
    get:
      operationId: rcm-linked-files-GET
      summary: "Linked Files"
      description: "Retrieves metadata and signed download URLs for a published version of a Revit (RVT) cloud model, whether workshared or non-workshared, and any Revit files linked to it."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You can provide the project ID with or without the “b." prefix.

            - Example with prefix: b.563a4c30-e30d-4869-ac02-2a18b6447abe

            - Example without prefix: 563a4c30-e30d-4869-ac02-2a18b6447abe
          schema:
            type: string
            x-forma-type: string
        - name: versionId
          in: path
          required: true
          description: |-
            The URL-encoded version ID (URN) of the published Revit model version for which you want to retrieve linked files.
            When a Cloud Workshared Revit model is published in BIM 360 or Forma, a new version ID is created for each published Revit model version.

            Every time a model is updated and published, it receives a new unique version ID.

            You must provide a version ID to retrieve the linked files for that specific published Revit model version.

            To retrieve the latest (tip) version ID, use GET projects/:project_id/folders/:folder_id/contents. To filter out non-cloud workshared Revit files, use the items:autodesk.bim360:C4RModel filter .

            To retrieve a specific past version, use GET projects/:project_id/items/:item_id/versions.

            For more details about retrieving the version ID, see the Retrieve Signed URLs for Linked RVT Files tutorial.
          schema:
            type: string
            x-forma-type: string
        - name: limit
          in: query
          description: "The maximum number of linked models to return in a single request. Maxium: 600. Default: 600."
          schema:
            type: integer
            x-forma-type: int
        - name: offset
          in: query
          description: |-
            The index at which the endpoint starts returning results. Used for pagination. Default: 0.
            This is a zero-based index (if set to 100, results start from the 101st entry).
          schema:
            type: integer
            x-forma-type: int
        - name: filter
          in: query
          description: |-
            Specifies criteria for filtering the linked files by name or publish status.

            - Filter by file name:

            - Example: filter[name]=StructuralModel_2023.rvt&filter[name]=ArchitecturalModel_2023.rvt

            - Filter by publish status:

            - Published files: filter[publishStatus]=published

            - Unpublished files: filter[publishStatus]=notPublished

            - Both published and unpublished: filter[publishStatus]=published,notPublished
          schema:
            type: object
            x-forma-type: object
        - name: includeHost
          in: query
          description: |-
            Indicates whether to include the signed URL for the host model in the response.
            true (default): the host model’s signed URL is included.

            false: only includes the signed URLs of the linked files.
          schema:
            type: boolean
            x-forma-type: boolean
        - name: x-user-id
          in: header
          description: |-
            The ID of the user on whose behalf the request is made. This header is only required when using two-legged authentication with user impersonation. It is not needed for three-legged authentication.
            By providing this header, the API call is limited to act on behalf of the user specified. The user must have at least download permission to the host model.

            Your application can act on behalf of any user who has been authorized in the SaaS Integrations UI. You can only provide the user’s Autodesk ID (autodeskId) as the value of this header.
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  hostFile:
                    type: object
                    x-forma-type: object
                    description: "Metadata about the host model (the main Revit model that contains linked files). This object is only returned in the response when includeHost is set to true."
                    properties:
                      modelName:
                        type: string
                        x-forma-type: string
                        description: "The name of the host model."
                      signedUrl:
                        type: string
                        x-forma-type: string
                        description: "A temporary URL used to download the host model. Signed URLs are valid for 1 hour."
                      itemId:
                        type: string
                        x-forma-type: string
                        description: "The URN of the host model."
                      versionId:
                        type: string
                        x-forma-type: string
                        description: "The version ID of the host model."
                      size:
                        type: integer
                        x-forma-type: int
                        description: "The file size of the host model in bytes."
                      publishStatus:
                        type: string
                        x-forma-type: "enum:string"
                        description: |-
                          Indicates whether the host model has been published. Possible values:
                          published – The model has been published.

                          notPublished – The model has not been published.
                  linkedFiles:
                    type: object
                    x-forma-type: object
                    description: |-
                      A list of linked Revit (RVT) models associated with the requested published model version.
                      This object contains a list of linked files and pagination details.
                    properties:
                      pagination:
                        type: object
                        x-forma-type: object
                        description: "Contains pagination details, including the number of results, starting offset, and total available results."
                        properties:
                          limit:
                            type: integer
                            x-forma-type: int
                            description: "The number of results returned in this response. This may be lower than the requested limit if fewer results are available."
                          offset:
                            type: integer
                            x-forma-type: int
                            description: "The index of the first result in the response, based on the requested offset value."
                          nextUrl:
                            type: string
                            x-forma-type: string
                            description: "A URL for retrieving the next page of results. If this field is not included, there are no additional pages. A page may be empty but still include a nextUrl, so continue paging until this field is no longer returned."
                          nextOffset:
                            type: integer
                            x-forma-type: int
                            description: "The offset value to use when requesting the next page. This field is useful for clients that build the request URL manually instead of using the nextUrl link."
                          totalResults:
                            type: integer
                            x-forma-type: int
                            description: "The total number of linked files available for the requested published version."
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            modelName:
                              type: string
                              x-forma-type: string
                              description: "The name of the linked model, as referenced within the host model."
                            signedUrl:
                              type: string
                              x-forma-type: string
                              description: "A temporary URL used to download the linked model. Signed URLs are valid for 1 hour."
                            itemId:
                              type: string
                              x-forma-type: string
                              description: "The URN of the linked model."
                            versionId:
                              type: string
                              x-forma-type: string
                              description: "The version ID of the linked model. If the model is unpublished, this field is omitted from the response."
                            publishStatus:
                              type: string
                              x-forma-type: "enum:string"
                              description: |-
                                Indicates whether the linked model has been published. Possible values:
                                published – The model has been published.

                                notPublished – The model has not been published.
                        x-forma-type: "array: object"
                        description: "File information about each linked model. This collection is paginated according to the limit and offset parameters."
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/rcm-linked-files-GET"
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: "APS OAuth2. 엔드포인트마다 x-forma-auth-context 를 확인하세요. \"user context required\" 는 3-legged 토큰이 필요하고, \"user context optional\" 은 2-legged(client_credentials)로도 호출할 수 있습니다."
      flows:
        clientCredentials:
          tokenUrl: "https://developer.api.autodesk.com/authentication/v2/token"
          scopes:
            "data:read": "data:read"
            "data:write": "data:write"
