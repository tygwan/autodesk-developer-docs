            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:write"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        subjectId:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "The ID of the user, role, or company. For example, this corresponds to the id, roleId, or companyId in the response for GET /users/user_id."
                        subjectType:
                          type: string
                          x-forma-type: "enum:string"
                          description: |-
                            The type of subject.
                            Possible values: USER, COMPANY, ROLE
                        actions:
                          type: array
                          items:
                            type: string
                          x-forma-type: "array: string"
                          description: |-
                            Permitted actions for the user, role, or company.
                            The permission action group is different in BIM 360 Document Management and Forma Build Files.

                            - The six permission levels in BIM 360 Document Management correspond to one or more actions:

                            - View Only: VIEW, COLLABORATE

                            - View/Download: VIEW, DOWNLOAD, COLLABORATE

                            - Upload Only: PUBLISH

                            - View/Download+Upload: PUBLISH, VIEW, DOWNLOAD, COLLABORATE

                            - View/Download+Upload+Edit: PUBLISH, VIEW, DOWNLOAD, COLLABORATE, EDIT

                            - Full controller: PUBLISH, VIEW, DOWNLOAD, COLLABORATE, EDIT, CONTROL

                            - The six permission levels in Forma correspond to one or more actions:

                            - View Only: VIEW, COLLABORATE

                            - View/Download: VIEW, DOWNLOAD, COLLABORATE

                            - View/Download+PublishMarkups: VIEW, DOWNLOAD, COLLABORATE, PUBLISH_MARKUP

                            - View/Download+PublishMarkups+Upload: PUBLISH, VIEW, DOWNLOAD, COLLABORATE, PUBLISH_MARKUP

                            - View/Download+PublishMarkups+Upload+Edit: PUBLISH, VIEW, DOWNLOAD, COLLABORATE, PUBLISH_MARKUP, EDIT

                            - Full controller: PUBLISH, VIEW, DOWNLOAD, COLLABORATE, PUBLISH_MARKUP, EDIT, CONTROL

                            See the BIM 360 Help documentation or the Forma Files Help documentation for more details about each permission level.

                            Note that the full set of permissions assigned to the user, role, or company is a combination of actions and inheritActions.
                    x-forma-type: "array: object"
                    description: "The results object."
        "400":
          description: "Bad Request"
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "422":
          description: "Unprocessable Entity"
        "423":
          description: Locked
        "429":
          description: "Too Many Requests"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context optional"
      x-forma-scopes:
        - "data:write"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/document-management-projects-project_id-folders-folder_id-permissionsbatch-create-POST"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                subjectId:
                  type: string
                  format: uuid
                  x-forma-type: "string: UUID"
                  description: |-
                    The ID of the user, role, or company. To verify the subjectId:

                    - For a user, use GET users.

                    - For a role, use GET roles

                    - For a company, use GET companies
                autodeskId:
                  type: string
                  x-forma-type: string
                  description: "The Autodesk ID of the user, role or company."
                subjectType:
                  type: string
                  x-forma-type: "enum:string"
                  description: |-
                    The type of subject.
                    Possible values: USER, COMPANY, ROLE
                actions:
                  type: array
                  items:
                    type: string
                  x-forma-type: "array: string"
                  description: |-
                    Permitted actions for the user, role, or company.
                    The permission action group is different in BIM 360 Document Management and Forma Build Files.

                    - The six permission levels in BIM 360 Document Management correspond to one or more actions:

                    - View Only: VIEW, COLLABORATE

                    - View/Download: VIEW, DOWNLOAD, COLLABORATE

                    - Upload Only: PUBLISH

                    - View/Download+Upload: PUBLISH, VIEW, DOWNLOAD, COLLABORATE

                    - View/Download+Upload+Edit: PUBLISH, VIEW, DOWNLOAD, COLLABORATE, EDIT

                    - Full controller: PUBLISH, VIEW, DOWNLOAD, COLLABORATE, EDIT, CONTROL

                    - The six permission levels in Forma correspond to one or more actions:

                    - View Only: VIEW, COLLABORATE

                    - View/Download: VIEW, DOWNLOAD, COLLABORATE

                    - View/Download+PublishMarkups: VIEW, DOWNLOAD, COLLABORATE, PUBLISH_MARKUP

                    - View/Download+PublishMarkups+Upload: PUBLISH, VIEW, DOWNLOAD, COLLABORATE, PUBLISH_MARKUP

                    - View/Download+PublishMarkups+Upload+Edit: PUBLISH, VIEW, DOWNLOAD, COLLABORATE, PUBLISH_MARKUP, EDIT

                    - Full controller: PUBLISH, VIEW, DOWNLOAD, COLLABORATE, PUBLISH_MARKUP, EDIT, CONTROL

                    See the BIM 360 Help documentation or the Forma Files Help documentation for more details about each permission level.

                    Note that the full set of permissions assigned to the user, role, or company is a combination of actions and inheritActions.
              required:
                - actions
                - subjectId
                - subjectType
