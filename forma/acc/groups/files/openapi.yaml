  "/construction/files/v1/projects/{projectId}/exports/{exportId}":
    get:
      operationId: v1-files-export-status-and-result-GET
      summary: "Retrieves the status of an export job"
      description: "Retrieves the status of an export job. The S3 signed URL (in result.output.signedUrl) will be available for downloading the exported file."
      parameters:
        - name: projectId
          in: path
          required: true
          description: "The ID of the project. Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You can use a project ID either with a “b.” prefix or without a “b.” prefix. For instance, a project ID of “b.a4be0c34a-4ab7” can also be referred to as “a4be0c34a-4ab7”."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: exportId
          in: path
          required: true
          description: "The ID of the export job. The export ID is generated when you initialize an export job using POST exports."
          schema:
            type: string
            x-forma-type: string
        - name: x-user-id
          in: header
          description: |-
            The ID of a user on whose behalf your API request is acting. Required if you’re using a 2-legged authentication context, which must be 2-legged OAuth2 security with user impersonation.
            The app has access to all users specified by the administrator in the SaaS integrations UI. By providing this header, the API call will be limited to act on behalf of only the user specified.

            You can use either the user’s Forma ID (id), or their Autodesk ID (autodeskId).
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The ID of the PDF export job."
                  status:
                    type: string
                    x-forma-type: string
                    description: "The status of the PDF export job."
                  result:
                    type: object
                    x-forma-type: object
                    description: |-
                      The result of a completed export job:

                      - If the exporting job’s status value is successful, the downloadable signed url will be included in the result.output object

                      - If the exporting job’s status value is failed (e.g. the files have been deleted), the result.error object will be present with details.

                      - If the exporting job’s status value is partialSuccess (e.g. when some dwg/rvt files do not contain any exportable views or sheets), the result.output.failedFiles object will be present with file urn and reason.
                    properties:
                      output:
                        type: object
                        x-forma-type: object
                        description: "The output containing the downloadable signed URL."
                        properties:
                          signedUrl:
                            type: string
                            x-forma-type: string
                            description: "The signed URL to download the PDF or ZIP file. Expires in 1 hour."
                          failedFiles:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  x-forma-type: string
                                  description: "The file version URN."
                                reason:
                                  type: string
                                  x-forma-type: string
                                  description: "The reason for failure."
                                detail:
                                  type: string
                                  x-forma-type: string
                                  description: "The detail message for failure"
                            x-forma-type: "array: object"
                            description: "Only for dwg/rvt files."
                      error:
                        type: object
                        x-forma-type: object
                        description: |-
                          The error codes could be<br>

                          - ERR_WORKFLOW_TIMEOUT, when the export job runs more than 30 minutes.<br>

                          - ERR_INTERNAL_SERVER_ERROR, when other internal server error happens.<br>

                          - ERR_NO_PROCESSABLE_FILES, when all dwg/rvt files do not contain any 2d pdf files.<br>

                          - ERR_FILE_TOO_LARGE, when the total size of exported files exceeds the upper limit.
                        properties:
                          code:
                            type: string
                            x-forma-type: string
                            description: "The HTTP code of the error."
                          title:
                            type: string
                            x-forma-type: string
                            description: "The title of the error."
                          detail:
                            type: string
                            x-forma-type: string
                            description: "The detail of the error."
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context optional"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/v1-files-export-status-and-result-GET"
