                          type: string
                          x-forma-type: string
                          description: "Not relevant"
                        value:
                          type: string
                          x-forma-type: string
                          description: "The display name of the status."
                    x-forma-type: "array: object"
                    description: "A list of statuses representing different stages of a submittal item."
                  responses:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "The internal, globally unique identifier (UUID) for the response."
                        key:
                          type: string
                          x-forma-type: string
                          description: "Not relevant"
                        value:
                          type: string
                          x-forma-type: string
                          description: "The content of the response."
                        platformId:
                          type: string
                          x-forma-type: string
                          description: "Not relevant"
                        isActive:
                          type: boolean
                          x-forma-type: boolean
                          description: |-
                            true: if the response was not deleted.
                            false: if the response was deleted.
                        categoryId:
                          type: string
                          x-forma-type: string
                          description: "The type of response. Possible values: 1 (Approved), 2 (Revise and submit), 3 (Rejected)."
                        isApproval:
                          type: boolean
                          x-forma-type: boolean
                          description: |-
                            true: settings this response for a submittal item means an approval.
                            false: settings this response for a submittal item means dis-approval.

                            This attribute is taken from the related categoryId
                        isInUse:
                          type: boolean
                          x-forma-type: boolean
                          description: |-
                            true: if the response is currently associated with a submittal item.
                            false: if the response is not currently associated with a submittal item.
                        createdBy:
                          type: string
                          x-forma-type: string
                          description: "The Autodesk ID of the user who created the response."
                        createdAt:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: "The time and date when the response was created."
                        updatedAt:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: "The time and date when the response was last updated."
                        updatedBy:
                          type: string
                          x-forma-type: string
                          description: "The Autodesk ID of the user who last updated the response."
                    x-forma-type: "array: object"
                    description: "A list of responses.This is the same as calling GET responses"
                  attachmentCategories:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          x-forma-type: string
                          description: "The unique identifier for the attachment category."
                        key:
                          type: string
                          x-forma-type: string
                          description: "Not relevant"
                        value:
                          type: string
                          x-forma-type: string
                          description: "The display name of the attachment category."
                    x-forma-type: "array: object"
                    description: "A list of attachment categories."
                  attachmentTypes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          x-forma-type: string
                          description: "The unique identifier for the attachment type."
                        key:
                          type: string
                          x-forma-type: string
                          description: "Not relevant"
                        value:
                          type: string
                          x-forma-type: string
                          description: "The display name of the attachment type."
                    x-forma-type: "array: object"
                    description: "A list of attachment types."
                  isManagerMappingDefined:
                    type: boolean
                    x-forma-type: boolean
                    description: |-
                      true: if there is at least one manager mapping in the project.
                      false: if there are no manager mappings in the project.
                  noPackagesInProject:
                    type: boolean
                    x-forma-type: boolean
                    description: |-
                      true: if there are no packages in the project.
                      false: if there are packages in the project.
                  noItemsInProject:
                    type: boolean
                    x-forma-type: boolean
                    description: |-
                      true: if there are no submittal items in the project.
                      false: if there are submittal items in the project.
                  responseCategories:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          x-forma-type: string
                          description: "The unique ID for the response category."
                        value:
                          type: string
                          x-forma-type: string
                          description: "The display name of the category as shown in the UI."
                        isApproval:
                          type: boolean
                          x-forma-type: boolean
                          description: |-
                            true: if this option is for an approved submittal response.
                            false: if this option is for other-typed submittal responses.
                    x-forma-type: "array: object"
