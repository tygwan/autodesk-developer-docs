                name:
                  type: string
                  x-forma-type: string
                  description: |-
                    The user-defined name for the attachment. This value does not need to match the actual file name. For example, design-review.pdf or Design Review.

                    - Spaces are allowed in the name.

                    - The following characters are not supported: /, \n, \r, \t, \0, \f, ?, *, \\, <, >, |, :.
                isFileUploaded:
                  type: boolean
                  x-forma-type: boolean
                  description: |-
                    Specifies whether the attachment upload has been completed. This value controls how the system processes the attachment.

                    - true: if the attachment is complete.

                    - false: if the attachment is still in progress.

                    Behavior:

                    - For local file uploads: The system initially considers the file as not uploaded (false). After completing the upload, you must set isFileUploaded: true using PATCH attachments/:id to allow the system to process the attachment.

                    - For Files tool attachments: Always set to true since the file was uploaded earlier.

                    This field cannot be explicitly set to false in the request. If omitted, it defaults to false.
