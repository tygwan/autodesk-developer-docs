                    Note that you can only set category IDs 1-4 when adding an attachment. Category IDs 5-8 are system-generated and appear in responses for historical records.

                    In some cases, you must manually set categoryId:

                    1. Subcontractor Submissions:
                    When a subcontractor creates an item in the Open (Submitted) - (mgr-1) state, set categoryId to 1 (Submission) instead of 2 (For Review).

                    2. Final Response in Non-Standard Closures:
                    When closing an item from a state other than Open (Reviewed) - (mgr-2), set categoryId to 4 (Final Response) if uploading a final response.

