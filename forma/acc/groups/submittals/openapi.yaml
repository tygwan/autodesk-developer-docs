      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:write"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/submittals-items-itemIdtransition-POST"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                customIdentifier:
                  type: string
                  x-forma-type: string
                  description: |-
                    A custom number to assign to the submittal item. Before updating an item, check what the custom numbering type is for the current project by calling GET metadata to get the custom identifier sequence type.
                    Submittals support two custom numbering types:

                    - Global Numbering: The custom identifier only contains the sequential number.

                    - Spec Section Numbering: When the project uses spec section numbering for custom numbering, ensure that only the sequential number part of the custom identifier is sent in the request, excluding the spec ID.

                    To find the next available custom number in the sequence, call GET items:next-custom-identifier.

                    To verify whether the custom number has not been used and is in a supported format, call POST items:validate-custom-identifier.

                    For more information on custom numbering, see the Help documentation.
                typeId:
                  type: string
                  format: uuid
                  x-forma-type: "string: UUID"
                  description: "The ID of the item type to assign to the submittal item. To retrieve the type ID, call GET item-types or GET item-types/:id."
                specId:
                  type: string
                  format: uuid
                  x-forma-type: "string: UUID"
                  description: "The unique identifier (UUID) of the spec section to assign to the submittal item, which can be obtained by calling GET specs."
                subsection:
                  type: string
                  x-forma-type: string
                  description: "Define the subsection details of the submittal item. For example, 1.05-B."
                title:
                  type: string
                  x-forma-type: string
                  description: "The title of the submittal item defined by the user when updating the submittal item."
                description:
                  type: string
                  x-forma-type: string
                  description: "A description of the submittal item to add context about its purpose."
                priority:
                  type: string
                  x-forma-type: "enum:string"
                  description: |-
                    The priority level of the submittal item.
                    Possible values:

                    - Low

                    - Normal

                    - High

                    When the priority is not set, the default value is Normal.
                manager:
                  type: string
                  x-forma-type: string
                  description: |-
                    The Autodesk ID (autodeskId) or Group ID (memberGroupId) specifying the manager to assign to the submittal item. The manager could be a user, role, or a company. Note that the user must be defined as a manager in the project. You can verify this by calling GET mappings.
                    To get the possible values for a manager, call GET mappings and check the autodeskId. This returns a list of all the users, roles, and companies that are managers in the project. Call GET projects/users to verify the actual name of the user. If a copmany is a manager, call GET companies to verify the actual name of the company. Note that we do not currently support verifying names of roles.
                managerType:
                  type: string
                  x-forma-type: "enum:string"
                  description: |-
                    The type of manager. This attribute is required when a manager is specified. To determine the type of manager, call GET mappings and check the user type.
                    Possible values: 1 (user), 2 (company), 3 (role).
                subcontractor:
                  type: string
                  x-forma-type: string
                  description: |-
                    The Autodesk ID of the subcontractor to assign to the submittal item. When updating a submittal item as a manager in the UI, you will see ‘assign to responsible contractor’. The subcontractor can be a user (autodeskId), role (memberGroupId), or company (memberGroupId).
                    For users, call GET users.
                    For companies, call GET companies.

                    Note that we do not currently support finding details about roles for a project.
                subcontractorType:
                  type: string
                  x-forma-type: "enum:string"
                  description: |-
                    The type of subcontractor. This attribute is required when a subcontrator is specified.
                    Possible values: 1 (user), 2 (company), 3 (role).
                sentToSubmitter:
                  type: string
                  format: date-time
                  x-forma-type: "datetime: ISO 8601"
                  description: "The date and time when the submittal was sent to the subcontrator for review, formatted as YYYY-MM-DDTHH:mm:ss.SSSSSSZ (ISO 8601) in UTC. For example, 2018-02-15T12:09:24.198466Z."
                receivedFromSubmitter:
                  type: string
                  format: date-time
                  x-forma-type: "datetime: ISO 8601"
                  description: "The date and time when the submittal was received back from the subcontractor after review, formatted as YYYY-MM-DDTHH:mm:ss.SSSSSSZ (ISO 8601) in UTC. For example, 2018-02-15T12:09:24.198466Z."
                sentToReview:
                  type: string
                  format: date-time
                  x-forma-type: "datetime: ISO 8601"
                  description: "The date and time when the submittal item was transitioned to the rev state (Open - In review), formatted as YYYY-MM-DDTHH:mm:ss.SSSSSSZ (ISO 8601) in UTC. For example, 2018-02-15T12:09:24.198466Z."
                receivedFromReview:
                  type: string
                  format: date-time
                  x-forma-type: "datetime: ISO 8601"
                  description: "The timestamp marking when the item transitioned from the rev state (Open - In Review) to the mgr-2 state (close and distribute), formatted as YYYY-MM-DDTHH:mm:ss.SSSSSSZ (ISO 8601) in UTC. For example, 2018-02-15T12:09:24.198466Z."
                publishedDate:
                  type: string
                  format: date-time
                  x-forma-type: "datetime: ISO 8601"
                  description: "The date when the manager closed and distributed the submittal item, formatted as YYYY-MM-DDTHH:mm:ss.SSSSSSZ (ISO 8601) in UTC. For example, 2018-02-15T12:09:24.198466Z."
                watchers:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        x-forma-type: string
                        description: |-
                          The Autodesk ID of the watcher. The watcher can be a user (autodeskId), role (memberGroupId), or company (memberGroupId).
                          To find details about users, call GET users, to find details about companies, call GET companies. Note that we do not currently support finding details about roles for a project.
                      userType:
                        type: object
                        x-forma-type: object
                        description: |-
                          The type of watcher assigned to the submittal item.
                          Possible values:

                          - 1 (user)

                          - 2 (company)

                          - 3 (role)
                    required:
                      - id
                      - userType
                  x-forma-type: "array: object"
                  description: "A list of project watchers, who can be individual users, roles, or companies."
                requiredOnJobDate:
                  type: string
                  x-forma-type: string
                  description: "The date when the materials are expected to arrive on the site, in the following format: YYYY-MM-DD (ISO 8601) in UTC. For example, 2018-02-15."
                leadTime:
                  type: integer
                  x-forma-type: int
                  description: "The duration (in days) from the approval of the submittal to the delivery of materials or products to the construction site."
                requiredDate:
                  type: string
                  x-forma-type: string
                  description: "The date the responsible contractor needs to submit the submittal to the submittal manager, in the following format: YYYY-MM-DD (ISO 8601) in UTC. For example, 2018-02-15."
                requiredApprovalDate:
                  type: string
                  x-forma-type: string
                  description: "The date by which approval for the submittal is required, in the following format: YYYY-MM-DD in UTC (ISO 8601). For example, 2018-02-15."
                submitterDueDate:
                  type: string
                  x-forma-type: string
                  description: "The date by which the subcontractor is expected to submit the submittal to the manager, formatted as YYYY-MM-DD in UTC (ISO 8601). For example, 2018-02-15."
                managerDueDate:
                  type: string
                  x-forma-type: string
                  description: "The date by which the manager is expected to prepare the submittal item for review to the reviewer, in the following format: YYYY-MM-DD in UTC (ISO 8601). For example, 2018-02-15."
                packageId:
                  type: string
                  format: uuid
                  x-forma-type: "string: UUID"
                  description: |-
                    The ID of the package associated with the submittal item. This attribute is optional and is used for workflows involving attachments.
                    To retrieve package details, call GET packages.
                stateId:
                  type: string
                  x-forma-type: "enum:string"
                  description: |-
                    Specifies the target state to which the submittal item will transition according to the user’s permitted actions. To determine available transitions, call GET Item/:id and check the permittedActions field.
                    Note that submittal items cannot be transitioned to a draft - (Draft) state, only from a draft - (Draft) state to another state.

                    To transition a submittal item to a rev - (Open - In Review) state, the associated template must include predefined steps and tasks, and a custom identifier must already be set. See the Create Submittal Items tutorial (step 6) for more details.

                    Possible values:

                    sbc-1 (Waiting for Submission) – Assigned to the Responsible Contractor, who needs to submit the submittal to the Manager.

                    mgr-1 (Open - Submitted) – Assigned to the Manager, who needs to prepare it for review.

                    rev (Open - In Review) – Under review by the reviewers defined in the submittal workflow.

                    mgr-2 (Open - Reviewed) – The review is complete, and the submittal is returned to the Manager, who needs to set the final response and close the submittal.

                    sbc-2 (Closed) – The submittal has been closed and assigned to the Responsible Contractor.

                    void (Voided): The item has been voided.
                mailNote:
                  type: string
                  x-forma-type: string
                  description: "A note (comment) that is used in transition and will be sent in email and appear in the activity log."
                stepDueDate:
                  type: string
                  x-forma-type: string
                  description: |-
                    The due date for the next Step in ISO 8601, in the following format YYYY-MM-DD in UTC. For example, 2024-02-15.
                    This is relevant only when transitioning to a rev state (equivalent to Open (In review) in the UI).
                responseId:
                  type: string
                  x-forma-type: string
                  description: |-
                    The ID of the response associated with the transition, linking to the specific feedback or action taken. This is relevant only when transitioning to the sbc-2 state (equivalent to Closed in the UI).
                    To find the response ID, call GET Responses.
                responseComment:
                  type: string
                  x-forma-type: string
                  description: "The body of the response comment, containing feedback or instructions related to the transition. This is relevant only when transitioning to the sbc-2 state (equivalent to Close and Distribute in the UI)."
                saveAttachmentDrafts:
                  type: array
                  items:
                    type: string
                  x-forma-type: "array: string"
                  description: "Not relevant"
                duplicateAttachments:
                  type: array
                  items:
                    type: string
                  x-forma-type: "array: string"
                  description: "A list of attachment IDs to duplicate from a submittal item’s previous stage in the workflow. To retrieve available attachments, call GET items/:itemId/attachments."
              required:
                - stateId
  "/construction/submittals/v2/projects/{projectId}/items/{itemId}/attachments/{attachmentId}":
    patch:
      operationId: submittals-attachments-attachmentId-PATCH
      summary: "Updates the upload status of an attachment associated with a submittal item"
      description: "Updates the upload status of an attachment associated with a submittal item. Use this endpoint after completing the file upload to update the attachment status. Note, this endpoint applies to the local files workflow only and is not used for Files tool attachments."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You need to convert the project ID into a project ID for the Forma API by removing the “b." prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7.
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: itemId
          in: path
          required: true
          description: "The ID of the submittal item. To find the item ID, call GET items."
          schema:
            type: string
            x-forma-type: string
        - name: attachmentId
          in: path
          required: true
          description: "The ID of the attachment. To find the ID, call GET attachments."
          schema:
            type: string
            x-forma-type: string
        - name: Content-Type
          in: header
          required: true
          description: "Must be application/json"
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:write"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The internal, globally unique identifier (UUID) for the attachment."
                  itemId:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The ID of the submittal item associated with the attachment."
                  taskId:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: |-
                      The ID of the task within the review step to which the attachment is associated.
                      - If the attachment was added to a review step, this field contains the task ID that identifies the relevant task.
                      - If the attachment was not part of a review, this field is null.
                  name:
                    type: string
                    x-forma-type: string
                    description: "The user-defined name of the attachment. This value is specified when the attachment is created and may differ from the original file name."
                  isFileUploaded:
                    type: boolean
                    x-forma-type: boolean
                    description: |-
                      Indicates whether the attachment upload is complete.

                      true: the attachment upload is complete.

                      false: the upload is still in progress or pending completion.
                  url:
                    type: string
                    x-forma-type: string
                    description: "Not relevant"
                  asyncState:
                    type: string
                    x-forma-type: "enum:string"
                    description: |-
                      Represents the state of the asynchronous process triggered after marking the file upload as complete (isFileUploaded=true). The backend initiates this process to generate the URN for the attachment.
                      Possible values:

                      - 1 - Pending (the request is queued and awaiting processing).

                      - 2 - Started (the backend process to generate the URN has begun).

                      - 3 - Success (the URN was successfully created).

                      - 4 - Failure (the process failed, and the URN was not created).
