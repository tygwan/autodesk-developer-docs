openapi: "3.1.0"
info:
  title: "Forma APIs — Submittals"
  version: v1
  description: |-
    Forma APIs — Submittals.
    Autodesk 문서에서 자동 추출됨. 원본: https://aps.autodesk.com/en/docs/acc/v1
    공통 base 경로: /construction/submittals/v2/projects
    **리전 — 호출 전 반드시 확인** 리전은 완전히 분리되어 있고 리소스 식별자가 호환되지 않습니다. ⚠️ **헤더 이름이 그룹마다 다릅니다.** Hub Admin 은 `Region`, Issues 는 `x-ads-region` 입니다. 이 문서의 "헤더" 표에 적힌 이름을 그대로 쓰세요. 통일해서 보내면 안 됩니다. 미지정 시 자동 라우팅되며 지연이 늘 수 있습니다. 자세한 판정은 `_errata` E-003 참고.
servers:
  - url: "https://developer.api.autodesk.com"
x-forma-group: Submittals
x-forma-common-base: "/construction/submittals/v2/projects"
paths:
  "/construction/submittals/v2/projects/{projectId}/async-jobs/{asyncJobId}":
    get:
      operationId: submittals-async-jobs-asyncJobId-GET
      summary: "Retrieves the current status and result of an asynchronous job"
      description: "Retrieves the current status and result of an asynchronous job. Poll this endpoint after triggering an operation that runs asynchronously, until the job reaches a terminal state (Success (3) or Failure (4))."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You need to convert the project ID into a project ID for the Forma API by removing the “b." prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7.
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: asyncJobId
          in: path
          required: true
          description: "The ID of the async job. This ID is returned in the response of any endpoint that triggers an asynchronous operation. For example, POST custom-identifier:change-sequence-type."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The unique identifier (UUID) of the async job."
                  createdAt:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "The date and time when the async job was created, formatted as YYYY-MM-DDTHH:mm:ss.SSSSSSZ (ISO 8601) in UTC. For example, 2018-02-15T12:09:24.198466Z."
                  updatedAt:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "The time and date when the async job was last updated, formatted as YYYY-MM-DDTHH:mm:ss.SSSSSSZ (ISO 8601) in UTC. For example, 2018-02-15T12:09:24.198466Z."
                  startedAt:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "The time and date when the async job execution started, formatted as YYYY-MM-DDTHH:mm:ss.SSSSSSZ (ISO 8601) in UTC. For example, 2018-02-15T12:09:24.198466Z."
                  asyncState:
                    type: string
                    x-forma-type: "enum:string"
                    description: "The current state of the asynchronous job. Possible values: Pending (1), Started (2), Success (3), Failure (4)."
                  resultsPayload:
                    type: object
                    x-forma-type: object
                    description: |-
                      Final response payload of the asynchronous job.
                      Contains error details when asyncState is Failure.
                      When asyncState is Success, the response may or may not include data, depending on the job type.
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/submittals-async-jobs-asyncJobId-GET"
  "/construction/submittals/v2/projects/{projectId}/item-types/{id}":
    get:
      operationId: submittals-item-types-id-GET
      summary: "Retrieve the information about a single submittal type"
      description: "Retrieve the information about a single submittal type. For more information about submittal types, see the Help documnentation."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You need to convert the project ID into a project ID for the Forma API by removing the “b." prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7.
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: id
          in: path
          required: true
          description: "The ID of the submittal item to retrieve revisions for. To obtain this ID, call GET items."
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The internal, globally unique identifier (UUID) for the item type."
                  key:
                    type: string
                    x-forma-type: string
                    description: "Not relevant"
                  value:
                    type: string
                    x-forma-type: string
                    description: "The name of the submittal item type."
                  platformId:
                    type: string
                    x-forma-type: string
                    description: "Not relevant"
                  isActive:
                    type: boolean
                    x-forma-type: boolean
                    description: |-
                      true: (default) if the submittal item type has not been deleted.
                      false: if the submittal item type has been deleted.
                  isInUse:
                    type: boolean
                    x-forma-type: boolean
                    description: |-
                      true: if the submittal item type is currently associated with a submittal item.
                      false: if the submittal item type is not currently associated with a submittal item.
                  createdBy:
                    type: string
                    x-forma-type: string
                    description: "The Autodesk ID of the user who created the submittal item type."
                  createdAt:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "The date and time when the submittal item type was originally created."
                  updatedAt:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "The date and time when the submittal item type was last updated."
                  updatedBy:
                    type: string
                    x-forma-type: string
                    description: "The Autodesk ID of the user who last updated the submittal item type."
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/submittals-item-types-id-GET"
  "/construction/submittals/v2/projects/{projectId}/item-types":
    get:
      operationId: submittals-item-types-GET
      summary: "Retrieves all submittal itme types for the specified project"
      description: "Retrieves all submittal itme types for the specified project. Submittal item types categorize the various submittal items submitted for review and approval in a construction project. Examples of submittal item types could be Attic Stock or Sample."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You need to convert the project ID into a project ID for the Forma API by removing the “b." prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7.
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: limit
          in: query
          description: "The maximum number of results per page. Possible values: 1- 50. Default value: 20. For example, to limit the response to two results per page, use limit=2."
          schema:
            type: integer
            x-forma-type: int
        - name: offset
          in: query
          description: "The number of results to skip before starting to return data. For example, to skip the first 20 results, include offset=20 in the query string. For more details, see the JSON API Paging Help documentation."
          schema:
            type: integer
            x-forma-type: int
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  pagination:
                    type: object
                    x-forma-type: object
                    description: "Describes pagination details for the response, including information about the current page and navigation to other pages."
                    properties:
                      limit:
                        type: integer
                        x-forma-type: int
                        description: "The maximum number of results to be displayed on each page."
                      offset:
                        type: integer
                        x-forma-type: int
                        description: "The number of results skipped before starting the current page."
                      totalResults:
                        type: integer
                        x-forma-type: int
                        description: "The overall count of results available across all pages."
                      previousUrl:
                        type: string
                        x-forma-type: string
                        description: "The URL to retrieve the preceding page of results, if applicable. Not returned on the first page of results."
                      nextUrl:
                        type: string
                        x-forma-type: string
                        description: "The URL to retrieve the subsequent page of results, if available. If not included, this is the last page of data."
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "The internal, globally unique identifier (UUID) for the item type."
                        key:
                          type: string
                          x-forma-type: string
                          description: "Not relevant"
                        value:
                          type: string
                          x-forma-type: string
                          description: "The name of the submittal item type."
                        platformId:
                          type: string
                          x-forma-type: string
                          description: "Not relevant"
                        isActive:
                          type: boolean
                          x-forma-type: boolean
                          description: |-
                            true: (default) if the submittal item type has not been deleted.
                            false: if the submittal item type has been deleted.
                        isInUse:
                          type: boolean
                          x-forma-type: boolean
                          description: |-
                            true: if the submittal item type is currently associated with a submittal item.
                            false: if the submittal item type is not currently associated with a submittal item.
                        createdBy:
                          type: string
                          x-forma-type: string
                          description: "The Autodesk ID of the user who created the submittal item type."
                        createdAt:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: "The date and time when the submittal item type was originally created."
                        updatedAt:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: "The date and time when the submittal item type was last updated."
                        updatedBy:
                          type: string
                          x-forma-type: string
                          description: "The Autodesk ID of the user who last updated the submittal item type."
                    x-forma-type: "array: object"
                    description: "The list of submittal types."
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/submittals-item-types-GET"
  "/construction/submittals/v2/projects/{projectId}/items:next-custom-identifier":
    get:
      operationId: submittals-itemsnext-custom-identifier-GET
      summary: "Retrieves the next available custom identifier for a submittal item in a project"
      description: "Retrieves the next available custom identifier for a submittal item in a project. The identifier is generated based on specific rules:"
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You need to convert the project ID into a project ID for the Forma API by removing the “b." prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7.
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: specId
          in: query
          description: |-
            The item spec ID. This parameter is only required when the project is in spec sequence type (as opposed to global sequence).
            To verify the sequence type, call GET metadata, and check customIdentifierSequenceType.

            To get the spec ID, call GET specs, and select the relevant ID (id).
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  previousCustomIdentifier:
                    type: string
                    x-forma-type: string
                    description: "The last created custom identifier."
                  nextCustomIdentifier:
                    type: string
                    x-forma-type: string
                    description: "The next available custom identifier for the project."
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/submittals-itemsnext-custom-identifier-GET"
  "/construction/submittals/v2/projects/{projectId}/items:validate-custom-identifier":
    post:
      operationId: submittals-itemsvalidate-custom-identifier-POST
      summary: "Validates a custom identifier for a submittal item in a project"
      description: "Validates a custom identifier for a submittal item in a project. It ensures the identifier is not currently in use and adheres to the required formatting rules. Use this endpoint to validate a custom identifier you intend to use."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You need to convert the project ID into a project ID for the Forma API by removing the “b." prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7.
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: specId
          in: query
          description: |-
            The item spec ID. This parameter is only required when the project is in spec sequence type (as opposed to global sequence).
            To verify the sequence type, call GET metadata, and check customIdentifierSequenceType.

            To get the spec ID call GET specs, and select the relevant ID (id).
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: Content-Type
          in: header
          required: true
          description: "Must be application/json"
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:read"
      responses:
        "204":
          description: "No Content"
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "409":
          description: Conflict
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/submittals-itemsvalidate-custom-identifier-POST"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                customIdentifier:
                  type: string
                  x-forma-type: string
                  description: |-
                    The customIdentifier is used to ensure that the chosen identifier adheres to format rules and is unique within the project. Submittal managers can assign custom numbers manually or automatically.
                    When validating a custom identifier, consider the following rules:

                    - Ensure the identifier is unique within the project.

                    - For global sequences, ensure it is unique within the entire project.

                    - For spec sequences, ensure it is unique within the specific spec section.

                    - Spec sequence is in the format <spec_identifier>-<sequential_number>. You only need to specify the sequential number. The full number - <spec_identifier>-<sequential_number> - appears in the response payload in the customIdentifierHumanReadable attribute.

                    Regardless of whether the project uses a global or spec sequence, you should always provide only the sequential number portion without the spec ID when sending the customIdentifier.

                    For more information on custom numbering, see the Help documentation.
              required:
                - customIdentifier
  "/construction/submittals/v2/projects/{projectId}/items/:itemId:transition":
    post:
      operationId: submittals-items-itemIdtransition-POST
      summary: Items
      description: "Transitions a submittal item to a specified state in the submittal workflow, allowing it to progress according to the defined process. This transition is determined based on its current state and the permitted actions, such as moving an item from Draft to Submitted or from In Review to Closed."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You need to convert the project ID into a project ID for the Forma API by removing the “b." prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7.
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: itemId
          in: path
          required: true
          description: "The ID of the submittal item. To find the item ID, call GET items."
          schema:
            type: string
            x-forma-type: string
        - name: Content-Type
          in: header
          required: true
          description: "Must be application/json"
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:write"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The internal, globally unique identifier (UUID) for the submittal item."
                  identifier:
                    type: integer
                    x-forma-type: int
                    description: "The unique ID assigned to the submittal item within the UI. This ID is system-generated and serves as a reference for users interacting with submittal items through the UI. For example, 111."
                  customIdentifier:
                    type: string
                    x-forma-type: string
                    description: |-
                      customIdentifier and customIdentifierHumanReadable relate to the Number column in the UI. Submittal managers assign custom numbers to items (manually or automatically). Custom numbers are configured either in global numbering format: <global number>, or in spec section numbering format: <spec ID>-<sequential number>.
                      For projects with a global numbering format, both customIdentifier and customIdentifierHumanReadable represent the global number.

                      For projects with a spec section numbering format (<spec ID>-<sequential number>), customIdentifier represents the sequential number. For example, for a full number of 033100-01, customIdentifier is 01.

                      Note that for unnumbered items customIdentifier is null.

                      For more information on custom numbering, see the Help documentation.
                  customIdentifierHumanReadable:
                    type: string
                    x-forma-type: string
                    description: |-
                      customIdentifierHumanReadable and customIdentifier relate to the Number column in the UI. Submittal managers assign custom numbers to items (manually or automatically). Custom numbers are configured either in global numbering format: <global number>, or in spec section numbering format: <spec ID>-<sequential number>.
                      For projects with a global numbering format, both customIdentifier and customIdentifierHumanReadable represent the global number.

                      For projects with a spec section numbering format (<spec ID>-<sequential number>), customIdentifierHumanReadable represents the full number - both the spec ID and the sequential number. For example, for a full number of 033100-01, customIdentifierHumanReadable is 033100-01.

                      Note that for unnumbered items customIdentifierHumanReadable is Unspecified. For spec section numbering it also includes the spec ID. For example, 033100-Unspecified.

                      For more information on custom numbering, see the Help documentation.
                  typeId:
                    type: string
                    x-forma-type: string
                    description: "The ID representing the type of submittal item."
                  specId:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The unique identifier (UUID) of the spec assigned to the submittal item."
                  specIdentifier:
                    type: string
                    x-forma-type: string
                    description: "The identifier of the spec section that is associated with the submittal item. The identifier is assigned to the spec section in the UI."
                  specTitle:
                    type: string
                    x-forma-type: string
                    description: "The title of the spec associated with the submittal item."
                  subsection:
                    type: string
                    x-forma-type: string
                    description: "The sub-spec section associated with the submittal item, providing additional categorization within the main spec."
                  title:
                    type: string
                    x-forma-type: string
                    description: "The title of the submittal item."
                  description:
                    type: string
                    x-forma-type: string
                    description: "The description of the submittal item."
                  priority:
                    type: string
                    x-forma-type: "enum:string"
                    description: |-
                      The priority of the submittal item.
                      Possible values:

                      - Low

                      - Normal

                      - High
                  revision:
                    type: integer
                    x-forma-type: int
                    description: "The revision number of the submittal item, indicating the version of the item in the submittal workflow. For example, 1 for the initial submission or 2 for the first revision."
                  stateId:
                    type: string
                    x-forma-type: "enum:string"
                    description: |-
                      The current state of the submittal item after the transition.
                      Possible values:

                      sbc-1 (Waiting for Submission) - Assigned to the Responsible Contractor, who needs to submit the submittal to the Manager.

                      mgr-1 (Open - Submitted) - Assigned to the Manager, who needs to prepare the submittal item for review.

                      rev (Open - In Review) - Under review by the reviewers defined in the submittal item’s review workflow.

                      mgr-2 (Open - Reviewed) - The review is complete, and the submittal is returned to the Manager, who needs to set the final response and close the submittal.

                      sbc-2: (Closed) - The submittal has been closed and assigned to the Responsible Contractor.

                      void (Voided) - The submittal item has been voided.

                      draft (Draft) - Assigned to the Manager, who must send the submittal item to the Responsible Contractor.
                  statusId:
                    type: string
                    x-forma-type: "enum:string"
                    description: |-
                      The status of the submittal item.
                      Possible values: 1 - (Required), 2 - (Open), 3 - (Closed), 4 - (Void), 5 - (Empty), 6 - (Draft).

                      To retrieve the full list of possible statuses, call GET metadata.
                  ballInCourtUsers:
                    type: array
                    items:
                      type: string
                    x-forma-type: "array: string"
                    description: "The Autodesk IDs of users who are currently assigned to the submittal item at this stage of the workflow."
                  ballInCourtCompanies:
                    type: array
                    items:
                      type: string
                    x-forma-type: "array: string"
                    description: "The member group IDs of the companies currently assigned to the submittal item at this stage of the workflow."
                  ballInCourtRoles:
                    type: array
                    items:
                      type: string
                    x-forma-type: "array: string"
                    description: "The member group IDs of user roles that are currently assigned to the submittal item at this stage of the workflow."
                  ballInCourtType:
                    type: string
                    x-forma-type: "enum:string"
                    description: |-
                      ‘The type of submittal role assigned to the user currently assigned to the submittal item.
                      Possible values: reviewer, manager, subcontractor.’
                  manager:
                    type: string
                    x-forma-type: string
                    description: |-
                      The ID that was assigned to the manager of the submittal item.
                      To determine the type of the manager (user, role, or company), refer to the manager type (managerType) attribute.
                      In order to get more info about the manager, use:

                      - GET projects/users to verify the actual name of the user in case the typs is a user (1).

                      - GET companies to determine the name of the company in case the typs is a company (2).

                      Note that we do not currently support verifying names of roles.
                  managerType:
                    type: string
                    x-forma-type: "enum:string"
                    description: |-
                      The type of manager associated with the submittal item.
