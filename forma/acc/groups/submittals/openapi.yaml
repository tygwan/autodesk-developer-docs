  "/construction/submittals/v2/projects/{projectId}/users/me":
    get:
      operationId: submittals-users-me-GET
      summary: "Retrieves the Autodesk ID, assigned roles, and permitted actions for the current user within a specified project"
      description: "Retrieves the Autodesk ID, assigned roles, and permitted actions for the current user within a specified project."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You need to convert the project ID into a project ID for the Forma API by removing the “b." prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7.
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  id:
                    type: string
                    x-forma-type: string
                    description: "The AutodeskId for the current user."
                  roles:
                    type: array
                    items:
                      type: string
                    x-forma-type: "array: string"
                    description: "The roles assigned to the user in Submittals. Possible values: 1 - Manager, 2 - User, 4 - Admin"
                  permittedActions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          x-forma-type: string
                          description: "ID of the action in the format type_of_object::action. For example, item::create, Spec::create."
                        fields:
                          type: object
                          x-forma-type: object
                          description: |-
                            A mapping of field names to lists of possible values for each field, specific to the associated action. An empty array indicates that there is no specific set of values for those fields.
                            For example, in the action Spec::create, fields might contain mapping for title (title) and identifier (identifier).
                        mandatoryFields:
                          type: array
                          items:
                            type: string
                          x-forma-type: "array: string"
                          description: |-
                            A subset of fields (fields) that are required to perform specific actions, such as creating or transitioning a submittal item. The required fields depend on the user’s role and the action.
                            For example, creating a submittal item in the mgr-1 state as a manager or in the sbc-1 state as a subcontractor requires different fields. For example, [stateId, specId, title, typeId, manager, managerType].
                        transitions:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                x-forma-type: string
                                description: "The ID of the transition in the format from-state::to-state. Possible values: create::mgr-1, create::sbc-1."
                              name:
                                type: string
                                x-forma-type: string
                                description: "The descriptive name of the transition. Possible values: Create, Send to Manager, Send to void."
                              stateFrom:
                                type: object
                                x-forma-type: object
                                description: "The starting state of the transition."
                                properties:
                                  id:
                                    type: string
                                    x-forma-type: string
                                    description: "The unique ID of the starting state. Possible values: create, mgr-1, sbc-1. A rev (review), refers to the state where a submittal item is undergoing revisions or is being reviewed."
                                  name:
                                    type: string
                                    x-forma-type: string
                                    description: "The name of the starting state. Possible values: Create, Manager Review, Review."
                              stateTo:
                                type: object
                                x-forma-type: object
                                description: "The target state of the transition."
                                properties:
                                  id:
                                    type: string
                                    x-forma-type: string
                                    description: "The unique ID of the target state. For example, mgr-1, mgr-2, void."
                                  name:
                                    type: string
                                    x-forma-type: string
                                    description: "The name of the target state. For example, Manager Review, Manager Final Review, Void."
                              transitionFields:
                                type: array
                                items:
                                  type: string
                                x-forma-type: "array: string"
                                description: "Fields that are used in the transition. For example, [subcontractor, subcontractorType, watchers, responseId]."
                              mandatoryFields:
                                type: array
                                items:
                                  type: string
                                x-forma-type: "array: string"
                                description: "A list of required fields for the transition. For example, [responseId]."
                              actionId:
                                type: string
                                x-forma-type: string
                                description: "Not relevant"
                          x-forma-type: "array: object"
                          description: "list of possible transitions"
                    x-forma-type: "array: object"
                    description: "A list of actions that the user is allowed to perform"
