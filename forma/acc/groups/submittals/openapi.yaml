          schema:
            type: string
            x-forma-type: string
        - name: search
          in: query
          description: "Search for items by querying a specified string within specific fields (identifier, title, specIdentifier, ballInCourt), and retrieve the associated items that match the search criteria. This includes items where the string matches part of a field. For example, search=1."
          schema:
