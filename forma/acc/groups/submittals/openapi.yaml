    patch:
      operationId: submittals-items-itemId-PATCH
      summary: "Updates specific attributes of an existing submittal item"
      description: "Updates specific attributes of an existing submittal item. Only fields listed in the permittedActions object can be modified."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You need to convert the project ID into a project ID for the Forma API by removing the “b." prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7.
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: itemId
          in: path
          required: true
          description: "The ID of the submittal item. To find the item ID, call GET items."
          schema:
            type: string
            x-forma-type: string
        - name: Content-Type
          in: header
          required: true
          description: "Must be application/json"
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:write"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The internal, globally unique identifier (UUID) for the submittal item."
                  identifier:
                    type: integer
                    x-forma-type: int
                    description: "The unique ID assigned to the submittal item within the UI. This ID is system-generated and serves as a reference for users interacting with submittal items through the UI. For example, 111."
                  customIdentifier:
                    type: string
                    x-forma-type: string
                    description: |-
                      customIdentifier and customIdentifierHumanReadable relate to the Number column in the UI. Submittal managers assign custom numbers to items (manually or automatically). Custom numbers are configured either in global numbering format: <global number>, or in spec section numbering format: <spec ID>-<sequential number>.
                      For projects with a global numbering format, both customIdentifier and customIdentifierHumanReadable represent the global number.

                      For projects with a spec section numbering format (<spec ID>-<sequential number>), customIdentifier represents the sequential number. For example, for a full number of 033100-01, customIdentifier is 01.

                      Note that for unnumbered items customIdentifier is null.

                      For more information on custom numbering, see the Help documentation.
                  customIdentifierHumanReadable:
                    type: string
                    x-forma-type: string
                    description: |-
                      customIdentifierHumanReadable and customIdentifier relate to the Number column in the UI. Submittal managers assign custom numbers to items (manually or automatically). Custom numbers are configured either in global numbering format: <global number>, or in spec section numbering format: <spec ID>-<sequential number>.
                      For projects with a global numbering format, both customIdentifier and customIdentifierHumanReadable represent the global number.

                      For projects with a spec section numbering format (<spec ID>-<sequential number>), customIdentifierHumanReadable represents the full number - both the spec ID and the sequential number. For example, for a full number of 033100-01, customIdentifierHumanReadable is 033100-01.

                      Note that for unnumbered items customIdentifierHumanReadable is Unspecified. For spec section numbering it also includes the spec ID. For example, 033100-Unspecified.

                      For more information on custom numbering, see the Help documentation.
                  typeId:
                    type: string
                    x-forma-type: string
                    description: "The ID representing the type of submittal item."
                  specId:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The unique identifier (UUID) of the spec assigned to the submittal item."
                  specIdentifier:
                    type: string
                    x-forma-type: string
                    description: "The identifier of the spec section that is associated with the submittal item. The identifier is assigned to the spec section in the UI."
                  specTitle:
                    type: string
                    x-forma-type: string
                    description: "The title of the spec associated with the submittal item."
                  subsection:
                    type: string
                    x-forma-type: string
                    description: "The sub-spec section associated with the submittal item, providing additional categorization within the main spec."
                  title:
                    type: string
                    x-forma-type: string
                    description: "The title of the submittal item."
                  description:
                    type: string
                    x-forma-type: string
                    description: "The description of the submittal item."
                  priority:
                    type: string
                    x-forma-type: "enum:string"
                    description: |-
                      The priority of the submittal item.
                      Possible values:

                      - Low

