                    description: "The Autodesk ID of the user who submitted the submittal item. This is the user who transitioned the item to the manager."
                  managerDueDate:
                    type: string
                    x-forma-type: string
                    description: "The date by which the manager is expected to prepare the submittal item for review, formatted as YYYY-MM-DD in UTC (ISO 8601). For example, 2018-02-15. This corresponds to the mgr-1 state Open (Submitted)."
                  sentToReview:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "The date and time when the submittal item transitioned to the rev state (Open - In review), formatted as YYYY-MM-DDTHH:mm:ss.SSSSSSZ (ISO 8601) in UTC. For example, 2018-02-15T12:09:24.198466Z."
                  sentToReviewBy:
                    type: string
                    x-forma-type: string
                    description: "The Autodesk ID of the user who transitioned the item to the rev state (Open - In review)."
                  receivedFromReview:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "The date and time when the submittal item transitioned from the rev state (Open - In Review) to the mgr-2 state (Close and distribute), formatted as YYYY-MM-DD (ISO 8601) in UTC. For example, 2022-03-02T12:09:24Z."
                  publishedDate:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "The date when the manager closed and distributed the submittal item, in the following format: YYYY-MM-DD (ISO 8601) in UTC. For example, 2018-02-15."
                  publishedBy:
                    type: string
                    x-forma-type: string
                    description: "The Autodesk ID of the user who published the submittal item."
                  responseId:
                    type: string
                    x-forma-type: string
                    description: "The ID of the response associated with the submittal item, linking to the specific feedback or action taken."
                  responseComment:
                    type: string
                    x-forma-type: string
                    description: "The body of the response comment, containing feedback or instructions related to the submittal item."
                  respondedAt:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "The date and time when the response was added, formatted as YYYY-MM-DDTHH:mm:ss.SSSSSSZ (ISO 8601) in UTC. For example, 2018-02-15T12:09:24.198466Z."
                  respondedBy:
                    type: string
                    x-forma-type: string
                    description: "The Autodesk ID of the user that gave the response to the submittal item."
                  packageId:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The ID of the package associated with the submittal item."
                  packageIdentifier:
                    type: string
                    x-forma-type: string
                    description: "The package identifier as displayed in the UI."
                  packageTitle:
                    type: string
                    x-forma-type: string
                    description: "The title of the package associated with the submittal item."
                  packageSpecIdentifier:
                    type: string
                    x-forma-type: string
                    description: "The identifier of the submittal spec associated with the package. This value corresponds to the “Spec section” displayed in the UI, such as 1 - Cement."
                  folderUrn:
                    type: string
                    x-forma-type: string
                    description: "The URN of the folder that contains the attachments associated with the submittal items."
                  revisionsFoldersUrns:
                    type: object
                    x-forma-type: object
                    description: "An object containing URNs that represent folders associated with the revisions of the submittal item. These URNs can be used to access and identify specific folders related to submittal item revisions within the system."
                  createdAt:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "The date and time when the submittal item was originally created, formatted as YYYY-MM-DDTHH:mm:ss.SSSSSSZ (ISO 8601) in UTC. For example, 2018-02-15T12:09:24.198466Z."
                  createdBy:
                    type: string
                    x-forma-type: string
                    description: "The Autodesk ID of the user who created the submittal item."
                  updatedAt:
                    type: string
                    format: date-time
                    x-forma-type: "datetime: ISO 8601"
                    description: "The time and date when the submittal item was last updated, formatted as YYYY-MM-DDTHH:mm:ss.SSSSSSZ (ISO 8601) in UTC. For example, 2018-02-15T12:09:24.198466Z."
                  updatedBy:
                    type: string
                    x-forma-type: string
                    description: "The Autodesk ID of the user who last updated the submittal item."
                  permittedActions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          x-forma-type: string
                          description: "The ID of the action in the format type_of_object::action. For example, Item::retrieve."
                        fields:
                          type: object
                          x-forma-type: object
                          description: "A list of field names for which values must be provided when performing the action. An empty array indicates no specific set of values."
                        mandatoryFields:
                          type: array
                          items:
                            type: string
                          x-forma-type: "array: string"
                          description: |-
                            Lists the fields that are required when updating a submittal item.
                            The required fields depend on the action being performed, the item’s current state, and the user’s role.

                            For example:

                            To transition the state of a submittal item, stateId and responseId are required.
                            To reassign the manager, manager and managerType are required.
                            To modify the spec section, specId is required.
                        transitions:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                x-forma-type: string
                                description: "The ID of the transition in the format from-state::to-state. For example, create::mgr-1, mgr-1::mgr-2, rev::void."
                              name:
                                type: string
                                x-forma-type: string
                                description: "The descriptive name of the transition. For example, Create, Send to Manager, Send to void."
                              stateFrom:
                                type: object
                                x-forma-type: object
                                description: "The starting state of the transition, representing the current position of the submittal item in the workflow."
                                properties:
                                  id:
                                    type: string
                                    x-forma-type: string
                                    description: "The unique ID of the starting state. For example, create, mgr-1, rev. The rev state indicates that the submittal item is currently under review."
                                  name:
                                    type: string
                                    x-forma-type: string
                                    description: "The name of the starting state. For example, Create, Manager Review, Review."
                              stateTo:
                                type: object
                                x-forma-type: object
                                description: "The target state of the transition, indicating the next position of the submittal item in the workflow."
                                properties:
                                  id:
                                    type: string
                                    x-forma-type: string
                                    description: "The unique ID of the target state. For example, mgr-1, mgr-2, void."
                                  name:
                                    type: string
                                    x-forma-type: string
                                    description: "The name of the target state. For example, Manager Review, Manager Final Review, Void."
                              transitionFields:
                                type: array
                                items:
                                  type: string
                                x-forma-type: "array: string"
                                description: "Fields that are used in the transition. For example, [subcontractor, subcontractorType, watchers, responseId]."
                              mandatoryFields:
                                type: array
                                items:
                                  type: string
                                x-forma-type: "array: string"
                                description: "A list of required fields for the transition. For example, [responseId]."
                              actionId:
                                type: string
                                x-forma-type: string
                                description: "Not relevant"
                          x-forma-type: "array: object"
                          description: "The list of possible state transitions for a submittal item within the review workflow."
                    x-forma-type: "array: object"
                    description: "The list of actions the user is allowed to perform on the submittal item."
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:write"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/submittals-items-POST"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                customIdentifier:
                  type: string
                  x-forma-type: string
                  description: |-
                    A custom number to assign to the submittal item. Before creating an item, check what the custom numbering type is for the current project by calling GET metadata to get the custom identifier sequence type.
                    Submittals support two custom numbering types:

                    - Global Numbering: The custom identifier only contains the sequential number.

                    - Spec Section Numbering: When the project uses spec section numbering for custom numbering, ensure that only the sequential number part of the custom identifier is sent in the request, excluding the spec ID.

                    To find the next available custom number in the sequence, call GET items:next-custom-identifier.

                    To verify whether the custom number has not been used and is in a supported format, call POST items:validate-custom-identifier.

                    For more information on custom numbering, see the Help documentation.
                typeId:
                  type: string
                  x-forma-type: string
                  description: "The UUID of the item type to assign to the submittal item, which can be obtained by calling GET item-types or GET item-types/:id."
                specId:
                  type: string
                  format: uuid
                  x-forma-type: "string: UUID"
                  description: "The UUID of the spec section to assign to the submittal item."
                subsection:
                  type: string
                  x-forma-type: string
                  description: "Define the subsection details of the submittal item. For example, 1.05-B."
                title:
                  type: string
                  x-forma-type: string
                  description: "The title of the submittal item defined by the user when creating the submittal item."
                description:
                  type: string
                  x-forma-type: string
                  description: "A description of the submittal item to add context about its purpose."
                priority:
                  type: string
                  x-forma-type: "enum:string"
                  description: |-
                    The priority level of the submittal item. Possible values: Low, Normal, High.
                    When the priority is not set, the default value is Normal.
                stateId:
                  type: string
                  x-forma-type: "enum:string"
                  description: |-
                    The initial state of the submittal item, which depends on the role and permitted actions of the user.
                    Possible values: draft, sbc-1, mgr-1.

                    The required fields depend on the selected state ID. For example, if the state is mgr-1, required fields include subcontractor (subcontractor), subcontractor type (subcontractorType), and submitter due date (submitterDueDate). If the state is sbc-1, required fields include manager (manager) and manager type (manager-type).

                    The required fields for creating the submittal item depend on the input stateId. The different states will require different mandatory fields. Refer Step 1: Verify User Permissions in the Create a Submittal Item tutorial for details.
                manager:
                  type: string
                  x-forma-type: string
                  description: |-
                    The Autodesk ID (autodeskId) or Group ID (memberGroupId) specifying the manager to assign to the submittal item. The manager could be a user, role, or a company. Note that the user must be defined as a manager in the project. You can verify this by calling GET mappings.
                    To get the possible values for a manager, call GET mappings and check the autodeskId. This returns a list of all the users, roles, and companies that are managers in the project. Call GET projects/users to verify the actual name of the user. If a company is a manager, call GET companies to verify the actual name of the company. Note that we do not currently support verifying names of roles.
                managerType:
                  type: string
                  x-forma-type: "enum:string"
                  description: |-
                    The type of manager. This attribute is required when a manager is specified. To determine the type of manager, call GET mappings and check the user type.
                    Possible values: 1 (user), 2 (company), 3 (role).
                subcontractor:
                  type: string
                  x-forma-type: string
                  description: |-
                    The Autodesk ID of the subcontractor to assign to the submittal item. When creating a submittal item as a manager in the UI, you will see ‘assign to responsible contractor’.
                    Get the subcontractor ID using:

                    - GET projects/users to verify the actual name of the user in case the typs is a user (1).

                    - GET companies to determine the name of the company in case the typs is a company (2).

                    Note that we do not currently support verifying names of roles.
                subcontractorType:
                  type: string
                  x-forma-type: "enum:string"
                  description: |-
                    The type of subcontractor. This attribute is required when a subcontractor is specified.
                    Possible values: 1 (user), 2 (company), 3 (role).
                watchers:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        x-forma-type: string
                        description: |-
                          The Autodesk ID of the watcher. The watcher can be a user (autodeskId), role (memberGroupId), or company (memberGroupId).
                          To find details about users, call GET users, to find details about companies, call GET companies. Note that we do not currently support finding details about roles for a project.
                      userType:
                        type: object
                        x-forma-type: object
                        description: |-
                          The type of watcher assigned to the submittal item.
                          Possible values:

                          - 1 (user)

                          - 2 (company)

                          - 3 (role)
                    required:
                      - id
                      - userType
                  x-forma-type: "array: object"
                  description: "A list of project watchers, who can be individual users, roles, or companies."
                requiredOnJobDate:
                  type: string
                  x-forma-type: string
                  description: "The date when the materials are expected to arrive on the site, in the following format: YYYY-MM-DD (ISO 8601) in UTC. For example, 2018-02-15."
                leadTime:
                  type: integer
                  x-forma-type: int
                  description: "The duration in days from the approval of the submittal to the delivery of materials or products to the construction site."
                requiredDate:
                  type: string
                  x-forma-type: string
                  description: "The date the responsible contractor needs to submit the submittal to the submittal manager, in the following format: YYYY-MM-DD (ISO 8601) in UTC. For example, 2018-02-15."
                requiredApprovalDate:
                  type: string
                  x-forma-type: string
                  description: "The date by which approval for the submittal is required, in the following format: YYYY-MM-DD in UTC (ISO 8601). For example, 2018-02-15."
                submitterDueDate:
                  type: string
                  x-forma-type: string
                  description: "The date by which the subcontractor is expected to submit the submittal to the manager, in the following format: YYYY-MM-DD in UTC (ISO 8601). For example, 2018-02-15. This corresponds to the sbc-1 state Waiting for submission."
                managerDueDate:
                  type: string
                  x-forma-type: string
                  description: "The date by which the manager is expected to prepare the submittal item for review to the reviewer, in the following format: YYYY-MM-DD in UTC (ISO 8601). For example, 2018-02-15. This corresponds to the mgr-1 state Open (Submitted)."
                packageId:
                  type: string
                  format: uuid
                  x-forma-type: "string: UUID"
                  description: |-
                    The ID of the package associated with the submittal item.
                    To retrieve a list of packages and their corresponding IDs, call GET packages.
                templateId:
                  type: string
                  format: uuid
                  x-forma-type: "string: UUID"
                  description: "The ID of a review template used to apply predefined steps and tasks when creating a submittal item. Templates must be created in the UI or retrieved by calling GET templates."
              required:
                - specId
                - stateId
                - title
                - typeId
  "/construction/submittals/v2/projects/{projectId}/metadata":
    get:
      operationId: submittals-metadata-GET
      summary: "Retrieves project metadata and static values needed for creating submittal items and translating retrieved data"
      description: "Retrieves project metadata and static values needed for creating submittal items and translating retrieved data."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You need to convert the project ID into a project ID for the Forma API by removing the “b." prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7.
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The unique identifier (UUID) for the metadata object."
                  submittalRoles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          x-forma-type: string
                          description: "The unique identifier for the submittal role."
                        key:
                          type: string
                          x-forma-type: string
                          description: "Not relevant"
                        value:
                          type: string
                          x-forma-type: string
                          description: "The display name of the submittal role."
                    x-forma-type: "array: object"
                    description: "A list of submittal roles within the project."
                  attachmentUrnTypes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          x-forma-type: string
                          description: "The unique identifier for the attachment URN type."
                        key:
                          type: string
                          x-forma-type: string
                          description: "Not relevant"
                        value:
                          type: string
                          x-forma-type: string
                          description: "The display name of the attachment URN type."
                    x-forma-type: "array: object"
                    description: "A list of attachment URN types."
                  itemTypes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "The internal, globally unique identifier (UUID) for the item type."
                        key:
                          type: string
                          x-forma-type: string
                          description: "Not relevant"
                        value:
                          type: string
                          x-forma-type: string
                          description: "The name of the submittal item type."
                        platformId:
                          type: string
                          x-forma-type: string
                          description: "Not relevant"
                        isActive:
                          type: boolean
                          x-forma-type: boolean
                          description: |-
                            true: (default) if the submittal item type has not been deleted.
                            false: if the submittal item type has been deleted.
                        isInUse:
                          type: boolean
                          x-forma-type: boolean
                          description: |-
                            true: if the submittal item type is currently associated with a submittal item.
                            false: if the submittal item type is not currently associated with a submittal item.
                        createdBy:
                          type: string
                          x-forma-type: string
                          description: "The Autodesk ID of the user who created the submittal item type."
                        createdAt:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: "The date and time when the submittal item type was originally created."
                        updatedAt:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: "The date and time when the submittal item type was last updated."
                        updatedBy:
                          type: string
                          x-forma-type: string
                          description: "The Autodesk ID of the user who last updated the submittal item type."
                    x-forma-type: "array: object"
                    description: "A list of submittal item types. This is the same as calling GET item-types"
                  adminMappingsSubmittalRoles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          x-forma-type: string
                          description: "The unique identifier for the submittal role."
                        key:
                          type: string
                          x-forma-type: string
                          description: "Not relevant"
                        value:
                          type: string
                          x-forma-type: string
                          description: "The display name of the submittal role."
                    x-forma-type: "array: object"
                    description: "A list of admin mappings for submittal roles."
                  userTypes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          x-forma-type: string
                          description: "The unique identifier for the user type."
                        key:
                          type: string
                          x-forma-type: string
                          description: "Not relevant"
                        value:
                          type: string
                          x-forma-type: string
                          description: "The display name of the user type."
                    x-forma-type: "array: object"
                    description: "Types of users, such as individual users, companies, and roles."
                  statuses:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          x-forma-type: string
                          description: "The unique identifier for the status."
