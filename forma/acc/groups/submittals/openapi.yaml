                    - 2: For Review – Submitted and awaiting review.

                    - 3: Review Response – A response provided during review.

                    - 4: Final Response – The final response in the submittal workflow.

                    To retrieve the list of available category ID values, call GET metadata and refer to the attachment categories list in the response.
