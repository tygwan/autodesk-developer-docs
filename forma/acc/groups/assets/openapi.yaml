openapi: "3.1.0"
info:
  title: "Forma APIs — Assets"
  version: v1
  description: |-
    Forma APIs — Assets.
    Autodesk 문서에서 자동 추출됨. 원본: https://aps.autodesk.com/en/docs/acc/v1
    공통 base 경로: /construction/assets
    **리전 — 호출 전 반드시 확인** 리전은 완전히 분리되어 있고 리소스 식별자가 호환되지 않습니다. ⚠️ **헤더 이름이 그룹마다 다릅니다.** Hub Admin 은 `Region`, Issues 는 `x-ads-region` 입니다. 이 문서의 "헤더" 표에 적힌 이름을 그대로 쓰세요. 통일해서 보내면 안 됩니다. 미지정 시 자동 라우팅되며 지연이 늘 수 있습니다. 자세한 판정은 `_errata` E-003 참고.
servers:
  - url: "https://developer.api.autodesk.com"
x-forma-group: Assets
x-forma-common-base: "/construction/assets"
paths:
  "/construction/assets/v1/error-codes/{errorCodeName}":
    get:
      operationId: assets-error-codes-error-code-name-GET
      summary: "Retrieves details about an error code by name"
      description: "Retrieves details about an error code by name."
      parameters:
        - name: errorCodeName
          in: path
          required: true
          description: "The name of an error code returned in an error response, in the errorCode field."
          schema:
            type: string
            x-forma-type: string
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  name:
                    type: string
                    x-forma-type: string
                    description: "The error code name."
                  description:
                    type: string
                    x-forma-type: string
                    description: "A description of the error."
                  httpStatusCode:
                    type: number
                    x-forma-type: number
                    description: |-
                      The HTTP status code typically returned when this error occurs.
                      Note that there may be exceptions, for example, if an internal server error
                      occurs the status code associated with this error may be different.
                  metadataKeys:
                    type: array
                    items:
                      type: string
                    x-forma-type: "array: string"
                    description: "The metadata keys relevant to the error code."
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "429":
          description: "Too Many Requests"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "no security required"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/assets-error-codes-error-code-name-GET"
  "/construction/assets/v1/error-codes":
    get:
      operationId: assets-error-codes-GET
      summary: "Retrieves a list of all error codes returned by the Assets API"
      description: "Retrieves a list of all error codes returned by the Assets API."
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  pagination:
                    type: object
                    x-forma-type: object
                    description: "The pagination object."
                    properties:
                      limit:
                        type: integer
                        x-forma-type: int
                        description: "Always equal to totalResults (Pagination is not used by this endpoint. This object is returned for backward compatibility.)."
                      offset:
                        type: integer
                        x-forma-type: int
                        description: "Always equal to 0 (Pagination is not used by this endpoint. This object is returned for backward compatibility.)."
                      totalResults:
                        type: integer
                        x-forma-type: int
                        description: "The total number of results returned."
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          x-forma-type: string
                          description: "The error code name."
                        description:
                          type: string
                          x-forma-type: string
                          description: "A description of the error."
                        httpStatusCode:
                          type: number
                          x-forma-type: number
                          description: |-
                            The HTTP status code typically returned when this error occurs.
                            Note that there may be exceptions, for example, if an internal server error
                            occurs the status code associated with this error may be different.
                        metadataKeys:
                          type: array
                          items:
                            type: string
                          x-forma-type: "array: string"
                          description: "The metadata keys relevant to the error code."
                    x-forma-type: "array: object"
                    description: "A list of Assets API errors."
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "429":
          description: "Too Many Requests"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "no security required"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/assets-error-codes-GET"
  "/construction/assets/v1/projects/{projectId}/asset-statuses:batch-get":
    post:
      operationId: assets-asset-statuses-batch-get-POST
      summary: "Returns a specified set of statuses"
      description: "Returns a specified set of statuses."
      parameters:
        - name: projectId
          in: path
          required: true
          description: "The Forma project ID. Must be a UUID or a project ID of the form “b.{UUID}”."
          schema:
            type: string
            x-forma-type: string
        - name: includeDeleted
          in: query
          description: "Whether or not soft-deleted object should be included in the response. If true, soft-deleted objects are returned. If false, they are not. The default is false."
          schema:
            type: boolean
            x-forma-type: boolean
        - name: Content-Type
          in: header
          required: true
          description: "Must be application/json"
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        label:
                          type: string
                          x-forma-type: string
                          description: |-
                            The display label of the status. This label appears in the Assets UI when viewing statuses. The label must
                            be unique within this status set, but does not need to be unique within the project (in other words, the
                            same label can be used in multiple status sets in the same project). “Uniqueness” in this context means
                            case-insensitive.
                        description:
                          type: string
                          x-forma-type: string
                          description: "A description of the status."
                        color:
                          type: string
                          x-forma-type: string
                          description: |-
                            The color of the status as the status appears in the Assets UI.
                            This field is not restricted as it is primarily a tool for the Assets UI to use.

                            However, there are only certain colors that the Forma Assets UI knows how to
                            operate with. Understood color values are: adsk-black, adsk-white, adsk-charcoal-900,
                            adsk-charcoal-800, adsk-charcoal-700, adsk-charcoal-600, adsk-charcoal-500,
                            adsk-charcoal-400, adsk-charcoal-300, adsk-charcoal-200, adsk-charcoal-100,
                            adsk-charcoal-050, adsk-blue-700, adsk-blue-500, adsk-blue-300, adsk-blue-100,
                            adsk-red-700, adsk-red-500, adsk-red-300, adsk-green-700, adsk-green-500,
                            adsk-green-300, adsk-yellow-orange-700, adsk-yellow-orange-500, adsk-yellow-orange-300,
                            adsk-dark-blue-700, adsk-dark-blue-500, adsk-dark-blue-300, adsk-pink-700,
                            adsk-pink-500, adsk-pink-300, adsk-turquoise-700, adsk-turquoise-500,
                            adsk-turquoise-300, adsk-purple-700, adsk-purple-500, adsk-purple-300,
                            adsk-salmon-700, adsk-salmon-500, adsk-salmon-300, adsk-brown-700, adsk-brown-500,
                            adsk-brown-300.

                            Using colors other than those specified here is not disallowed, but may result in unexpected behavior in

                            the Assets UI.
                        statusStepSetId:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "The ID of the status set to which the new status belongs."
                        id:
                          type: string
                          x-forma-type: string
                          description: "The ID of the component."
                        createdAt:
                          type: string
                          x-forma-type: string
                          description: "The time when the component was created (ISO8601 Date time format in UTC)."
                        createdBy:
                          type: string
                          x-forma-type: string
                          description: "The actor that created the component. This is an Autodesk / Oxygen ID."
                        updatedAt:
                          type: string
                          x-forma-type: string
                          description: "The time when the component was last updated (ISO8601 Date time format in UTC)."
                        updatedBy:
                          type: string
                          x-forma-type: string
                          description: "The actor that last updated the component. This is an Autodesk / Oxygen ID."
                        deletedAt:
                          type: string
                          x-forma-type: string
                          description: "The time when the component was deleted at (ISO8601 Date time format in UTC)."
                        deletedBy:
                          type: string
                          x-forma-type: string
                          description: "The actor that deleted the component. This is an Autodesk / Oxygen ID."
                        isActive:
                          type: boolean
                          x-forma-type: boolean
                          description: "A flag indicating whether the component is active or inactive (isActive is true if-and-only-if deletedAt is empty)."
                        version:
                          type: integer
                          x-forma-type: int
                          description: "A global sequence number that is incremented any time a component of this type is created, updated, or deleted. If you cache components, you can use the version value to compare the cached component to the same component online to see if the component has been updated. If the online component has a higher version value, it has been updated."
                        projectId:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "The Forma project ID. Must be a UUID or a project ID of the form “b.{UUID}”."
                        bucket:
                          type: string
                          x-forma-type: string
                          description: |-
                            An immutable string assigned to a status on its creation, typically created by incorporating the
                            status’s label into a larger string that is guaranteed to be unique within a project. The bucket name
                            remains the same for the life of the status, and doesn’t change even if the label does. The bucket value
                            is a useful tool for semantic identification.
                        sortOrder:
                          type: integer
                          x-forma-type: int
                          description: |-
                            A value that indicates the order of a status within its status set. Each status in the set has a sort
                            order value that indicates its order relative to other statuses in the set. A status set’s sort order
                            values don’t necessarily start at 1, and may not be sequential. The only way to know a status’s order
                            within a set is to compare its sort order value with the sort order values of other statuses.
                    x-forma-type: "array: object"
                    description: "Returned statuses"
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "429":
          description: "Too Many Requests"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/assets-asset-statuses-batch-get-POST"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  x-forma-type: "array: string"
                  description: "Unique IDs of entities to fetch"
