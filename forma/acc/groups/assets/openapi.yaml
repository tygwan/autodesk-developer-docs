    get:
      operationId: assets-categories-GET
      summary: "Searches for and returns all specified categories"
      description: "Searches for and returns all specified categories."
      parameters:
        - name: projectId
          in: path
          required: true
          description: "The Forma project ID. Must be a UUID or a project ID of the form “b.{UUID}”."
          schema:
            type: string
            x-forma-type: string
        - name: "filter[isActive]"
          in: query
          description: |-
            Specifies whether or not to return categories that are active. If true, return only active categories. If
            false, return only inactive categories. Default is to return both active and inactive categories, to ensure
            full tree structure is returned (conversely, full tree structure is not guaranteed when filtering active or
            inactive categories).
            Note that this behavior is different than that of the includeDeleted flag other endpoints use.
          schema:
            type: boolean
            x-forma-type: boolean
        - name: "filter[parentId]"
          in: query
          description: |-
            Specifies the parent category ID of returned categories. The query returns only categories that are direct
            child categories of the specified category.
          schema:
            type: string
            x-forma-type: string
        - name: "filter[maxDepth]"
          in: query
          description: |-
            Specifies the depth of the category tree to return, starting with the root category. Depth 0 means to return
            only the root category. Depth 4, for example, means to return only the root category and categories that are
            four levels of inheritance deep, but not to return categories that are five or more levels deep.
            Note that this can be used in conjunction with filter[parentId], but that the depth is still computed from
            the root category, not the parent category specified by the filter.
          schema:
            type: number
            x-forma-type: number
        - name: "filter[updatedAt]"
          in: query
          description: |-
            A string that specifies a date and time or a date and time range at which all returned objects mast have been
            updated. A single date and time takes this format: YYYY-MM-DDThh:mm:ss.SSSZ, A date and time range takes this
            format: YYYY-MM-DDThh:mm:ss.SSSZ..YYYY-MM-DDThh:mm:ss.SSSZ. Range queries can be closed or open in either
            direction: YYYY-MM-DDThh:mm:ss.SSSZ.. or ..YYYY-MM-DDThh:mm:ss.SSSZ.
          schema:
            type: string
            x-forma-type: string
