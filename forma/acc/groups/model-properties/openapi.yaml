      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                diffs:
                  type: array
                  items:
                    type: object
                    properties:
                      prevVersionUrn:
                        type: string
                        x-forma-type: string
                        description: "file version urn."
                      curVersionUrn:
                        type: string
                        x-forma-type: string
                        description: "file version urn."
                      query:
                        type: object
                        x-forma-type: object
                        description: "SQL AST for binary expression/filter"
                      columns:
                        type: object
                        x-forma-type: object
                        description: "SQL AST for describing columns/projections"
                    required:
                      - curVersionUrn
                      - prevVersionUrn
                  x-forma-type: "array: object"
                  description: |-
                    diffs.
                    Min items: 1 Max items: 1000
              required:
                - diffs
