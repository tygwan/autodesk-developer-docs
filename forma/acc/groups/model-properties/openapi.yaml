  "/construction/index/v2/projects/{projectId}/diffs/{diffId}/queries/{queryId}":
    get:
      operationId: index-v2-diff-query-job-status-get
      summary: "Depending on the state different properties might be present or missing"
      description: "Depending on the state different properties might be present or missing. E.g., if the diff job is not finished yet, the results link might be missing, but the retryAt property will be present. If the processing failed for some reason, the errors property will contain some information. Once the final result of the diff job has been determined (either finished or failed), the status is assumed to be immutable and the response will set a long expiration HTTP header for efficient client side caching."
      parameters:
        - name: projectId
          in: path
          required: true
          description: "The project ID."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: diffId
          in: path
