        - name: projectId
          in: path
          required: true
          description: "The project ID."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: indexId
          in: path
          required: true
          description: "The index ID."
          schema:
            type: string
            x-forma-type: string
        - name: queryId
          in: path
          required: true
          description: "The query ID."
          schema:
            type: string
            x-forma-type: string
