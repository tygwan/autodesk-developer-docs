openapi: "3.1.0"
info:
  title: "Forma APIs — Model Properties"
  version: v1
  description: |-
    Forma APIs — Model Properties.
    Autodesk 문서에서 자동 추출됨. 원본: https://aps.autodesk.com/en/docs/acc/v1
    공통 base 경로: /construction/index/v2/projects
    **리전 — 호출 전 반드시 확인** 리전은 완전히 분리되어 있고 리소스 식별자가 호환되지 않습니다. ⚠️ **헤더 이름이 그룹마다 다릅니다.** Hub Admin 은 `Region`, Issues 는 `x-ads-region` 입니다. 이 문서의 "헤더" 표에 적힌 이름을 그대로 쓰세요. 통일해서 보내면 안 됩니다. 미지정 시 자동 라우팅되며 지연이 늘 수 있습니다. 자세한 판정은 `_errata` E-003 참고.
servers:
  - url: "https://developer.api.autodesk.com"
x-forma-group: "Model Properties"
x-forma-common-base: "/construction/index/v2/projects"
paths:
  "/construction/index/v2/projects/{projectId}/diffs:batch-status":
    post:
      operationId: index-v2-diff-jobs-batch-status-post
      summary: "Retrieve the job status for several jobs in a single request"
      description: "Retrieve the job status for several jobs in a single request."
      parameters:
        - name: projectId
          in: path
          required: true
          description: "The project ID."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: Content-Type
          in: header
          required: true
          description: "Must be application/json."
          schema:
            type: string
            x-forma-type: string
        - name: x-ads-force-regenerate-cache
          in: header
          description: "If set to true, force regeneration of S3 cache."
          schema:
            type: boolean
            x-forma-type: boolean
        - name: x-ads-region
          in: header
          description: |-
            The region to which your request should be routed. If not set, the request is routed automatically but may incur a small latency increase.
            Possible values: US, EMEA. For the full list of supported regions, see the Regions page.
          schema:
            x-forma-type: "enum: string"
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  diffs:
                    type: array
                    items:
                      type: object
                      properties:
                        projectId:
                          type: string
                          x-forma-type: string
                          description: "project id."
                        diffId:
                          type: string
                          x-forma-type: string
                          description: "diff id."
                        queryId:
                          type: string
                          x-forma-type: string
                          description: "query id."
                        type:
                          x-forma-type: "enum: string"
                          description: |-
                            type.
                            Possible values: DIFF
                        state:
                          x-forma-type: "enum: string"
                          description: |-
                            job status.
                            Possible values: PROCESSING, FINISHED, FAILED
                        selfUrl:
                          type: string
                          x-forma-type: string
                          description: "unique url for this job status."
                        prevVersionUrns:
                          type: array
                          items:
                            type: string
                          x-forma-type: "array: string"
                          description: "The previous file versions used in this index."
                        curVersionUrns:
                          type: array
                          items:
                            type: string
                          x-forma-type: "array: string"
                          description: "The current file versions used in this index."
                        updatedAt:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: timestamp.
                        retryAt:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: timestamp.
                        stats:
                          type: object
                          x-forma-type: object
                          description: "some higher level diff statistics."
                          properties:
                            added:
                              type: integer
                              x-forma-type: int
                              description: "number of objects added."
                            removed:
                              type: integer
                              x-forma-type: int
                              description: "number of objects removed."
                            modified:
                              type: integer
                              x-forma-type: int
                              description: "number of objects modified."
                        manifestUrl:
                          type: string
                          x-forma-type: string
                          description: "url for downloading the diff manifest."
                        fieldsUrl:
                          type: string
                          x-forma-type: string
                          description: "url for downloading the diff fields."
                        propertiesUrl:
                          type: string
                          x-forma-type: string
                          description: "url for downloading the diff properties."
                        queryResultsUrl:
                          type: string
                          x-forma-type: string
                          description: "url for downloading the query result."
                        errors:
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                x-forma-type: string
                                description: "The error code."
                              title:
                                type: string
                                x-forma-type: string
                                description: "A short title for the error."
                              detail:
                                type: string
                                x-forma-type: string
                                description: "A more detailed, human readable description of the error, assuming that this message is not localized and is therefore EN-US. UI consumers can use the error.type value to provide a localized version of this error for presentation."
                              errors:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    field:
                                      type: string
                                      x-forma-type: string
                                      description: "The field which failed validation."
                                    title:
                                      type: string
                                      x-forma-type: string
                                      description: "A short title for the error."
                                    detail:
                                      type: string
                                      x-forma-type: string
                                      description: "A more detailed, human readable description of the error, assuming that this message is not localized and is therefore EN-US. UI consumers can use the error.type value to provide a localized version of this error for presentation."
                                    type:
                                      type: string
                                      x-forma-type: string
                                      description: "The error code."
                                x-forma-type: "array: object"
                                description: "A set of specific validation errors that need to be fixed."
                          x-forma-type: "array: object"
                          description: errors.
                    x-forma-type: "array: object"
                    description: diffs.
        "401":
          description: Unauthorized
          content:
