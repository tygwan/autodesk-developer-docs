            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  x-forma-type: "string: UUID"
                  description: "Unique identifier for the RFI. This is system-generated and should not be included when creating a new RFI unless the client needs to set the RFI ID in advance."
                status:
                  type: string
                  x-forma-type: "enum:string"
                  description: |-
                    The current status of the RFI. Available values depend on the RFI’s workflow type:

                    - For single-reviewer workflows (US):

                    Possible values:
                    draft, submitted, open, answered, rejected, closed, void.

                    - For multi-reviewer workflows (EMEA):

                    Possible values:
                    draft, submitted, openRev1 (manager), openRev2 (reviewers), answeredRev1, answeredManager, closed, void.

                    To determine the workflow type, call GET users/me and check the workflowType value.

                    For details on RFI workflows in the Forma UI, see About RFI Workflows – Autodesk Help.
                title:
                  type: string
                  x-forma-type: string
                  description: "The title of the RFI."
                question:
                  x-forma-type: "string,null"
                  description: "The RFI question."
                suggestedAnswer:
                  type: string
                  x-forma-type: string
                  description: "The suggested answer for the RFI."
                assignedTo:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        x-forma-type: string
