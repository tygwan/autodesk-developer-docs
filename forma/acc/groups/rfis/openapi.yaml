                    To retrieve the default value configured for this field, call GET rfi-types.
                locations:
                  type: array
                  items:
                    type: string
                  x-forma-type: "array: string"
                  description: "A list of predefined location IDs associated with the RFI, based on the project’s Location Breakdown Structure (LBS). To get more information about the locations, call GET nodes."
                dueDate:
                  x-forma-type: "string,null"
                  description: "The timestamp of the due date for the RFI, in the following format: YYYY-MM-DDThh:mm:ss.sz."
                costImpact:
                  x-forma-type: "string,null"
                  description: |-
                    The default cost impact value for new RFIs of this type.
                    Possible values: null, Yes, No, Unknown.

