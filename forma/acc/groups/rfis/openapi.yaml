  "/construction/rfis/v3/projects/{projectId}/workflow":
    get:
      operationId: rfis-workflow-GET
      summary: Workflows
      description: "Retrieves the workflow configuration for a given project, including the workflow type, description, and the mapping between project roles and their permitted assignees."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You need to convert the project ID into a project ID for the Forma API by removing the “b." prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7.
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  workflowType:
                    type: string
                    x-forma-type: "enum:string"
                    description: "The region type of the workflow. Possible values: US, EU."
                  description:
                    type: string
                    x-forma-type: string
                    description: "A description of the workflow"
                  projectRolesMapping:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          x-forma-type: string
                          description: "The name of the project role"
                        permittedAssignees:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                x-forma-type: string
                                description: |-
                                  The Autodesk ID of the user, company, or role.
                                  To find details about users, call GET users, to find details about companies, call GET companies.

                                  Note that we do not currently support finding details about roles for a project.
                              type:
                                type: string
                                x-forma-type: "enum:string"
                                description: "The type of assignee. Possible values: user, company, role."
                          x-forma-type: "array: object"
                          description: "A list of users, companies, or roles that can be assigned to this project role."
                    x-forma-type: "array: object"
                    description: "A list of project roles and their corresponding permitted assignees."
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/rfis-workflow-GET"
