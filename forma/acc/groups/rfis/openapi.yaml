openapi: "3.1.0"
info:
  title: "Forma APIs — RFIs"
  version: v1
  description: |-
    Forma APIs — RFIs.
    Autodesk 문서에서 자동 추출됨. 원본: https://aps.autodesk.com/en/docs/acc/v1
    공통 base 경로: /construction/rfis/v3/projects
    **리전 — 호출 전 반드시 확인** 리전은 완전히 분리되어 있고 리소스 식별자가 호환되지 않습니다. ⚠️ **헤더 이름이 그룹마다 다릅니다.** Hub Admin 은 `Region`, Issues 는 `x-ads-region` 입니다. 이 문서의 "헤더" 표에 적힌 이름을 그대로 쓰세요. 통일해서 보내면 안 됩니다. 미지정 시 자동 라우팅되며 지연이 늘 수 있습니다. 자세한 판정은 `_errata` E-003 참고.
servers:
  - url: "https://developer.api.autodesk.com"
x-forma-group: RFIs
x-forma-common-base: "/construction/rfis/v3/projects"
paths:
  "/construction/rfis/v3/projects/{projectId}/attributes/{attributeId}":
    patch:
      operationId: rfis-custom-attributes-attributeId-PATCH
      summary: "Updates an existing custom attribute definition for a project"
      description: "Updates an existing custom attribute definition for a project."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You need to convert the project ID into a project ID for the Forma API by removing the “b." prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7.
          schema:
            type: string
            x-forma-type: string
        - name: attributeId
          in: path
          required: true
          description: "The ID of the custom attribute."
          schema:
            type: string
            x-forma-type: string
        - name: Content-Type
          in: header
          required: true
          description: "Must be application/json"
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:write"
            - "data:create"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    x-forma-type: "string: UUID"
                    description: "The ID of the custom attribute definition."
                  name:
                    type: string
                    x-forma-type: string
                    description: |-
                      The name of the custom attribute as displayed in the UI.
                      Max length: 50
                  type:
                    type: string
                    x-forma-type: "enum:string"
                    description: |-
                      The type of the attribute.
                      Possible values: text, numeric
                  description:
                    type: string
                    x-forma-type: string
                    description: |-
                      The description of the attribute as shown in the UI.
                      Max length: 1000
                  status:
                    type: string
                    x-forma-type: "enum:string"
                    description: "The display status of the attribute in the UI. Possible values: active, inactive, hidden."
                  multipleChoice:
                    type: boolean
                    x-forma-type: boolean
                    description: |-
                      true: users can select more than one value for this attribute.
                      false: (default) users can select only one value.
                  possibleValues:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "The unique ID of the attribute value."
                        name:
                          x-forma-type: "string,integer,null"
                          description: |-
                            The name of the attribute value as shown in the UI.
                            Max length: 100
                    x-forma-type: "array: object"
                    description: "A list of possible values for the attribute."
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:write"
        - "data:create"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/rfis-custom-attributes-attributeId-PATCH"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                name:
                  type: string
                  x-forma-type: string
                  description: |-
                    The name of the custom attribute as displayed in the UI.
                    Max length: 50
                description:
                  type: string
                  x-forma-type: string
                  description: |-
                    The description of the attribute as shown in the UI.
                    Max length: 1000
                status:
                  type: string
                  x-forma-type: "enum:string"
                  description: "The display status of the attribute in the UI. Possible values: active, inactive, hidden."
                multipleChoice:
                  type: boolean
                  x-forma-type: boolean
                  description: |-
                    true: users can select more than one value for this attribute.
                    false: (default) users can select only one value.
                possibleValues:
                  type: object
                  x-forma-type: object
                  description: |-
                    Updates the list of possible values for the attribute.
                    To overwrite an existing possible value, specify both newAttributes (the new value name) and deletedAttributes (the ID of the value to remove).
                  properties:
                    newAttributes:
                      x-forma-type: "array: string,null"
                      description: |-
                        Adds new possible values to the attribute.
                        Each item is the name of a new possible value as shown in the UI.
                    updatedAttributes:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            x-forma-type: "string: UUID"
                            description: "The unique ID of the attribute value."
                          name:
                            x-forma-type: "string,integer,null"
                            description: |-
                              The name of the attribute value as shown in the UI.
                              Max length: 100
                        required:
                          - name
                      x-forma-type: "array: object"
                      description: "Updates the names of existing possible values."
                    deletedAttributes:
                      type: array
                      items:
                        type: string
                      x-forma-type: "array: string"
                      description: "Deletes possible values from the attribute. Each item is the ID of a possible value to delete."
  "/construction/rfis/v3/projects/{projectId}/attributes":
    get:
      operationId: rfis-attributes-GET
      summary: "Retrieves all custom attribute definitions for a project"
      description: "Retrieves all custom attribute definitions for a project."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You need to convert the project ID into a project ID for the Forma API by removing the “b." prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7.
          schema:
            type: string
            x-forma-type: string
        - name: limit
          in: query
          description: "The number of RFIs to return in the response. Acceptable values: 1–200. Default: 10. For example, to limit the response to two items per page, use limit=2"
          schema:
            type: integer
            x-forma-type: int
        - name: offset
          in: query
          description: |-
            The number of items to skip before starting to return results.
            For example, to begin the results from the fourth item, use offset=3.
          schema:
            type: integer
            x-forma-type: int
        - name: "filter[status]"
          in: query
          description: "Filters the response to only include custom attributes with the specified status. Possible values: active, inactive, hidden."
          schema:
            type: array
            items:
              type: string
            x-forma-type: "array: string"
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
