  "/construction/rfis/v3/projects/{projectId}/rfi-types":
    get:
      operationId: rfis-RFI-types-GET
      summary: "Retrieves the list of RFI types configured for the specified project"
      description: "Retrieves the list of RFI types configured for the specified project."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You need to convert the project ID into a project ID for the Forma API by removing the “b." prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7.
          schema:
            type: string
            x-forma-type: string
        - name: limit
          in: query
          description: "The number of RFIs to return in the response. Acceptable values: 1–200. Default: 10. For example, to limit the response to two items per page, use limit=2"
          schema:
            type: integer
            x-forma-type: int
        - name: offset
          in: query
          description: |-
            The number of items to skip before starting to return results.
            For example, to begin the results from the fourth item, use offset=3.
          schema:
            type: integer
            x-forma-type: int
        - name: "filter[status]"
          in: query
          description: "Filters the response to only include RFI types with the specified status. Possible values: active, inactive, hidden."
          schema:
            type: array
            items:
              type: string
            x-forma-type: "array: string"
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "The ID of the default RFI type assigned to the project. This is the unique identifier of the RFI type that will be selected by default when creating a new RFI."
                        name:
                          type: string
                          x-forma-type: string
                          description: |-
                            The name of the RFI type, as configured by the project admin. This name is shown in the Forma UI and in the API when selecting an RFI type.
                            Max length: 50
                        wfType:
                          type: string
                          x-forma-type: "enum:string"
                          description: |-
                            The workflow type used for this RFI type.
                            Possible values:

                            - US: The US-style workflow, with a Reviewer and optional Manager.

                            - EU: The EU-style workflow, with a Project Coordinator and Project Reviewer.

                            The workflow type determines the available statuses and workflow roles for RFIs of this type.
                        status:
                          type: string
                          x-forma-type: "enum:string"
                          description: |-
                            The current status of the RFI type.
                            Possible values:

                            - active: The type is available for use when creating or updating RFIs.

                            - inactive: The type exists but cannot currently be selected when creating RFIs.

                            - hidden: The type is hidden from users in the UI but may still appear in the API.

                            Only active types are available by default when creating new RFIs.
                        isDefault:
                          type: boolean
                          x-forma-type: boolean
                          description: |-
                            true: This RFI type is the default for the project.
                            false: (default) This RFI type is not the default.
                        projectReviewer:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                x-forma-type: string
                                description: |-
                                  The Autodesk ID of the user, company, or role.
                                  To find details about users, call GET users, to find details about companies, call GET companies.

                                  Note that we do not currently support finding details about roles for a project.
                              type:
                                type: string
                                x-forma-type: "enum:string"
                                description: "The type of assignee. Possible values: user, company, role."
                          x-forma-type: "array: object"
                          description: "A list of users, companies, or roles that can be assigned to this project role."
                        projectCoordinator:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                x-forma-type: string
                                description: |-
                                  The Autodesk ID of the user, company, or role.
                                  To find details about users, call GET users, to find details about companies, call GET companies.

                                  Note that we do not currently support finding details about roles for a project.
                              type:
                                type: string
                                x-forma-type: "enum:string"
                                description: "The type of assignee. Possible values: user, company, role."
                          x-forma-type: "array: object"
                          description: "A list of users, companies, or roles that can be assigned to this project role."
                        manager:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                x-forma-type: string
                                description: |-
                                  The Autodesk ID of the user, company, or role.
                                  To find details about users, call GET users, to find details about companies, call GET companies.

                                  Note that we do not currently support finding details about roles for a project.
                              type:
                                type: string
                                x-forma-type: "enum:string"
                                description: "The type of assignee. Possible values: user, company, role."
                          x-forma-type: "array: object"
                          description: "A list of users, companies, or roles who can be assigned to this workflow role."
                        watchers:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                x-forma-type: string
                                description: |-
                                  The Autodesk ID of the user, company, or role.
                                  To find details about users, call GET users, to find details about companies, call GET companies.

                                  Note that we do not currently support finding details about roles for a project.
                              type:
                                type: string
                                x-forma-type: "enum:string"
                                description: "The type of assignee. Possible values: user, company, role."
                          x-forma-type: "array: object"
                          description: "A list of users, companies, or roles that can be assigned to this project role."
                        dueDateOffset:
                          x-forma-type: "integer,null"
                          description: "The number of calendar days from the RFI creation date to the default due date. Used to automatically calculate the RFI due date when creating a new RFI of this type."
                        locationDescription:
                          x-forma-type: "string,null"
                          description: |-
                            The default text for the Location field when creating a new RFI.
                            Note that the API does not auto-populate this value.
                            Clients are responsible for applying the default if desired.
                        costImpact:
                          x-forma-type: "string,null"
                          description: |-
                            The default cost impact value for new RFIs of this type.
                            Possible values: null, Yes, No, Unknown.
                        scheduleImpact:
                          x-forma-type: "string,null"
                          description: |-
                            The default schedule impact value for new RFIs of this type.
                            Possible values: null, Yes, No, Unknown.
                        priority:
                          x-forma-type: "string,null"
                          description: |-
                            The default priority for new RFIs of this type.
                            The available priority values are configured in Project Admin.

                            If no default is set, this field is null.

                            Note that the API does not auto-populate this value when creating an RFI.
                            Clients are responsible for applying the default if desired.

                            Some possible values: null, High, Normal, Low.
                        discipline:
                          type: array
                          items:
                            type: string
                          x-forma-type: "array: string"
                          description: |-
                            The list of available disciplines for RFIs.
                            Each discipline is configured in Project Admin.
                            Some possible values: Architectural, Civil/Site, Concrete, Electrical, Exterior Envelope, Fire Protection, Interior/Finishes, Landscaping, Masonry, Mechanical, Plumbing, Structural, Other.
                        category:
                          type: array
                          items:
                            type: string
                          x-forma-type: "array: string"
                          description: |-
                            A list of predefined categories to assign to the RFI.
                            Categories help group RFIs for filtering and reporting. Each value must match a category configured in the project’s RFI settings. Categories are case-sensitive and project-specific.

                            RFI categories are configured in Project Admin and may differ between projects.

                            Some possible values: Code Compliance, Constructability, Design Coordination, Documentation Conflict, Documentation Incomplete, Field condition, Other.
                        reference:
                          x-forma-type: "string,null"
                          description: |-
                            The default value for the Reference field when creating a new RFI.
                            This is typically used when the RFI was created in another system.

                            Note that the API does not auto-populate this value.
                            Clients are responsible for applying the default if desired.

                            Max length: 20
                        bridgeTargetProjectIds:
                          x-forma-type: "array,null"
                          description: "Not relevant"
                    x-forma-type: "array: object"
                    description: "The list of RFI types configured for the project."
                  pagination:
                    type: object
                    x-forma-type: object
                    description: "The pagination object."
                    properties:
                      limit:
                        type: integer
                        x-forma-type: int
                        description: "The number of items returned per page."
                      offset:
                        type: integer
                        x-forma-type: int
                        description: "The number of items skipped before this page of results."
                      totalResults:
                        type: integer
                        x-forma-type: int
                        description: "The total number of items matching the request."
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/rfis-RFI-types-GET"
  "/construction/rfis/v3/projects/{projectId}/rfis/{rfiId}/attachments":
    get:
      operationId: rfis-rfis-id-attachments-GET
      summary: "Retrieves a list of attachments for a specific RFI"
      description: "Retrieves a list of attachments for a specific RFI."
      parameters:
        - name: projectId
          in: path
