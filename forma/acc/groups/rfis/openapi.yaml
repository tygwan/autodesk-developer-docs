  "/construction/rfis/v3/projects/{projectId}/rfis/custom-identifier":
    get:
      operationId: rfis-custom-identifier-GET
      summary: "Returns the current and next available RFI custom identifier for the project"
      description: "Returns the current and next available RFI custom identifier for the project."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            Use the Data Management API to retrieve the project ID. For more information, see the Retrieve a Project ID tutorial. You need to convert the project ID into a project ID for the Forma API by removing the “b." prefix. For example, a project ID of b.a4be0c34a-4ab7 translates to a project ID of a4be0c34a-4ab7.
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:read"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  current:
                    x-forma-type: "string,null"
                    description: "The last custom identifier that was used for an RFI in this project."
                  next:
                    type: string
                    x-forma-type: string
                    description: "The next available custom identifier for the project."
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/rfis-custom-identifier-GET"
