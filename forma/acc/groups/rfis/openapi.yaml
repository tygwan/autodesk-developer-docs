                          description: "The display status of the attribute in the UI. Possible values: active, inactive, hidden."
                        multipleChoice:
                          type: boolean
                          x-forma-type: boolean
                          description: |-
                            true: users can select more than one value for this attribute.
                            false: (default) users can select only one value.
                        possibleValues:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                                x-forma-type: "string: UUID"
                                description: "The unique ID of the attribute value."
                              name:
                                x-forma-type: "string,integer,null"
                                description: |-
                                  The name of the attribute value as shown in the UI.
                                  Max length: 100
                          x-forma-type: "array: object"
                          description: "A list of possible values for the attribute."
                    x-forma-type: "array: object"
                    description: "The list of custom attributes."
                  pagination:
                    type: object
                    x-forma-type: object
                    description: "The pagination object."
                    properties:
                      limit:
                        type: integer
                        x-forma-type: int
                        description: "The number of items returned per page."
                      offset:
                        type: integer
                        x-forma-type: int
                        description: "The number of items skipped before this page of results."
                      totalResults:
                        type: integer
                        x-forma-type: int
                        description: "The total number of items matching the request."
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:read"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/rfis-attributes-GET"
