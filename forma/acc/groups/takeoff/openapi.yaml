                  classificationChanges:
                    type: object
                    x-forma-type: object
                    properties:
                      added:
                        type: integer
                        x-forma-type: int
                        description: "The number of classifications added by the import."
                      deleted:
                        type: integer
                        x-forma-type: int
                        description: "The number of classifications deleted by the import."
                      modified:
                        type: integer
                        x-forma-type: int
                        description: "The number of classifications modified by the import."
                  classificationSystemName:
                    type: string
                    x-forma-type: string
                    description: |-
                      The classification system name.
                      Max length: 200
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "409":
          description: Conflict
        "429":
          description: "Too Many Requests"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:write"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/takeoff-projects-project_id-classification-systems-system_id-classificationsimport-POST"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                classificationSystemName:
                  type: string
                  x-forma-type: string
                  description: |-
                    The classification system name.
                    Max length: 200
                classifications:
                  type: array
                  items:
                    type: object
                    properties:
                      code:
                        type: string
                        x-forma-type: string
                        description: |-
                          The classification code.
                          Max length: 256
                      parentCode:
                        type: string
                        x-forma-type: string
                        description: |-
                          The classification parent code.
                          Its value may be null, indicating that this classification is at the top level of the hierarchy.

                          Max length: 256
                      description:
                        type: string
                        x-forma-type: string
                        description: |-
                          A description of the classification.
                          Max length: 256
                      measurementType:
                        type: string
                        x-forma-type: "enum:string"
                        description: |-
                          Deprecated. Will be removed on September 15, 2025.
                          The type of measurement.

                          Possible values: AREA, COUNT, DISTANCE, VOLUME.
                    required:
                      - code
                      - description
                      - parentCode
                  x-forma-type: "array: object"
                  description: |-
                    The classification hierarchy.
                    The classification hierarchy is configured as a JSON array in the payload, created from a spreadsheet file.

                    Max size: 30000.

                    For more details, see the Forma Configure Takeoff Settings help documentation.
              required:
                - classifications
