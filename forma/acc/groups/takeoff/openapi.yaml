          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: structureId
          in: path
          required: true
          description: "The ID of the Classification Service structure assigned to the project."
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: region
