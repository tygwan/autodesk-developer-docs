      operationId: takeoff-projects-project_id-assigned-structures-GET
      summary: "Retrieves the classification structures (trees) that have been assigned to a Takeoff project"
      description: "Retrieves the classification structures (trees) that have been assigned to a Takeoff project. These structures are defined in the Classifications API."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            This corresponds to project ID in the Data Management API, and can be specified in the form of “UUID” or b.”UUID”.

            To learn how to find the project ID, see the Retrieve Forma hub and project ID tutorial.
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: offset
          in: query
          description: "The number of results to skip before returning data. This is zero-based. For example, offset=2 skips the first two results."
          schema:
            type: integer
            x-forma-type: int
        - name: limit
          in: query
          description: |-
            The maximum number of assigned structures per page.
            Acceptable values: 1-5.

            Default value: 5.
          schema:
            type: integer
            x-forma-type: int
