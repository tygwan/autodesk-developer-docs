openapi: "3.1.0"
info:
  title: "Forma APIs — Takeoff"
  version: v1
  description: |-
    Forma APIs — Takeoff.
    Autodesk 문서에서 자동 추출됨. 원본: https://aps.autodesk.com/en/docs/acc/v1
    공통 base 경로: /construction/takeoff/v1/projects
    **리전 — 호출 전 반드시 확인** 리전은 완전히 분리되어 있고 리소스 식별자가 호환되지 않습니다. ⚠️ **헤더 이름이 그룹마다 다릅니다.** Hub Admin 은 `Region`, Issues 는 `x-ads-region` 입니다. 이 문서의 "헤더" 표에 적힌 이름을 그대로 쓰세요. 통일해서 보내면 안 됩니다. 미지정 시 자동 라우팅되며 지연이 늘 수 있습니다. 자세한 판정은 `_errata` E-003 참고.
servers:
  - url: "https://developer.api.autodesk.com"
x-forma-group: Takeoff
x-forma-common-base: "/construction/takeoff/v1/projects"
paths:
  "/construction/takeoff/v1/projects/{projectId}/assigned-structures:batch-add":
    post:
      operationId: takeoff-projects-project_id-assigned-structuresbatch-add-POST
      summary: "Assigns one or more classification structures (trees) to a Takeoff project"
      description: "Assigns one or more classification structures (trees) to a Takeoff project. A project can have a maximum of five assigned structures."
      parameters:
        - name: projectId
          in: path
          required: true
          description: |-
            The ID of the project.
            This corresponds to project ID in the Data Management API, and can be specified in the form of “UUID” or b.”UUID”.

            To learn how to find the project ID, see the Retrieve Forma hub and project ID tutorial.
          schema:
            type: string
            format: uuid
            x-forma-type: "string: UUID"
        - name: region
          in: header
          description: |-
            Specifies the region where the service is located.
            Possible values: US, EMEA. For the full list of supported regions, see the Regions page.
          schema:
            type: string
            x-forma-type: string
        - name: Content-Type
          in: header
          required: true
          description: "Must be application/json"
          schema:
            type: string
            x-forma-type: string
      security:
        - oauth2:
            - "data:write"
      responses:
        "201":
          description: Created
          content:
            "application/json":
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        structureId:
                          type: string
                          format: uuid
                          x-forma-type: "string: UUID"
                          description: "The ID of the classification structure (tree). Classification trees are defined in the Classifications API. Use the value of the id field returned by GET trees/{treeId}."
                        createdAt:
                          type: string
                          format: date-time
                          x-forma-type: "datetime: ISO 8601"
                          description: "The date and time when the assigned structure was added to the project, in the following format: YYYY-MM-DDThh:mm:ssZ."
                        createdBy:
                          type: string
                          x-forma-type: string
                          description: "The Autodesk ID of the user who added the assigned structure to the project. To find details about the user call GET users."
                    x-forma-type: "array: object"
                    description: "The list of classification structures that were added to the project."
        "400":
          description: "Bad Request"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: "Not Found"
        "409":
          description: Conflict
        "429":
          description: "Too Many Requests"
        "500":
          description: "Internal Server Error"
      x-forma-auth-context: "user context required"
      x-forma-scopes:
        - "data:write"
      x-forma-doc: "https://aps.autodesk.com/en/docs/acc/v1/reference/http/takeoff-projects-project_id-assigned-structuresbatch-add-POST"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                structureId:
                  type: string
                  format: uuid
                  x-forma-type: "string: UUID"
                  description: "The ID of the classification structure (tree). Classification trees are defined in the Classifications API. Use the value of the id field returned by GET trees/{treeId}."
              required:
                - structureId
